name: gift-docs-fix
on:
  push:
    paths:
      - gift-docs-fix.trigger
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update tracking docs
        run: |
          cat >> yapılanlar.txt <<'EOF'

16. 2026-09-17 — HEDİYE SERVER CATALOG KONTROLÜ
- [x] Frontend'deki mevcut 45 hediye ve fiyatları server-side `GIFT_CATALOG` içine taşındı.
- [x] `GiftSend.unit_price` istemci parametresi kaldırıldı.
- [x] Hediye fiyatı artık yalnızca server catalog'dan çözülüyor.
- [x] Geçersiz `gift_key` reddediliyor.
- [x] `RoomGiftEvent.unit_price` server tarafından belirlenen fiyatı kullanıyor.
- [x] Geçici Actions workflow/trigger başarıdan sonra temizlendi.
- [ ] Hediye eventlerinin WebSocket canlı yayınını ekle.
- [ ] Hediye menüsünü gerçek oda UI'sına bağla.
EOF
          cat >> yapılacaklar.txt <<'EOF'

16. 2026-09-17 — HEDİYE SERVER CATALOG KONTROL NOKTASI
- [x] 45 mevcut hediye ve fiyatı server-side catalog'a taşındı.
- [x] İstemcinin `unit_price` göndererek fiyat değiştirmesi kaldırıldı.
- [x] Geçersiz hediye anahtarları reddediliyor.
- [ ] Hediye eventlerini oda WebSocket kanalında canlı yayınla.
- [ ] Hediye menüsünü gerçek oda UI'sına bağla.
- [ ] Railway deploy + gerçek hediye smoke testi.
EOF
      - name: Remove temporary files
        run: rm -f .github/workflows/gift-docs-fix.yml gift-docs-fix.trigger
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yapılanlar.txt yapılacaklar.txt .github/workflows/gift-docs-fix.yml gift-docs-fix.trigger
          git commit -m "docs: record server gift catalog checkpoint"
          git push
