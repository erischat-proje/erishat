name: ErisChat Pages diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository Pages state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const out = {};
            try {
              const r = await github.rest.repos.get({ owner, repo });
              out.repo = {
                default_branch: r.data.default_branch,
                pages_enabled_feature: Boolean(r.data.has_pages),
                visibility: r.data.visibility,
              };
            } catch (e) {
              out.repo_error = String(e);
            }
            try {
              const r = await github.rest.repos.getPages({ owner, repo });
              out.pages = {
                status: r.data.status,
                build_type: r.data.build_type,
                cname: r.data.cname || null,
                html_url: r.data.html_url || null,
              };
            } catch (e) {
              out.pages_error = { status: e.status, message: e.message };
            }
            try {
              const r = await github.rest.repos.getEnvironment({ owner, repo, environment_name: 'github-pages' });
              out.environment = {
                name: r.data.name,
                protection_rules: (r.data.protection_rules || []).map(x => x.type),
              };
            } catch (e) {
              out.environment_error = { status: e.status, message: e.message };
            }
            core.info(JSON.stringify(out, null, 2));
            if (out.pages_error && out.pages_error.status !== 404) {
              core.setFailed(`Pages API diagnostic failed: ${out.pages_error.message}`);
            }

      - name: Validate active Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/erischat-pages.yml
          grep -q 'uses: actions/configure-pages@v5' .github/workflows/erischat-pages.yml
          grep -q 'uses: actions/upload-pages-artifact@v4' .github/workflows/erischat-pages.yml
          grep -q 'uses: actions/deploy-pages@v4' .github/workflows/erischat-pages.yml
          grep -q 'pages: write' .github/workflows/erischat-pages.yml
          grep -q 'id-token: write' .github/workflows/erischat-pages.yml
          grep -q 'name: github-pages' .github/workflows/erischat-pages.yml
          echo 'Active Pages workflow shape OK'

      - name: Verify duplicate legacy Pages workflow is absent
        shell: bash
        run: |
          if test -e .github/workflows/pages.yml; then
            echo 'Legacy duplicate Pages workflow must remain absent.'
            exit 1
          fi
          echo 'No duplicate legacy Pages workflow'

      - name: Validate frontend artifact source
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/erischat-main.html
          for script in \
            platform.js demo-cleanup.js room-live.js gift-live.js room-actions.js \
            room-ban-live.js room-gift-ui-live.js dm-live.js auth-live.js profile-live.js \
            cosmetics.js profile-ui-live.js session-ui-live.js dm-create-live.js; do
            test -s "frontend/$script"
          done
          echo 'Frontend artifact source checks OK'
