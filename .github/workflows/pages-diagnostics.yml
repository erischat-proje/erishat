name: ErisChat CI quality and Pages diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Backend quality
        run: python scripts/check_backend_quality.py
      - name: Room security regression
        run: python scripts/check_room_security.py

  smoke-harness-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile smoke harnesses
        run: |
          python -m py_compile \
            scripts/room_live_smoke.py \
            scripts/room_ban_live_smoke.py \
            scripts/dm_live_smoke.py \
            scripts/cosmetic_live_smoke.py
      - name: Reject stale anonymous auth endpoint
        run: |
          if grep -R -n '\"/auth/anonymous\"' scripts/*_live_smoke.py; then
            echo 'Smoke harnesses must use the current /v1/users registration contract.'
            exit 1
          fi
      - name: Verify local smoke safety defaults
        run: |
          grep -F 'http://127.0.0.1:8000' scripts/room_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/room_ban_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/dm_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/cosmetic_live_smoke.py

  cosmetic-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cosmetic inventory
        run: python scripts/check_cosmetic_assets.py

  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erischat
          POSTGRES_USER: erischat
          POSTGRES_PASSWORD: erischat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erischat -d erischat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://erischat:erischat@127.0.0.1:5432/erischat
      ERISCHAT_SMOKE_BASE_URL: http://127.0.0.1:8000
      ERISCHAT_SMOKE_TIMEOUT: "10"
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt websocket-client
      - name: Start local API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/erischat-api.log 2>&1 &
          echo $! > /tmp/erischat-api.pid
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo 'API did not become ready.'
          cat /tmp/erischat-api.log
          exit 1
      - name: Room live smoke
        run: python scripts/room_live_smoke.py
      - name: Room ban live smoke
        run: python scripts/room_ban_live_smoke.py
      - name: DM live smoke
        run: python scripts/dm_live_smoke.py
      - name: Cosmetic live smoke
        run: python scripts/cosmetic_live_smoke.py
      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/erischat-api.log
      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/erischat-api.pid ]; then
            kill "$(cat /tmp/erischat-api.pid)" || true
          fi

  pages-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect repository Pages state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const out = {};
            try {
              const r = await github.rest.repos.get({ owner, repo });
              out.repo = {
                default_branch: r.data.default_branch,
                pages_enabled_feature: Boolean(r.data.has_pages),
                visibility: r.data.visibility,
              };
            } catch (e) {
              out.repo_error = String(e);
            }
            try {
              const r = await github.rest.repos.getPages({ owner, repo });
              out.pages = {
                status: r.data.status,
                build_type: r.data.build_type,
                cname: r.data.cname || null,
                html_url: r.data.html_url || null,
              };
            } catch (e) {
              out.pages_error = {
                status: e.status,
                message: e.message,
              };
            }
            try {
              const r = await github.rest.repos.getEnvironment({ owner, repo, environment_name: 'github-pages' });
              out.environment = {
                name: r.data.name,
                protection_rules: (r.data.protection_rules || []).map(x => x.type),
              };
            } catch (e) {
              out.environment_error = {
                status: e.status,
                message: e.message,
              };
            }
            core.info(JSON.stringify(out, null, 2));
            if (out.pages_error && out.pages_error.status !== 404) {
              core.setFailed(`Pages API diagnostic failed: ${out.pages_error.message}`);
            }

      - name: Validate Pages workflow shape
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/pages.yml
          grep -q 'uses: actions/configure-pages@v5' .github/workflows/pages.yml
          grep -q 'uses: actions/upload-pages-artifact@v4' .github/workflows/pages.yml
          grep -q 'uses: actions/deploy-pages@v4' .github/workflows/pages.yml
          grep -q 'pages: write' .github/workflows/pages.yml
          grep -q 'id-token: write' .github/workflows/pages.yml
          echo 'Pages workflow shape OK'
