name: gift-catalog-fix
on:
  push:
    paths:
      - gift-catalog-fix.trigger
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch gift catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/app/room_routes.py')
          s = p.read_text(encoding='utf-8')
          catalog = '''GIFT_CATALOG = {
              "Zeytin Dalı": 1, "Kil Toprak Çanak": 2, "Pazaryeri Üzümü": 3,
              "Parşömen Rulosu": 4, "Kilden Mühür": 5, "Tunç Broş": 6,
              "Baharat Kesesi": 7, "Antik Çömlek": 8, "Karakalem Sardes Çizimi": 9,
              "Meşale Kıvılcımı": 10, "Gümüş Broş": 12, "Zeytinyağı Şişesi": 13,
              "Antik Tarak": 14, "Seramik Kase": 15, "Tunç Para (Sikke)": 18,
              "Antik Arp": 20, "Zeytin Taç": 30, "Mavi Boncuk / Nazarlık": 40,
              "Kraliyet Şarabı": 50, "Lidya Mühür Yüzüğü": 60, "Poyraz Rüzgarı": 70,
              "Gümüş Sikke Kesesi": 90, "Altın Zeytin Dalı": 100, "Sardes Sütunu": 120,
              "Altın Broş": 150, "Güneş Kursu": 180, "Sardes Altın Feneri": 200,
              "Kral Alyattes’in Kılıcı": 250, "Paktalos Nehri Altını": 350,
              "Antik Savaş Arabası": 500, "Kroisos’un Altın Sikkesi": 750,
              "Kraliyet Asası": 1000, "Anadolu Kaplanı": 1250,
              "Efes Artemis Tapınağı Sütunu": 1500, "Kraliyet Tahtı": 2000,
              "Altın Nehir Yağmuru": 3000, "Eris & Lidya Anıtı": 4500,
              "Kroisos’un Hazinesi": 6000, "Lidya Savaş Gemisi (Trirem)": 8000,
              "Antik Güneş Tanrısı Heykeli": 10000, "Altın Kanatlı Griffin": 12500,
              "Sardes Sarayı": 15000, "Efsanevi Lidyum Aslanı": 17500,
              "Dünyanın İlk Parası Anıtı": 19000, "Kroisos’un Altın Tahtı": 20000,
          }
          '''
          marker = 'GIFT_RECIPIENT_PERCENT = 70\n'
          if 'GIFT_CATALOG = {' not in s:
              s = s.replace(marker, marker + '\n' + catalog)
          old = '    unit_price: int = Field(ge=1, le=10_000_000)\n'
          s = s.replace(old, '')
          old_total = '        total = payload.unit_price * payload.quantity\n        if sender.lidya < total:'
          new_total = '        unit_price = GIFT_CATALOG.get(payload.gift_key)\n        if unit_price is None:\n            raise HTTPException(status_code=400, detail="Geçersiz hediye")\n        total = unit_price * payload.quantity\n        if sender.lidya < total:'
          if old_total not in s:
              raise SystemExit('gift total block not found')
          s = s.replace(old_total, new_total)
          s = s.replace('            unit_price=payload.unit_price,', '            unit_price=unit_price,')
          s = s.replace('            "total_price": total,', '            "unit_price": unit_price,\n            "total_price": total,')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: python3 -m py_compile backend/app/room_routes.py
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/gift-catalog-fix.yml gift-catalog-fix.trigger
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/room_routes.py .github/workflows/gift-catalog-fix.yml gift-catalog-fix.trigger
          git commit -m "security: validate room gifts against server catalog"
          git push
