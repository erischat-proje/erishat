name: build-room-chat
on:
  push:
    paths:
      - 'room-chat.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add room chat backend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/app/room_models.py')
          s=p.read_text(encoding='utf-8')
          if 'class RoomChatMessage(Base):' not in s:
              s += '''\n\nclass RoomChatMessage(Base):\n    __tablename__ = "room_chat_messages"\n    id: Mapped[int] = mapped_column(Integer, primary_key=True, autoincrement=True)\n    room_id: Mapped[str] = mapped_column(ForeignKey("rooms.id", ondelete="CASCADE"), index=True, nullable=False)\n    user_id: Mapped[str] = mapped_column(ForeignKey("users.id", ondelete="CASCADE"), index=True, nullable=False)\n    text: Mapped[str] = mapped_column(Text, nullable=False)\n    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now(), nullable=False)\n'''
              p.write_text(s,encoding='utf-8')
          p=Path('backend/app/main.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('RoomSeat\\n', 'RoomSeat, RoomChatMessage\\n') if 'RoomSeat\\n' in s else s.replace('RoomSeat)', 'RoomSeat, RoomChatMessage)')
          if 'RoomChatMessage' not in s:
              raise SystemExit('RoomChatMessage import patch failed')
          marker='''manager = ConnectionManager()\n\n'''
          block='''manager = ConnectionManager()\nroom_connections: dict[str, set[WebSocket]] = {}\n\nasync def broadcast_room(room_id: str, payload: dict) -> None:\n    for websocket in list(room_connections.get(room_id, set())):\n        try:\n            await websocket.send_json(payload)\n        except Exception:\n            room_connections.get(room_id, set()).discard(websocket)\n\n\n@app.websocket("/ws/rooms/{room_id}")\nasync def room_websocket_endpoint(room_id: str, websocket: WebSocket) -> None:\n    token = websocket.query_params.get("token")\n    if not token:\n        await websocket.close(code=1008, reason="token gerekli")\n        return\n    with Session(engine) as db:\n        user = get_user_from_token(db, token)\n        if not user or not user.is_active:\n            await websocket.close(code=1008, reason="geçersiz oturum")\n            return\n        room = db.get(Room, room_id)\n        member = db.query(RoomMember).filter(RoomMember.room_id == room_id, RoomMember.user_id == user.id).first()\n        if not room or not member:\n            await websocket.close(code=1008, reason="oda üyeliği gerekli")\n            return\n        if not room.chat_enabled:\n            await websocket.close(code=1008, reason="oda sohbeti kapalı")\n            return\n        history = db.query(RoomChatMessage).filter(RoomChatMessage.room_id == room_id).order_by(RoomChatMessage.id.desc()).limit(50).all()\n        history.reverse()\n        history_payload = [{"type":"room_chat","id":m.id,"room_id":room_id,"user_id":m.user_id,"text":m.text,"created_at":m.created_at.isoformat() if m.created_at else None} for m in history]\n    await websocket.accept()\n    room_connections.setdefault(room_id, set()).add(websocket)\n    try:\n        await websocket.send_json({"type":"room_history","messages":history_payload})\n        while True:\n            data = await websocket.receive_json()\n            if not isinstance(data, dict):\n                continue\n            if data.get("type") == "ping":\n                await websocket.send_json({"type":"pong"})\n                continue\n            if data.get("type") != "room_chat":\n                continue\n            text_value = str(data.get("text") or "").strip()\n            if not text_value or len(text_value) > 500:\n                continue\n            with Session(engine) as db:\n                room = db.get(Room, room_id)\n                member = db.query(RoomMember).filter(RoomMember.room_id == room_id, RoomMember.user_id == user.id).first()\n                if not room or not member or not room.chat_enabled:\n                    continue\n                msg = RoomChatMessage(room_id=room_id, user_id=user.id, text=text_value)\n                db.add(msg)\n                db.commit()\n                db.refresh(msg)\n                payload = {"type":"room_chat","id":msg.id,"room_id":room_id,"user_id":user.id,"nickname":user.nickname,"avatar":user.avatar,"text":msg.text,"created_at":msg.created_at.isoformat() if msg.created_at else None}\n            await broadcast_room(room_id, payload)\n    except WebSocketDisconnect:\n        room_connections.get(room_id, set()).discard(websocket)\n    except Exception:\n        room_connections.get(room_id, set()).discard(websocket)\n        try:\n            await websocket.close(code=1011)\n        except Exception:\n            pass\n\n'''
          if 'async def room_websocket_endpoint' not in s:
              if marker not in s: raise SystemExit('websocket insertion marker not found')
              s=s.replace(marker,block,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile backend/app/main.py backend/app/room_models.py
      - name: Connect frontend room chat
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html')
          s=p.read_text(encoding='utf-8')
          if 'let roomSocket=null;' not in s:
              s=s.replace('let activeRoomId=null;\n          let activeRoom=null;', 'let activeRoomId=null;\n          let activeRoom=null;\n          let roomSocket=null;', 1)
          s=s.replace("document.getElementById('roomModal').classList.add('show');", "document.getElementById('roomModal').classList.add('show');\n              connectRoomSocket();", 1)
          s=s.replace("function closeRoom(){activeRoomId=null;activeRoom=null;document.getElementById('roomModal').classList.remove('show')}", "function closeRoom(){if(roomSocket){roomSocket.close();roomSocket=null}activeRoomId=null;activeRoom=null;document.getElementById('roomModal').classList.remove('show')}", 1)
          if 'function connectRoomSocket()' not in s:
              block='''\n          function connectRoomSocket(){\n            if(!activeRoomId)return;\n            if(roomSocket){try{roomSocket.close()}catch(_){}}\n            const token=localStorage.getItem('erischat.token')||localStorage.getItem('token')||'';\n            if(!token)return;\n            const base=API||location.origin;\n            const u=new URL(base);u.protocol=u.protocol==='https:'?'wss:':'ws:';u.pathname='/ws/rooms/'+encodeURIComponent(activeRoomId);u.search='?token='+encodeURIComponent(token);\n            roomSocket=new WebSocket(u.toString());\n            roomSocket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='room_history'){d.messages.forEach(appendRoomMessage)}else if(d.type==='room_chat'){appendRoomMessage(d)}}catch(_){}};\n            roomSocket.onclose=()=>{if(activeRoomId){} };\n          }\n          function appendRoomMessage(m){const log=document.getElementById('roomChatLog');if(log.querySelector('.roomempty'))log.innerHTML='';const d=document.createElement('div');d.className='roomchatmsg';d.textContent=(m.nickname||'Kullanıcı')+': '+(m.text||'');log.appendChild(d);log.scrollTop=log.scrollHeight;}\n          '''
              s=s.replace('</script>',block+'</script>',1)
          old="function sendRoomMessage(){const input=document.getElementById('roomChatInput');const text=input.value.trim();if(!text)return;const log=document.getElementById('roomChatLog');if(log.querySelector('.roomempty'))log.innerHTML='';const d=document.createElement('div');d.className='roomchatmsg';d.textContent='Sen: '+text;log.appendChild(d);input.value='';log.scrollTop=log.scrollHeight;showToast('Mesaj yerel olarak eklendi; WebSocket oda kanalı sonraki adımda bağlanacak.')}"
          new="function sendRoomMessage(){const input=document.getElementById('roomChatInput');const text=input.value.trim();if(!text)return;if(!roomSocket||roomSocket.readyState!==WebSocket.OPEN){showToast('Oda sohbet bağlantısı hazır değil');return}roomSocket.send(JSON.stringify({type:'room_chat',text:text}));input.value='';}"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('frontend/index.html','utf8');[...s.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].forEach((m,i)=>new vm.Script(m[1],{filename:'inline-'+i+'.js'}));console.log('inline-js-ok')"
      - name: Update progress files
        run: |
          cat >> yapılanlar.txt <<'EOF'

14. 2026-09-17 — GERÇEK ODA WEBSOCKET SOHBET
- [x] Oda sohbet mesajları için `RoomChatMessage` veritabanı modeli eklendi.
- [x] `/ws/rooms/{room_id}` oda WebSocket kanalı eklendi; token + oda üyeliği kontrolü yapılıyor.
- [x] Son 50 oda mesajı bağlantı açılışında yükleniyor.
- [x] Yeni oda mesajları veritabanına kaydedilip aynı odadaki bağlı kullanıcılara yayınlanıyor.
- [x] Frontend oda ekranı gerçek oda WebSocket kanalına bağlandı.
- [x] Önceki yerel sohbet gösterimi kaldırılarak gerçek WebSocket gönderimi kullanıldı.
- [ ] Railway deploy ve iki kullanıcıyla canlı oda sohbet testi.
EOF
          cat >> yapılacaklar.txt <<'EOF'

2026-09-17 — ODA SOHBETİ DURUMU
- [x] Gerçek oda WebSocket kanalı ve kalıcı oda sohbet mesaj modeli eklendi.
- [x] Frontend oda sohbeti WebSocket'e bağlandı.
- [ ] Railway üzerinde iki farklı kullanıcıyla canlı oda sohbet testi.
- [ ] Oda hediye sistemini gerçek API + canlı event yayınına bağla.
EOF
          git config user.name 'ErisChat Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py backend/app/room_models.py frontend/index.html yapılanlar.txt yapılacaklar.txt
          git diff --cached --quiet || git commit -m 'feat: add realtime room websocket chat'
          git push
