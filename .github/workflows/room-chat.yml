name: build-room-chat

on:
  push:
    branches: [main]
    paths:
      - 'room-chat.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend realtime room chat
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path('backend/app/room_models.py')
          s = models.read_text(encoding='utf-8')
          if 'class RoomChatMessage(Base):' not in s:
              s += '''\n\nclass RoomChatMessage(Base):\n    __tablename__ = "room_chat_messages"\n    id: Mapped[int] = mapped_column(Integer, primary_key=True, autoincrement=True)\n    room_id: Mapped[str] = mapped_column(ForeignKey("rooms.id", ondelete="CASCADE"), index=True, nullable=False)\n    user_id: Mapped[str] = mapped_column(ForeignKey("users.id", ondelete="CASCADE"), index=True, nullable=False)\n    text: Mapped[str] = mapped_column(Text, nullable=False)\n    created_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now(), nullable=False)\n'''
              models.write_text(s, encoding='utf-8')

          main = Path('backend/app/main.py')
          s = main.read_text(encoding='utf-8')
          old_import = 'from .room_models import Room, RoomBan, RoomGiftEvent, RoomMember, RoomModerator, RoomMusic, RoomSeat'
          new_import = 'from .room_models import Room, RoomBan, RoomGiftEvent, RoomMember, RoomModerator, RoomMusic, RoomSeat, RoomChatMessage'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif 'RoomChatMessage' not in s:
              raise SystemExit('room_models import satırı bulunamadı')

          if 'async def room_websocket_endpoint(' not in s:
              block = r'''\n\nroom_chat_connections: dict[str, set[WebSocket]] = {}\n\nasync def _broadcast_room_chat(room_id: str, payload: dict) -> None:\n    connections = room_chat_connections.get(room_id, set())\n    dead = []\n    for ws in list(connections):\n        try:\n            await ws.send_json(payload)\n        except Exception:\n            dead.append(ws)\n    for ws in dead:\n        connections.discard(ws)\n\n\n@app.websocket("/ws/rooms/{room_id}")\nasync def room_websocket_endpoint(room_id: str, websocket: WebSocket) -> None:\n    token = websocket.query_params.get("token")\n    if not token:\n        await websocket.close(code=1008, reason="token gerekli")\n        return\n\n    with Session(engine) as db:\n        user = get_user_from_token(db, token)\n        if not user or not user.is_active:\n            await websocket.close(code=1008, reason="geçersiz oturum")\n            return\n        room = db.get(Room, room_id)\n        member = db.query(RoomMember).filter(RoomMember.room_id == room_id, RoomMember.user_id == user.id).first()\n        if not room or not member:\n            await websocket.close(code=1008, reason="oda üyeliği gerekli")\n            return\n        if not room.chat_enabled:\n            await websocket.close(code=1008, reason="oda sohbeti kapalı")\n            return\n        history = (db.query(RoomChatMessage)\n                   .filter(RoomChatMessage.room_id == room_id)\n                   .order_by(RoomChatMessage.id.desc())\n                   .limit(50).all())\n        history.reverse()\n        history_payload = [{\n            "type": "room_chat", "id": m.id, "room_id": room_id,\n            "user_id": m.user_id, "text": m.text,\n            "created_at": m.created_at.isoformat() if m.created_at else None\n        } for m in history]\n\n    await websocket.accept()\n    room_chat_connections.setdefault(room_id, set()).add(websocket)\n    try:\n        await websocket.send_json({"type": "room_history", "messages": history_payload})\n        while True:\n            data = await websocket.receive_json()\n            if not isinstance(data, dict):\n                continue\n            if data.get("type") == "ping":\n                await websocket.send_json({"type": "pong"})\n                continue\n            if data.get("type") != "room_chat":\n                continue\n            text_value = str(data.get("text") or "").strip()\n            if not text_value or len(text_value) > 500:\n                continue\n            with Session(engine) as db:\n                room = db.get(Room, room_id)\n                member = db.query(RoomMember).filter(RoomMember.room_id == room_id, RoomMember.user_id == user.id).first()\n                if not room or not member or not room.chat_enabled:\n                    continue\n                msg = RoomChatMessage(room_id=room_id, user_id=user.id, text=text_value)\n                db.add(msg)\n                db.commit()\n                db.refresh(msg)\n                payload = {\n                    "type": "room_chat", "id": msg.id, "room_id": room_id,\n                    "user_id": user.id, "nickname": user.nickname,\n                    "avatar": user.avatar, "text": msg.text,\n                    "created_at": msg.created_at.isoformat() if msg.created_at else None\n                }\n            await _broadcast_room_chat(room_id, payload)\n    except WebSocketDisconnect:\n        room_chat_connections.get(room_id, set()).discard(websocket)\n    except Exception:\n        room_chat_connections.get(room_id, set()).discard(websocket)\n        try:\n            await websocket.close(code=1011)\n        except Exception:\n            pass\n'''
              s += block.replace('\\n', '\n')
          main.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile backend/app/main.py backend/app/room_models.py

      - name: Patch frontend realtime room chat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          if 'let roomSocket=null;' not in s:
              s = s.replace('let activeRoomId=null;\nlet activeRoom=null;', 'let activeRoomId=null;\nlet activeRoom=null;\nlet roomSocket=null;', 1)
          if 'function connectRoomSocket()' not in s:
              block = r'''\nfunction connectRoomSocket(){\n  if(!activeRoomId)return;\n  if(roomSocket){try{roomSocket.close()}catch(_){}}\n  const token=localStorage.getItem('erischat.token')||localStorage.getItem('token')||'';\n  if(!token){showToast('Oda sohbeti için oturum gerekli');return;}\n  const base=API||location.origin;\n  const u=new URL(base);\n  u.protocol=u.protocol==='https:'?'wss:':'ws:';\n  u.pathname='/ws/rooms/'+encodeURIComponent(activeRoomId);\n  u.search='?token='+encodeURIComponent(token);\n  roomSocket=new WebSocket(u.toString());\n  roomSocket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='room_history'){const log=document.getElementById('roomChatLog');log.innerHTML='';d.messages.forEach(appendRoomMessage);if(!d.messages.length)log.innerHTML='<div class="roomempty">Henüz mesaj yok.</div>';}else if(d.type==='room_chat'){appendRoomMessage(d);}}catch(_){}};\n  roomSocket.onerror=()=>showToast('Oda sohbet bağlantısı kurulamadı');\n}\nfunction appendRoomMessage(m){const log=document.getElementById('roomChatLog');if(log.querySelector('.roomempty'))log.innerHTML='';const d=document.createElement('div');d.className='roomchatmsg';d.textContent=(m.nickname||'Kullanıcı')+': '+(m.text||'');log.appendChild(d);log.scrollTop=log.scrollHeight;}\n'''
              s = s.replace('</script>', block.replace('\\n','\n')+'</script>', 1)
          if 'connectRoomSocket();' not in s:
              s = s.replace("document.getElementById('roomModal').classList.add('show');", "document.getElementById('roomModal').classList.add('show');\n    connectRoomSocket();", 1)
          old = "function sendRoomMessage(){const input=document.getElementById('roomChatInput');const text=input.value.trim();if(!text)return;const log=document.getElementById('roomChatLog');if(log.querySelector('.roomempty'))log.innerHTML='';const d=document.createElement('div');d.className='roomchatmsg';d.textContent='Sen: '+text;log.appendChild(d);input.value='';log.scrollTop=log.scrollHeight;showToast('Mesaj yerel olarak eklendi; WebSocket oda kanalı sonraki adımda bağlanacak.')}"
          new = "function sendRoomMessage(){const input=document.getElementById('roomChatInput');const text=input.value.trim();if(!text)return;if(!roomSocket||roomSocket.readyState!==WebSocket.OPEN){showToast('Oda sohbet bağlantısı hazır değil');return;}roomSocket.send(JSON.stringify({type:'room_chat',text:text}));input.value='';}"
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('frontend/index.html','utf8');[...s.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].forEach((m,i)=>new vm.Script(m[1],{filename:'inline-'+i+'.js'}));console.log('inline-js-ok')"

      - name: Commit
        run: |
          git config user.name 'ErisChat Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py backend/app/room_models.py frontend/index.html
          git diff --cached --quiet || git commit -m 'feat: add realtime room websocket chat'
          git push
