name: gift-ui-v2
on:
  push:
    paths:
      - gift-ui-v2.trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gift catalog and room UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/app/room_routes.py')
          s=p.read_text()
          marker='    @router.get("/{room_id}/gift-leaderboard")\n'
          endpoint='''    @router.get("/{room_id}/gift-catalog")\n    def gift_catalog(room_id: str, db: Session = Depends(get_db), user: User = Depends(current_user_dependency)):\n        room = get_room_or_404(db, room_id)\n        if not is_member(db, room.id, user.id):\n            raise HTTPException(status_code=403, detail="Odaya katılmalısınız")\n        return [{"gift_key": key, "unit_price": price, "animation": price >= 30} for key, price in GIFT_CATALOG.items()]\n\n'''
          if 'def gift_catalog(' not in s:
              if marker not in s: raise SystemExit('gift leaderboard marker not found')
              s=s.replace(marker,endpoint+marker,1)
          p.write_text(s)

          p=Path('frontend/index.html')
          s=p.read_text()
          # Add a compact gift feed to the real room screen if absent.
          marker='<div class="roomchat"><div class="section-title"><h3>Oda Sohbeti</h3>'
          if 'id="roomGiftFeed"' not in s and marker in s:
              giftbox='<div class="roomchat"><div class="section-title"><h3>🎁 Hediye Akışı</h3><button class="back" onclick="refreshRoomGifts()">Yenile</button></div><div id="roomGiftFeed" class="roomchatlog"><div class="roomempty">Henüz hediye yok.</div></div><button class="action" onclick="openRoomGiftMenu()">🎁 Hediye Gönder</button></div>'
              s=s.replace(marker,giftbox+marker,1)
          # Replace any old placeholder gift button.
          s=s.replace("showToast('Hediye menüsü bir sonraki adımda gerçek API’ye bağlanacak 🎁')","openRoomGiftMenu()")
          js=r'''\nasync function openRoomGiftMenu(){
  if(!activeRoomId)return;
  let catalog=[];
  try{catalog=await request('/v1/rooms/'+encodeURIComponent(activeRoomId)+'/gift-catalog')}catch(e){showToast(e.message||'Hediye listesi alınamadı');return;}
  const seats=(activeRoom?.seats||[]).filter(x=>x.user_id);
  const uid=getCurrentUserId();
  const box=document.getElementById('roomGiftDetail');
  if(!box){showToast('Hediye penceresi hazır değil');return;}
  box.innerHTML='<h2>🎁 Hediye Gönder</h2><p class="muted">Fiyat ve kazanç kuralları sunucu tarafından belirlenir. Tek gönderimde en fazla 99 adet.</p><label class="muted">Alıcı</label><select id="roomGiftRecipient" style="width:100%;margin:7px 0;padding:11px;border-radius:12px;background:#17111e;color:#fff;border:1px solid #ffffff18"><option value="self">Kendim</option>'+seats.filter(x=>x.user_id!==uid).map(x=>'<option value="'+x.user_id+'">Mikrofon • '+x.user_id+'</option>').join('')+'<option value="all_mic">Mikrofondaki herkes</option></select><label class="muted">Hediye</label><select id="roomGiftKey" style="width:100%;margin:7px 0;padding:11px;border-radius:12px;background:#17111e;color:#fff;border:1px solid #ffffff18">'+catalog.map(g=>'<option value="'+g.gift_key.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+g.gift_key+' • '+Number(g.unit_price).toLocaleString('tr-TR')+' Lidya'+(g.animation?' • ✨':'')+'</option>').join('')+'</select><label class="muted">Adet</label><input id="roomGiftQty" type="number" min="1" max="99" value="1" style="width:100%;margin:7px 0;padding:11px;border-radius:12px;background:#17111e;color:#fff;border:1px solid #ffffff18"><button class="action" onclick="sendRoomGift()">Gönder 🎁</button>';
  document.getElementById('roomGiftModal').classList.add('show');
}
async function sendRoomGift(){
  const sel=document.getElementById('roomGiftRecipient');
  const gift=document.getElementById('roomGiftKey');
  const qty=Math.max(1,Math.min(99,Number(document.getElementById('roomGiftQty').value)||1));
  const val=sel.value; const targets=val==='self'?[getCurrentUserId()]:val==='all_mic'?[...(activeRoom?.seats||[]).filter(x=>x.user_id).map(x=>x.user_id)]:[val];
  if(!targets.length){showToast('Alıcı bulunamadı');return;}
  try{let n=0;for(const id of [...new Set(targets)]){const r=await request('/v1/rooms/'+encodeURIComponent(activeRoomId)+'/gifts',{method:'POST',body:JSON.stringify({recipient_id:id,gift_key:gift.value,quantity:qty})});n+=Number(r.quantity||qty);}closeModal('roomGiftModal');await refreshRoom();await refreshRoomGifts();showToast(n+' hediye gönderildi 🎁');}catch(e){showToast(e.message||'Hediye gönderilemedi');}
}
async function refreshRoomGifts(){
  if(!activeRoomId)return;
  try{const rows=await request('/v1/rooms/'+encodeURIComponent(activeRoomId)+'/gift-events?limit=20');const el=document.getElementById('roomGiftFeed');if(!el)return;el.innerHTML=rows.length?rows.slice().reverse().map(x=>'<div class="roomchatmsg">🎁 '+(x.sender_id||'Kullanıcı')+' → '+(x.recipient_id||'Kullanıcı')+' • '+x.gift_key+' ×'+x.quantity+' • '+Number(x.total_price||0).toLocaleString('tr-TR')+' Lidya</div>').join(''):'<div class="roomempty">Henüz hediye yok.</div>';}catch(_){}}
'''
          if 'async function openRoomGiftMenu()' not in s:
              ins='</script><script>'
              if ins not in s: raise SystemExit('script insertion marker not found')
              s=s.replace(ins,js+ins,1)
          # Ensure the gift modal exists.
          if 'id="roomGiftModal"' not in s:
              toast='<div id="toast" class="toast"></div>'
              modal='<div id="roomGiftModal" class="modal"><div class="modalbox"><button class="close" onclick="closeModal(\'roomGiftModal\')">×</button><div id="roomGiftDetail"></div></div></div>'
              if toast not in s: raise SystemExit('toast marker not found')
              s=s.replace(toast,modal+toast,1)
          # Poll while the room is open so gift feed stays near-real-time without trusting clients.
          if 'window.__roomGiftPoll' not in s:
              s=s.replace('connectRoomSocket();','connectRoomSocket();\n  refreshRoomGifts();\n  clearInterval(window.__roomGiftPoll); window.__roomGiftPoll=setInterval(refreshRoomGifts,2000);',1)
              s=s.replace('function closeRoom(){activeRoomId=null;activeRoom=null;','function closeRoom(){clearInterval(window.__roomGiftPoll);activeRoomId=null;activeRoom=null;',1)
          p.write_text(s)
          PY
          python3 -m py_compile backend/app/main.py backend/app/room_routes.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('frontend/index.html').read_text()
          chunks=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/frontend.js').write_text('\n'.join(chunks))
          PY
          node --check /tmp/frontend.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/room_routes.py frontend/index.html
          git commit -m 'feat: connect real room gift menu' || true
          git push
      - name: Cleanup
        if: success()
        run: |
          git rm -f .github/workflows/gift-ui-v2.yml gift-ui-v2.trigger || true
          git commit -m 'chore: remove temporary gift ui workflow' || true
          git push || true
