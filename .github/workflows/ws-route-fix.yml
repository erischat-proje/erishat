name: ErisChat websocket route fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move frontend mount below websocket routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/main.py')
          s = p.read_text(encoding='utf-8')
          mount = '''\n\nfrontend_path = Path(__file__).resolve().parents[2] / "frontend"\nif frontend_path.is_dir():\n    app.mount("/", StaticFiles(directory=str(frontend_path), html=True), name="frontend")\n'''
          if mount not in s:
              raise SystemExit('frontend mount block not found')
          ws_marker = '\n\n@app.websocket("/ws/rooms/{room_id}")'
          mount_index = s.index(mount)
          ws_index = s.index(ws_marker)
          if mount_index < ws_index:
              s = s[:mount_index] + s[mount_index + len(mount):]
              ws_index = s.index(ws_marker)
              s = s[:ws_index] + mount + s[ws_index:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile backend/app/main.py
          python - <<'PY'
          from pathlib import Path
          s=Path('backend/app/main.py').read_text(encoding='utf-8')
          assert s.index('@app.websocket("/ws/rooms/{room_id}")') < s.index('app.mount("/", StaticFiles')
          print('websocket route precedes frontend mount')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'fix(ws): register room websocket before frontend mount'; git push; fi
