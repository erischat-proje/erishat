name: ErisChat Pages runner isolation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-runner-isolation.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  isolation:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Runner reached
        run: echo "ERISCHAT_PAGES_RUNNER_REACHED"
      - name: Pages context
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
