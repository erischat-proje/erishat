name: Deploy ErisChat frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R frontend/. _site/
          if [ -f _site/erischat-main.html ]; then
            cp _site/erischat-main.html _site/index.html
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '</body>'
          scripts = [
              'platform.js',
              'room-live.js',
              'gift-live.js',
              'dm-live.js',
          ]
          for name in scripts:
              tag = f'<script src="./{name}"></script>'
              if tag not in text:
                  text = text.replace(marker, tag + marker)
          p.write_text(text, encoding='utf-8')
          PY
          touch _site/.nojekyll
          test -f _site/index.html
          echo "Prepared Pages site:"
          find _site -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
