name: Deploy ErisChat frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ERISCHAT_API: https://erischat-production.up.railway.app/v1

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Backend quality
        run: python scripts/check_backend_quality.py
      - name: Room security regression
        run: python scripts/check_room_security.py

  smoke-harness-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile smoke harnesses
        run: |
          python -m py_compile \
            scripts/anonymous_session_live_smoke.py \
            scripts/room_live_smoke.py \
            scripts/room_ban_live_smoke.py \
            scripts/dm_live_smoke.py \
            scripts/cosmetic_live_smoke.py
      - name: Reject stale anonymous auth endpoint
        run: |
          if grep -R -n '\"/auth/anonymous\"' scripts/*_live_smoke.py; then
            echo 'Smoke harnesses must use the current /v1/users registration contract.'
            exit 1
          fi
      - name: Verify local smoke safety defaults
        run: |
          grep -F 'http://127.0.0.1:8000' scripts/anonymous_session_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/room_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/room_ban_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/dm_live_smoke.py
          grep -F 'http://127.0.0.1:8000' scripts/cosmetic_live_smoke.py

  cosmetic-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cosmetic inventory
        run: python scripts/check_cosmetic_assets.py

  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erischat
          POSTGRES_USER: erischat
          POSTGRES_PASSWORD: erischat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erischat -d erischat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://erischat:erischat@127.0.0.1:5432/erischat
      ERISCHAT_SMOKE_BASE_URL: http://127.0.0.1:8000
      ERISCHAT_SMOKE_TIMEOUT: "10"
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt websocket-client
      - name: Start local API
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/erischat-api.log 2>&1 &
          echo $! > /tmp/erischat-api.pid
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo 'API did not become ready.'
          cat /tmp/erischat-api.log
          exit 1
      - name: Anonymous session live smoke
        run: python scripts/anonymous_session_live_smoke.py
      - name: Room live smoke
        run: python scripts/room_live_smoke.py
      - name: Room ban live smoke
        run: python scripts/room_ban_live_smoke.py
      - name: DM live smoke
        run: python scripts/dm_live_smoke.py
      - name: Cosmetic live smoke
        run: python scripts/cosmetic_live_smoke.py
      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/erischat-api.log
      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/erischat-api.pid ]; then
            kill "$(cat /tmp/erischat-api.pid)" || true
          fi

  deploy:
    needs: [backend-quality, smoke-harness-quality, cosmetic-inventory, live-e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R frontend/. _site/
          if [ -f _site/erischat-main.html ]; then
            cp _site/erischat-main.html _site/index.html
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in text:
              raise SystemExit('index.html body marker missing')
          scripts = [
              'platform.js',
              'demo-cleanup.js',
              'room-live.js',
              'gift-live.js',
              'room-actions.js',
              'room-ban-live.js',
              'room-gift-ui-live.js',
              'dm-live.js',
              'auth-live.js',
              'profile-live.js',
              'cosmetics.js',
              'profile-ui-live.js',
              'session-ui-live.js',
              'dm-create-live.js',
          ]
          for name in scripts:
              tag = f'<script src="./{name}"></script>'
              if tag not in text:
                  text = text.replace(marker, tag + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          for asset in platform.js demo-cleanup.js room-live.js gift-live.js room-actions.js room-ban-live.js room-gift-ui-live.js dm-live.js auth-live.js profile-live.js cosmetics.js profile-ui-live.js session-ui-live.js dm-create-live.js; do
            test -s "_site/$asset"
          done
          echo "Prepared Pages site:"
          find _site -maxdepth 2 -type f | sort | head -100

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
