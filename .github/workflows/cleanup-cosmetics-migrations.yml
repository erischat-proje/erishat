name: Cleanup cosmetics migration duplicates

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/app/main.py'
      - '.github/workflows/cleanup-cosmetics-migrations.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate cosmetics migration statements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/app/main.py')
          text = path.read_text(encoding='utf-8')
          targets = {
              "conn.execute(text(\"ALTER TABLE users ADD COLUMN IF NOT EXISTS gender VARCHAR(16) NOT NULL DEFAULT 'unspecified'\"))",
              'conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS avatar_asset VARCHAR(255)"))',
              'conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS frame_asset VARCHAR(255)"))',
          }

          seen = set()
          output = []
          for line in text.splitlines(keepends=True):
              stripped = line.strip()
              if stripped in targets:
                  if stripped in seen:
                      continue
                  seen.add(stripped)
              output.append(line)

          updated = ''.join(output)
          if updated != text:
              path.write_text(updated, encoding='utf-8')
              print('Duplicate migration statements removed.')
          else:
              print('No duplicate migration statements found.')
          PY

      - name: Commit cleanup if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'fix: remove duplicate cosmetics migration statements'
            git push
          fi
