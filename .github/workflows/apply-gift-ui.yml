name: Apply Gift UI

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NO_PROXY: 127.0.0.1,localhost
  no_proxy: 127.0.0.1,localhost

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch served frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/erischat-main.html')
          s=p.read_text(encoding='utf-8')
          start='<div class="rooms"><button class="room" onclick="openChat(\'Rana’nın Odası\',\'R\')">'
          if start in s and 'id="realRooms"' not in s:
              a=s.index(start)
              b=s.index('</div><div class="section"><h3>Hızlı erişim</h3>',a)+6
              real='''<div class="rooms" id="realRooms"><div class="card" style="padding:16px;text-align:center;color:#938a9f;font-size:10px">Gerçek odalar yükleniyor…</div></div>'''
              s=s[:a]+real+s[b:]
          old='<div id="rooms" class="list"><button class="item" onclick="openChat(\'Popüler Sohbet\',\'P\')"><div class="ava">🔥</div><div class="grow"><b>Popüler Sohbet</b><small>128 kişi aktif</small></div><span class="live">CANLI</span></button><button class="item" onclick="openChat(\'Gece Ekibi\',\'G\')"><div class="ava">🌙</div><div class="grow"><b>Gece Ekibi</b><small>64 kişi aktif</small></div></button></div>'
          if old in s:
              s=s.replace(old,'<div id="rooms" class="list"><div class="card" style="padding:16px;text-align:center;color:#938a9f;font-size:10px">Gerçek odalar yükleniyor…</div></div>',1)
          if 'id="realRoomModal"' not in s:
              anchor='<div id="toast" class="toast"></div>'
              modal='''<div id="realRoomModal" class="modal"><div class="sheet"><div class="sheetHead"><div><b id="realRoomTitle">Oda</b><small id="realRoomMeta" class="muted" style="display:block;margin-top:4px">Gerçek oda</small></div><button class="close" onclick="closeRealRoom()">×</button></div><div id="realRoomSeats" class="list"></div><div style="margin-top:10px"><button class="primary" style="height:42px;width:100%" onclick="openRoomGift()">🎁 Hediye gönder</button></div><div class="card" style="margin-top:10px;padding:12px"><div id="realRoomChat" style="min-height:80px;max-height:180px;overflow:auto;font-size:10px;color:#aaa1b1"></div><div class="compose" style="padding:10px 0 0;border:0"><input id="realRoomMsg" placeholder="Odaya mesaj yaz…"><button class="primary" onclick="sendRealRoomMessage()">➤</button></div></div></div></div>'''
              if anchor not in s: raise SystemExit('toast anchor missing')
              s=s.replace(anchor,modal+anchor,1)
          if '<script src="gift-live.js"></script>' not in s:
              s=s.replace('</body>','<script src="gift-live.js"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/erischat-main.html').read_text(encoding='utf-8')
          for x in ['realRooms','openRoomGift','gift-live.js']:
              assert x in s,x
          assert 'joinAndOpen' not in s
          print('served frontend gift UI valid')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/erischat-main.html
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'feat(room): connect served frontend to live gift events'; git push; fi

  quality-runner-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt websocket-client
      - name: Start PostgreSQL
        run: |
          docker run -d --name erischat-postgres -e POSTGRES_DB=erischat -e POSTGRES_USER=erischat -e POSTGRES_PASSWORD=erischat -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do docker exec erischat-postgres pg_isready -U erischat -d erischat && break; sleep 2; done
      - name: Static quality
        run: |
          python scripts/check_backend_quality.py
          python scripts/check_room_security.py
          python scripts/check_cosmetic_assets.py
          python -m py_compile scripts/room_live_smoke.py scripts/room_ban_live_smoke.py scripts/dm_live_smoke.py scripts/cosmetic_live_smoke.py
      - name: Start API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://erischat:erischat@127.0.0.1:5432/erischat
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/erischat-api.log 2>&1 &
          echo $! > /tmp/erischat-api.pid
      - name: Wait for API
        run: |
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/ready && exit 0 || true; sleep 2; done
          cat /tmp/erischat-api.log
          exit 1
      - name: Live room smoke
        run: python scripts/room_live_smoke.py
      - name: Live ban smoke
        run: python scripts/room_ban_live_smoke.py
      - name: Live DM smoke
        run: python scripts/dm_live_smoke.py
      - name: Live cosmetic smoke
        run: python scripts/cosmetic_live_smoke.py
      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/erischat-api.log

