name: Apply Gift UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch served frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/erischat-main.html')
          s=p.read_text(encoding='utf-8')

          # Turn the static room list into a real API-backed room list.
          start='<div class="rooms"><button class="room" onclick="openChat(\'Rana’nın Odası\',\'R\')">'
          if start in s and 'id="realRooms"' not in s:
              a=s.index(start)
              b=s.index('</div><div class="section"><h3>Hızlı erişim</h3>',a)+6
              real='''<div class="rooms" id="realRooms"><div class="card" style="padding:16px;text-align:center;color:#938a9f;font-size:10px">Gerçek odalar yükleniyor…</div></div>'''
              s=s[:a]+real+s[b:]

          # Replace explore's static rooms list with a real list.
          old='<div id="rooms" class="list"><button class="item" onclick="openChat(\'Popüler Sohbet\',\'P\')"><div class="ava">🔥</div><div class="grow"><b>Popüler Sohbet</b><small>128 kişi aktif</small></div><span class="live">CANLI</span></button><button class="item" onclick="openChat(\'Gece Ekibi\',\'G\')"><div class="ava">🌙</div><div class="grow"><b>Gece Ekibi</b><small>64 kişi aktif</small></div></button></div>'
          if old in s:
              s=s.replace(old,'<div id="rooms" class="list"><div class="card" style="padding:16px;text-align:center;color:#938a9f;font-size:10px">Gerçek odalar yükleniyor…</div></div>',1)

          # Add a room sheet immediately before the existing toast.
          if 'id="realRoomModal"' not in s:
              anchor='<div id="toast" class="toast"></div>'
              modal='''<div id="realRoomModal" class="modal"><div class="sheet"><div class="sheetHead"><div><b id="realRoomTitle">Oda</b><small id="realRoomMeta" class="muted" style="display:block;margin-top:4px">Gerçek oda</small></div><button class="close" onclick="closeRealRoom()">×</button></div><div id="realRoomSeats" class="list"></div><div style="margin-top:10px"><button class="primary" style="height:42px;width:100%" onclick="openRoomGift()">🎁 Hediye gönder</button></div><div class="card" style="margin-top:10px;padding:12px"><div id="realRoomChat" style="min-height:80px;max-height:180px;overflow:auto;font-size:10px;color:#aaa1b1"></div><div class="compose" style="padding:10px 0 0;border:0"><input id="realRoomMsg" placeholder="Odaya mesaj yaz…"><button class="primary" onclick="sendRealRoomMessage()">➤</button></div></div></div></div>'''
              if anchor not in s: raise SystemExit('toast anchor missing')
              s=s.replace(anchor,modal+anchor,1)

          js='''\n<script>\n(function(){\n const API=(window.ERISCHAT_API_BASE||localStorage.getItem('erischat.apiBase')||location.origin).replace(/\\/$/,'');\n const TOKEN=()=>localStorage.getItem('erischat.accessToken.v1')||localStorage.getItem('token')||'';\n let activeRoom=null, giftCatalog=[], giftKey=null, giftTarget='self';\n async function api(path,options={}){\n  const headers=Object.assign({'Content-Type':'application/json'},options.headers||{}); const t=TOKEN(); if(t)headers.Authorization='Bearer '+t;\n  const r=await fetch(API+path,Object.assign({},options,{headers})); let b={}; try{b=await r.json()}catch(_){} if(!r.ok)throw new Error(b.detail||('API '+r.status)); return b;\n }\n function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}\n async function loadRooms(){\n  try{const rows=await api('/v1/rooms'); const list=Array.isArray(rows)?rows.sort((a,b)=>(b.member_count||0)-(a.member_count||0)):[];\n   const render=(box,compact)=>{box.innerHTML=''; if(!list.length){box.innerHTML='<div class="card" style="padding:16px;text-align:center;color:#938a9f;font-size:10px">Henüz oluşturulmuş oda yok.</div>';return;} (compact?list.slice(0,3):list).forEach(r=>{const b=document.createElement('button');b.className=compact?'room':'item';b.innerHTML='<div class="ava round">'+esc((r.name||'E').trim().charAt(0).toUpperCase())+'</div><div class="grow roomText"><b>'+esc(r.name||'İsimsiz Oda')+(r.locked?' 🔒':'')+'</b><small>'+Number(r.member_count||0)+' kişi • Seviye '+Number(r.level||1)+'</small></div><span class="live">CANLI</span>';b.onclick=()=>joinAndOpen(r.id);box.appendChild(b)});};\n   render(document.getElementById('realRooms'),true); render(document.getElementById('rooms'),false);\n  }catch(e){const m='<div class="card" style="padding:16px;text-align:center;color:#938a9f;font-size:10px">Oda listesi alınamadı.</div>';['realRooms','rooms'].forEach(id=>{const x=document.getElementById(id);if(x)x.innerHTML=m})}\n }\n async function joinAndOpen(id){try{await api('/v1/rooms/'+encodeURIComponent(id)+'/join',{method:'POST'}); activeRoom=await api('/v1/rooms/'+encodeURIComponent(id)); renderRoom(); document.getElementById('realRoomModal').classList.add('show');}catch(e){toast(e.message||'Odaya girilemedi')}}\n function renderRoom(){document.getElementById('realRoomTitle').textContent=activeRoom.name||'Oda';document.getElementById('realRoomMeta').textContent='Seviye '+(activeRoom.level||1)+' • '+(activeRoom.member_count||0)+' kişi';const box=document.getElementById('realRoomSeats');box.innerHTML='';(activeRoom.seats||[]).forEach(s=>{const b=document.createElement('button');b.className='item';b.innerHTML='<div class="ava">'+(s.locked?'🔒':s.user_id?'🎙️':'🎤')+'</div><div class="grow"><b>Koltuk '+s.seat_number+'</b><small>'+(s.user_id?'Dolu':'Boş')+'</small></div>';if(!s.locked&&!s.user_id)b.onclick=()=>takeSeat(s.seat_number);box.appendChild(b)});document.getElementById('realRoomChat').innerHTML='<div style="padding:8px">Oda sohbeti hazır. Hediye sistemi sunucuya bağlı.</div>'}\n async function takeSeat(n){try{await api('/v1/rooms/'+encodeURIComponent(activeRoom.id)+'/seats/'+n+'/join',{method:'POST'});activeRoom=await api('/v1/rooms/'+encodeURIComponent(activeRoom.id));renderRoom();toast('Koltuk alındı 🎙️')}catch(e){toast(e.message||'Koltuk alınamadı')}}\n window.closeRealRoom=()=>document.getElementById('realRoomModal').classList.remove('show');\n window.openRoomGift=async()=>{if(!activeRoom){toast('Önce bir oda aç');return;}try{giftCatalog=await api('/v1/rooms/'+encodeURIComponent(activeRoom.id)+'/gift-catalog');giftKey=null;giftTarget='self';renderGiftModal();}catch(e){toast(e.message||'Hediyeler yüklenemedi')}}\n function renderGiftModal(){let el=document.getElementById('giftUiModal');if(!el){el=document.createElement('div');el.id='giftUiModal';el.className='modal';el.innerHTML='<div class="sheet"><div class="sheetHead"><b>🎁 Hediye Gönder</b><button class="close" onclick="document.getElementById(\\'giftUiModal\\').classList.remove(\\'show\\')">×</button></div><div id="giftUiTargets" class="tabs"><button class="tab active" onclick="window.giftTarget=\\'self\\';window.renderGiftUi()">👤 Kendim</button><button class="tab" onclick="window.giftTarget=\\'mic\\';window.renderGiftUi()">🎙️ Mikrofondakiler</button></div><div id="giftUiGrid" class="giftGrid"></div><div style="display:flex;gap:8px;margin-top:10px;align-items:center"><span class="muted">Adet</span><input id="giftUiQty" type="number" min="1" max="99" value="1" style="width:90px;background:#ffffff08;border:1px solid #ffffff12;color:#fff;border-radius:12px;padding:10px"><button class="primary" onclick="window.sendGiftUi()">Gönder</button></div></div></div>';document.body.appendChild(el)}document.getElementById('giftUiModal').classList.add('show');window.giftTarget=giftTarget;window.renderGiftUi=()=>{const box=document.getElementById('giftUiGrid');box.innerHTML='';giftCatalog.forEach(g=>{const b=document.createElement('button');b.className='gift';b.innerHTML='<em>🎁</em><b>'+esc(g.gift_key)+'</b><small>'+Number(g.unit_price).toLocaleString('tr-TR')+' Lidya'+(g.animation?' • animasyon':'')+'</small>';b.onclick=()=>{giftKey=g.gift_key;document.querySelectorAll('#giftUiGrid .gift').forEach(x=>x.style.outline='none');b.style.outline='2px solid #ff68b5'};box.appendChild(b)})};window.renderGiftUi()}\n window.sendGiftUi=async()=>{if(!giftKey){toast('Önce hediye seç');return;}const qty=Math.max(1,Math.min(99,Number(document.getElementById('giftUiQty').value)||1));const me=(JSON.parse(localStorage.getItem('erischat.remoteUser.v1')||'{}').id)||'';let ids=window.giftTarget==='self'?[me]:(activeRoom.seats||[]).filter(s=>s.user_id&&s.user_id!==me).map(s=>s.user_id);ids=[...new Set(ids)].filter(Boolean);if(!ids.length){toast('Alıcı yok');return;}try{for(const id of ids)await api('/v1/rooms/'+encodeURIComponent(activeRoom.id)+'/gifts',{method:'POST',body:JSON.stringify({recipient_id:id,gift_key:giftKey,quantity:qty})});document.getElementById('giftUiModal').classList.remove('show');toast('Hediye gönderildi 🎁');activeRoom=await api('/v1/rooms/'+encodeURIComponent(activeRoom.id));renderRoom();}catch(e){toast(e.message||'Hediye gönderilemedi')}};\n window.sendRealRoomMessage=()=>toast('Oda sohbeti WebSocket bağlantısına hazır.');\n window.addEventListener('load',()=>setTimeout(loadRooms,250));\n})();\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/erischat-main.html').read_text(encoding='utf-8')
          for x in ['realRooms','joinAndOpen','openRoomGift','/gift-catalog','/gifts']:
              assert x in s,x
          print('served frontend gift UI valid')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/erischat-main.html
          if git diff --cached --quiet; then echo 'No changes needed.'; else git commit -m 'feat(room): connect served frontend to real rooms and gifts'; git push; fi
