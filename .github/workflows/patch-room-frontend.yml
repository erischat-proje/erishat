name: patch-room-frontend
on:
  push:
    paths:
      - 'room-frontend.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/index.html'); s=p.read_text(encoding='utf-8')
          old_api="const API=(window.ERISCHAT_API_BASE||localStorage.getItem('erischat.apiBase')||'').replace(/\\\\/$/,'');"
          new_api="const API=(window.ERISCHAT_API_BASE||localStorage.getItem('erischat.apiBase')||location.origin).replace(/\\\\/$/,'');"
          if old_api not in s: raise SystemExit('API base marker not found')
          s=s.replace(old_api,new_api,1)
          old_reg="body:JSON.stringify({nickname:profile.nickname||'Eris',avatar:profile.avatar||'👤'})"
          new_reg="body:JSON.stringify({nickname:profile.nickname||'Eris',avatar:profile.avatar||'👤',gender:localStorage.getItem('erischat.gender')||'unspecified'})"
          if old_reg not in s: raise SystemExit('registration marker not found')
          s=s.replace(old_reg,new_reg,1)
          if 'id="homeRooms"' not in s:
              a=s.index('<div class="rooms">'); b=s.index('</div><div class="section-title"><h3>Hızlı erişim',a)+6
              s=s[:a]+'<div class="rooms" id="homeRooms"><div class="empty">Gerçek odalar yükleniyor…</div></div>'+s[b:]
          if 'Gerçek odalar yükleniyor…</div></div>' not in s:
              pass
          if 'window.ErisChatRooms={reload:' not in s:
              addon='''<script>(function(){const state={rooms:[]};async function loadRooms(){const api=(window.ERISCHAT_API_BASE||localStorage.getItem('erischat.apiBase')||location.origin).replace(/\\/$/,'');const token=localStorage.getItem('erischat.accessToken.v1')||'';const h=token?{Authorization:'Bearer '+token}:{};const home=document.getElementById('homeRooms'),explore=document.getElementById('exploreRooms');if(!home||!explore)return;try{const r=await fetch(api+'/v1/rooms',{headers:h});if(!r.ok)throw new Error();state.rooms=await r.json();state.rooms.sort((a,b)=>(b.member_count||0)-(a.member_count||0));render(home,state.rooms.slice(0,3),true);render(explore,state.rooms,false)}catch(e){home.innerHTML='<div class="empty">'+(token?'Odalar yüklenemedi.':'Oturum hazırlanıyor…')+'</div>';explore.innerHTML='<div class="empty">'+(token?'Odalar yüklenemedi.':'Oturum hazırlanıyor…')+'</div>';setTimeout(loadRooms,1500)}}function render(t,list,home){t.innerHTML='';if(!list.length){t.innerHTML='<div class="empty">Henüz oluşturulmuş oda yok.</div>';return}list.forEach(room=>{const b=document.createElement('button');b.className=home?'room':'item';const n=(room.name||'E').trim();b.innerHTML='<div class="pic">'+(n.charAt(0)||'E')+'</div><div class="roommain"><b>'+String(n).replace(/[&<>\"']/g,'')+(room.locked?' 🔒':'')+'</b><small>'+Number(room.member_count||0)+' kişi • Seviye '+Number(room.level||1)+'</small></div>';b.onclick=async()=>{const r=await fetch(apiFor()+ '/v1/rooms/'+encodeURIComponent(room.id)+'/join',{method:'POST',headers:{Authorization:'Bearer '+localStorage.getItem('erischat.accessToken.v1')}});const d=await r.json().catch(()=>({}));if(!r.ok){showToast(d.detail||'Odaya girilemedi');return}openChat(room.name,n.charAt(0));showToast('Odaya katıldın ✓')};t.appendChild(b)})}function apiFor(){return(window.ERISCHAT_API_BASE||localStorage.getItem('erischat.apiBase')||location.origin).replace(/\\/$/,'')}window.ErisChatRooms={reload:loadRooms,get:()=>state.rooms.slice()};window.addEventListener('load',()=>setTimeout(loadRooms,250));setTimeout(loadRooms,800)})();</script>'''
              s=s.replace('</body>',addon+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('frontend/index.html','utf8');const a=[...s.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].map(x=>x[1]);a.forEach((x,i)=>new vm.Script(x,{filename:'inline-'+i+'.js'}));console.log('inline-js-ok',a.length)"
      - name: Commit patch
        run: |
          git config user.name 'ErisChat Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet || git commit -m 'feat: connect frontend room list to real API'
          git push
