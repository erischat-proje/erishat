name: LidyaChat Play AAB

on:
  pull_request:
    paths:
      - 'android-native/**'
      - 'scripts/build-apk-content.py'
      - 'frontend/**'
      - 'Gereken_icerikler/**'
      - 'hediyesistemi/**'
      - 'avatarveduvarkağıdı/**'
      - '.github/workflows/lidyachat-play-aab.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Android build variant'
        required: true
        default: release
        type: choice
        options:
          - release
          - internal

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 36 SDK using runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_MANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER" || { echo 'Android sdkmanager not found'; exit 1; }
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install media pack tools
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Pack install-time content
        run: python3 scripts/build-apk-content.py --output android-native/app/build/generated/install-content/static-pack
      - name: Restore signing key only for trusted manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          KEY_B64: ${{ secrets.ERISCHAT_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ERISCHAT_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ERISCHAT_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || { echo 'Signing secrets are missing'; exit 1; }
          python3 - <<'PY'
          import os, base64, pathlib, subprocess, re
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'lidyachat-upload.jks'
          file.write_bytes(base64.b64decode(os.environ['KEY_B64'],validate=True))
          file.chmod(0o600)
          res=subprocess.run(['keytool','-list','-v','-keystore',str(file),'-storepass:env','STORE_PASS'],capture_output=True,text=True)
          if res.returncode: raise SystemExit('Signing keystore invalid')
          matches=re.findall(r'Alias name: ([^\r\n]+).*?Entry type: PrivateKeyEntry',res.stdout,re.S)
          if len(matches)!=1: raise SystemExit('Exactly one PrivateKeyEntry required')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('ERISCHAT_SIGNING_FILE='+str(file)+'\nERISCHAT_SIGNING_ALIAS='+matches[0].strip()+'\n')
          PY
      - name: Restore Firebase Android config
        env:
          FIREBASE_CONFIG: ${{ secrets.LIDYACHAT_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CONFIG" || {
            echo "Firebase config secret is missing"
            exit 1
          }
          python3 - <<'PYCODE'
          import os, json
          from pathlib import Path

          config = json.loads(os.environ["FIREBASE_CONFIG"])
          packages = [
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in config.get("client", [])
          ]

          assert "com.erischat.app" in packages, "Wrong Firebase package"

          target = Path("android-native/app/google-services.json")
          target.write_text(
              json.dumps(config),
              encoding="utf-8"
          )
          target.chmod(0o600)
          print("OK: Firebase config restored")
          PYCODE
      - name: Build Android App Bundle
        working-directory: android-native
        env:
          ERISCHAT_KEYSTORE_PASSWORD: ${{ secrets.ERISCHAT_KEYSTORE_PASSWORD }}
          ERISCHAT_KEY_PASSWORD: ${{ secrets.ERISCHAT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ inputs.build_type }}" = "internal" ]; then
            ./gradlew --no-daemon bundleInternal
            echo "AAB_FILE=android-native/app/build/outputs/bundle/internal/app-internal.aab" >> "$GITHUB_ENV"
          else
            ./gradlew --no-daemon bundleRelease
            echo "AAB_FILE=android-native/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
          fi
      - name: Inspect bundle
        run: |
          test -s ${{ env.AAB_FILE }}
          unzip -l ${{ env.AAB_FILE }} | grep -q 'base/manifest/AndroidManifest.xml'
      - name: Verify signed release bundle
        if: github.event_name == 'workflow_dispatch'
        run: jarsigner -verify -verbose -certs ${{ env.AAB_FILE }} >/dev/null
      - name: Upload signed AAB (manual release only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: LidyaChat-Play-Release-AAB
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed internal test AAB
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'internal'
        uses: actions/upload-artifact@v4
        with:
          name: LidyaChat-AdMob-Internal-Test-AAB
          path: ${{ env.AAB_FILE }}
          if-no-files-found: error
          retention-days: 7
