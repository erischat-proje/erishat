name: Apply ErisChat profile settings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-profile-settings.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/erischat-main.html'); s=p.read_text(encoding='utf-8')
          old='''<div class="settings"><button class="setting" onclick="toast('Hesap ayarları')">⚙️<div class="grow"><b>Hesap ayarları</b><small>Temel seçenekler</small></div><span>›</span></button><button class="setting" onclick="toast('Bildirimler')">🔔<div class="grow"><b>Bildirimler</b><small>Bildirim tercihleri</small></div><span>›</span></button><button class="setting" onclick="showView('anon')">🛡️<div class="grow"><b>Gizlilik</b><small>Anonimlik ve görünürlük</small></div><span>›</span></button></div>'''
          new='''<div class="settings"><button class="setting" onclick="toast('Hesap ayarları')">⚙️<div class="grow"><b>Hesap ayarları</b><small>Temel seçenekler</small></div><span>›</span></button><button class="setting" onclick="openNotifications()">🔔<div class="grow"><b>Bildirimler</b><small>Uygulama bildirimlerini aç / kapat</small></div><span>›</span></button><button class="setting" onclick="openPrivacy()">🛡️<div class="grow"><b>Gizlilik</b><small>Profil adı ve görünürlük</small></div><span>›</span></button></div>'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          marker='<section id="search" class="view">'
          views='''<section id="privacy" class="view"><div class="toolbar"><button class="close" onclick="showView('profile')">‹</button><div><div class="eyebrow">GİZLİLİK</div><h2>Profil adı</h2></div></div><div class="card hero"><div class="eyebrow">MEVCUT PROFİL ADI</div><h2 id="privacyCurrentName">Arda</h2><p>Profil adın odalarda ve profilinde görünür. Değiştirmek 300 Lidya tutar.</p></div><div class="section"><h3>İsim değiştir</h3></div><div class="search"><input id="nicknameInput" maxlength="32" placeholder="Yeni profil adı"><button class="primary" onclick="changeNickname()">300 Lidya</button></div></section>
<section id="notifications" class="view"><div class="toolbar"><button class="close" onclick="showView('profile')">‹</button><div><div class="eyebrow">AYARLAR</div><h2>Bildirimler</h2></div></div><div class="card hero"><div class="eyebrow">UYGULAMA BİLDİRİMLERİ</div><h2 id="notificationTitle">Açık</h2><p>Yeni mesajlar ve uygulama bildirimleri için bildirimleri açıp kapatabilirsin.</p></div><div class="settings" style="margin-top:12px"><button class="setting" onclick="toggleNotifications()"><div class="grow"><b>Bildirimler</b><small id="notificationStateText">Bildirimler açık</small></div><span id="notificationSwitch" class="switch on"></span></button></div></section>
'''
          assert s.count(marker)==1; s=s.replace(marker,views+marker,1)
          marker='<script>\nconst gifts='
          prefix='''<script>\nconst API_BASE=localStorage.getItem('eris_api_base')||''';\nconst state={token:localStorage.getItem('eris_token')||'',user:null,notifications:localStorage.getItem('eris_notifications')!=='off'};\nasync function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(state.token)headers.Authorization=`Bearer ${state.token}`;const r=await fetch(API_BASE+path,{...options,headers});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||'İşlem başarısız');return d}\nasync function loadMe(){if(!state.token)return;try{state.user=await api('/v1/me');renderUser()}catch(e){toast(e.message)}}\nfunction renderUser(){if(!state.user)return;document.querySelectorAll('.name h2').forEach(x=>x.textContent=state.user.nickname);document.querySelectorAll('.stat b').forEach((x,i)=>{if(i===2)x.textContent=Number(state.user.lidya||0).toLocaleString('tr-TR')});const n=document.getElementById('privacyCurrentName');if(n)n.textContent=state.user.nickname;const i=document.getElementById('nicknameInput');if(i)i.value=state.user.nickname;state.notifications=!!state.user.notifications_enabled;renderNotificationState()}\nfunction openPrivacy(){renderUser();showView('privacy')}\nfunction openNotifications(){renderNotificationState();showView('notifications')}\nasync function changeNickname(){const name=document.getElementById('nicknameInput').value.trim();if(!name){toast('İsim boş olamaz');return}if(!state.token){toast('Oturum bulunamadı');return}try{state.user=await api('/v1/me/nickname',{method:'POST',body:JSON.stringify({nickname:name})});renderUser();toast('Profil adı değiştirildi • 300 Lidya düşüldü');showView('profile')}catch(e){toast(e.message)}}\nasync function toggleNotifications(){const next=!state.notifications;if(!state.token){state.notifications=next;localStorage.setItem('eris_notifications',next?'on':'off');renderNotificationState();toast(next?'Bildirimler açıldı':'Bildirimler kapatıldı');return}try{state.user=await api('/v1/me/notifications',{method:'PATCH',body:JSON.stringify({notifications_enabled:next})});state.notifications=!!state.user.notifications_enabled;localStorage.setItem('eris_notifications',state.notifications?'on':'off');renderNotificationState();toast(state.notifications?'Bildirimler açıldı':'Bildirimler kapatıldı')}catch(e){toast(e.message)}}\nfunction renderNotificationState(){const on=!!state.notifications;document.getElementById('notificationSwitch')?.classList.toggle('on',on);const t=document.getElementById('notificationTitle');if(t)t.textContent=on?'Açık':'Kapalı';const x=document.getElementById('notificationStateText');if(x)x.textContent=on?'Bildirimler açık':'Bildirimler kapalı'}\n'''
          assert s.count(marker)==1; s=s.replace(marker,prefix+'const gifts=',1)
          end="document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});"
          assert s.count(end)==1; s=s.replace(end,end+'loadMe();renderNotificationState();',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/erischat-main.html
          git diff --cached --quiet || (git commit -m 'feat: profile privacy and notifications' && git push)
