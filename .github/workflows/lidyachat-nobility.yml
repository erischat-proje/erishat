name: LidyaChat Nobility Security

on:
  workflow_dispatch:
  pull_request:
    branches: [auth-unified-v1]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/lidyachat-nobility.yml'

permissions:
  contents: read

jobs:
  nobility-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: lidyachat_security_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U security_test -d lidyachat_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      DATABASE_URL: "sqlite:///:memory:"
      SECURITY_TEST_DATABASE_URL: "postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidyachat_security_test"
      NOBILITY_TEST_CONFIRM: "YES"
      LIDYACHAT_NOBILITY_PAID_POINTS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt httpx2 pytest

      - name: Nobility backend regression
        run: |
          python -m pytest -x -q --tb=short \
          backend/tests/test_nobility_room_batch_v110.py \
          backend/tests/test_nobility_batch_v110.py \
          backend/tests/test_nobility_knight_expiry_v19.py \
          backend/tests/test_nobility_fan_ranking_v16.py \
          backend/tests/test_nobility_ranking_v16.py \
          backend/tests/test_nobility_follow_api_v15.py \
          backend/tests/test_nobility_online_api_v13.py \
          backend/tests/test_nobility_room_priority_v12.py \
          backend/tests/test_nobility_appearance_v11.py \
          backend/tests/test_nobility_banner_policy_v11.py \
          backend/tests/test_nobility_gift_payout_v11.py \
          backend/tests/test_nobility_count_bonus_v1211.py

      - name: Nobility frontend regression
        run: node --test frontend/tests/nobility-*.test.cjs

      - name: PostgreSQL financial security
        env:
          LIDYACHAT_NOBILITY_ENABLED: "true"
        run: |
          python -m pytest -x -q --tb=short \
          --junitxml=financial-results.xml \
          backend/tests/test_nobility_postgres_v1.py \
          backend/tests/test_nobility_activation_v10.py \
          backend/tests/test_nobility_renewal_v10.py \
          backend/tests/test_nobility_activation_api_v10.py \
          backend/tests/test_nobility_renew_api_v10.py \
          backend/tests/test_nobility_activation_race_v10.py \
          backend/tests/test_nobility_action_race_v10.py \
          backend/tests/test_nobility_refunds_v10.py \
          backend/tests/test_nobility_partial_refunds_v10.py \
          backend/tests/test_nobility_partial_concurrency_v10.py \
          backend/tests/test_nobility_renewal_refunds_v10.py \
          backend/tests/test_nobility_refund_api_race_v10.py

      - name: Reject skipped financial tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("financial-results.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) >= 190
          for case in cases:
              assert case.find("failure") is None
              assert case.find("error") is None
              assert case.find("skipped") is None
          print("FINANCIAL TESTS:", len(cases))
          print("FINANCIAL SECURITY: PASS")
          PY

  king-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install King browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/king-browser" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/king-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: King Final V4.6 browser regression
        run: |
          export NODE_PATH="$RUNNER_TEMP/king-browser/node_modules"
          timeout 180s node tests/king-final-v46.browser.cjs

      - name: Upload King visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidyachat-king-final-v46-evidence
          path: king-final-browser-results/
          if-no-files-found: ignore
