name: fix-room-chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix room realtime chat integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('backend/app/main.py')
          s = main.read_text(encoding='utf-8')
          s = s.replace('RoomSeat, RoomChatMessage, RoomChatMessage', 'RoomSeat, RoomChatMessage', 1)
          s = s.replace('        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS gender VARCHAR(16) NOT NULL DEFAULT \'unspecified\'"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS avatar_asset VARCHAR(255)"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS frame_asset VARCHAR(255)"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS gender VARCHAR(16) NOT NULL DEFAULT \'unspecified\'"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS avatar_asset VARCHAR(255)"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS frame_asset VARCHAR(255)"))', '        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS gender VARCHAR(16) NOT NULL DEFAULT \'unspecified\'"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS avatar_asset VARCHAR(255)"))\n        conn.execute(text("ALTER TABLE users ADD COLUMN IF NOT EXISTS frame_asset VARCHAR(255)"))', 1)
          main.write_text(s, encoding='utf-8')

          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          if 'function connectRoomSocket()' not in s:
              block = '''function connectRoomSocket(){\n  if(!activeRoomId)return;\n  if(roomSocket){try{roomSocket.close()}catch(_){}}\n  const token=localStorage.getItem('erischat.token')||localStorage.getItem('token')||'';\n  if(!token){showToast('Oda sohbeti için oturum gerekli');return;}\n  const base=API||location.origin;\n  const u=new URL(base);\n  u.protocol=u.protocol==='https:'?'wss:':'ws:';\n  u.pathname='/ws/rooms/'+encodeURIComponent(activeRoomId);\n  u.search='?token='+encodeURIComponent(token);\n  roomSocket=new WebSocket(u.toString());\n  roomSocket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='room_history'){const log=document.getElementById('roomChatLog');log.innerHTML='';d.messages.forEach(appendRoomMessage);if(!d.messages.length)log.innerHTML='<div class="roomempty">Henüz mesaj yok.</div>';}else if(d.type==='room_chat'){appendRoomMessage(d);}}catch(_){}};\n  roomSocket.onerror=()=>showToast('Oda sohbet bağlantısı kurulamadı');\n  roomSocket.onclose=()=>{};\n}\nfunction appendRoomMessage(m){const log=document.getElementById('roomChatLog');if(!log)return;if(log.querySelector('.roomempty'))log.innerHTML='';const d=document.createElement('div');d.className='roomchatmsg';d.textContent=(m.nickname||'Kullanıcı')+': '+(m.text||'');log.appendChild(d);log.scrollTop=log.scrollHeight;}\n'''
              marker='async function openRoom('
              if marker not in s:
                  raise SystemExit('openRoom marker bulunamadı')
              s=s.replace(marker,block+marker,1)
          old="function sendRoomMessage(){const input=document.getElementById('roomChatInput');const text=input.value.trim();if(!text)return;const log=document.getElementById('roomChatLog');if(log.querySelector('.roomempty'))log.innerHTML='';const d=document.createElement('div');d.className='roomchatmsg';d.textContent='Sen: '+text;log.appendChild(d);input.value='';log.scrollTop=log.scrollHeight;showToast('Mesaj yerel olarak eklendi; WebSocket oda kanalı sonraki adımda bağlanacak.')}"
          new="function sendRoomMessage(){const input=document.getElementById('roomChatInput');const text=input.value.trim();if(!text)return;if(!roomSocket||roomSocket.readyState!==WebSocket.OPEN){showToast('Oda sohbet bağlantısı hazır değil');return;}roomSocket.send(JSON.stringify({type:'room_chat',text:text}));input.value='';}"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile backend/app/main.py backend/app/room_models.py
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('frontend/index.html','utf8');[...s.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].forEach((m,i)=>new vm.Script(m[1],{filename:'inline-'+i+'.js'}));console.log('inline-js-ok')"

      - name: Commit fixes
        run: |
          git config user.name 'ErisChat Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py frontend/index.html
          git diff --cached --quiet || git commit -m 'fix: complete realtime room chat client integration'
          git push
