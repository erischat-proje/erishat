name: LidyaChat VIP Security

on:
  workflow_dispatch:
  pull_request:
    branches: [auth-unified-v1]

permissions:
  contents: read

jobs:
  vip-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vip_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: lidyachat_vip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vip_test -d lidyachat_vip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "sqlite://"
      PYTHONPATH: backend
      VIP_PG_ISOLATED_CONFIRM: "YES"
      VIP_PG_TEST_DATABASE_URL: postgresql+psycopg://vip_test:isolated_test_only@127.0.0.1:5432/lidyachat_vip_test

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/
            /tests/test_vip_privileges.py
            /tests/test_vip_membership.py
            /tests/test_vip_postgres_v19.py
            /frontend/vip-privileges.js
            /frontend/shop-expansion-live.js
            /frontend/room-gift-ui-live.js
            /frontend/gift-live.js
            /frontend/vip-privileges.css
            /frontend/assets/vip-level-rewards-v2/
            /frontend/vip-designs/lydia/
            /tests/vip-privileges.browser.cjs
            /tests/vip_privileges_ui_server.py
            /tests/test_vip_gift_integration_v116.cjs
            /frontend/room-emojis.js
            /frontend/vip-rewards-live.js
            /frontend/assets/room-emojis-lidya-v1/
            /frontend/assets/vip-privileges-v1/
            /tests/room-emojis-vip.test.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx httpx2

      - name: Validate frontend
        run: |
          node --check frontend/vip-privileges.js
          node --check frontend/shop-expansion-live.js
          node --check frontend/room-gift-ui-live.js
          node --check frontend/gift-live.js
          node --check frontend/room-emojis.js
          node --check frontend/vip-rewards-live.js

      - name: VIP WebSocket emoji security
        run: python tests/room-emojis-vip.test.py -v

      - name: VIP and Nobility gift integration
        run: node --test tests/test_vip_gift_integration_v116.cjs

      - name: VIP SQLite functional regression
        run: python -m pytest -v tests/test_vip_privileges.py

      - name: VIP PostgreSQL concurrency and financial audit
        run: python -m pytest -v tests/test_vip_postgres_v19.py

      - name: VIP membership lifecycle
        run: python -m pytest -v tests/test_vip_membership.py


      - name: Install Chromium browser tests
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: VIP real browser and theme verification
        run: |
          set -euo pipefail

          python -m uvicorn vip_privileges_ui_server:app --app-dir tests --host 127.0.0.1 --port 8767 > vip-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8767/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8767/ >/dev/null
          timeout 180s node tests/vip-privileges.browser.cjs

      - name: Upload VIP browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidyachat-vip-browser-evidence
          path: |
            vip-browser-results/
            vip-browser-server.log
