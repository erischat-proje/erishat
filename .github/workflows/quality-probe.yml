name: ErisChat quality workflow probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify quality workflow registration
        run: |
          test -s .github/workflows/quality.yml
          grep -F 'live-e2e:' .github/workflows/quality.yml
          python scripts/check_backend_quality.py
