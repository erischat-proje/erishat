name: Build ErisChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-wrapper-20261006

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore ErisChat signing keystore
        working-directory: android
        env:
          ERISCHAT_KEYSTORE_BASE64: ${{ secrets.ERISCHAT_KEYSTORE_BASE64 }}
        run: |
          echo "$ERISCHAT_KEYSTORE_BASE64" | base64 --decode > erischat-release.jks

      - name: Build signed debug APK
        working-directory: android
        env:
          ERISCHAT_KEYSTORE_PASSWORD: ${{ secrets.ERISCHAT_KEYSTORE_PASSWORD }}
          ERISCHAT_KEY_PASSWORD: ${{ secrets.ERISCHAT_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErisChat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
