name: ErisChat Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - google-native-android
      - auth-unified-v1
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Gradle permission
        run: chmod +x android-native/gradlew

      - name: Build APK
        working-directory: android-native
        run: ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ErisChat-Accounts-Microphone-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
