name: LidyaChat Security Checks
on:
  workflow_dispatch:
  pull_request:
    branches: [auth-unified-v1]
    paths:
      - 'backend/**'
      - 'frontend/social-feed-live.js'
      - 'frontend/stories-live.js'
      - 'tests/explore-premium.browser.cjs'
      - 'frontend/user-profile-navigation.js'
      - 'frontend/device-layout.js'
      - 'frontend/erischat-main.html'
      - 'frontend/**/*.css'
      - 'tests/profile-age.dom.cjs'
      - 'tests/public-profile-premium.dom.cjs'
      - 'tests/public-profile-premium.browser.cjs'
      - 'frontend/room-fan-ranking.js'
      - 'tests/fan-window-layer.dom.cjs'
      - 'tests/fan-center.dom.cjs'
      - 'frontend/explore-comments.js'
      - 'tests/explore-workspace.dom.cjs'
      - 'frontend/screen-awake.js'
      - 'frontend/settings-live.js'
      - 'frontend/lidya-android-back-v1.js'
      - 'frontend/tests/test_android_back_v1.cjs'
      - 'android-native/**'
      - 'Caddyfile'
      - 'tests/security_guard/**'
      - 'tests/test_message_*.py'
      - 'tests/test_security_center_dm_id.py'
      - 'tests/test_play_billing_v3.py'
      - 'tests/test_play_fulfillment_v4.py'
      - 'tests/test_play_refund_audit.py'
      - 'tests/test_play_refund_review_v2.py'
      - 'tests/test_play_release_candidate.py'
      - 'tests/test_google_play_license_test.py'
      - '.github/workflows/lidyachat-security.yml'
permissions:
  contents: read
jobs:
  api-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: lidyachat_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_test -d lidyachat_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECURITY_APP_ROOT: '.'
      SECURITY_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidyachat_security_test
      WAKE_SCRIPT: frontend/screen-awake.js
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/
            /tests/security_guard/

            /tests/explore-workspace.dom.cjs
            /tests/welcome-packages.dom.cjs
            /tests/welcome-checkout.dom.cjs
            /tests/welcome-payment.dom.cjs
            /frontend/welcome-payment-live.js
            /frontend/admin-workspace.js
            /tests/welcome-admin.dom.cjs
            /frontend/welcome-packages-live.js
            /frontend/welcome-packages.css
            /frontend/welcome-premium-v3/
            /frontend/social-feed-live.js
            /frontend/stories-live.js
            /tests/explore-premium.browser.cjs
            /frontend/user-profile-navigation.js
            /frontend/device-layout.js
            /frontend/erischat-main.html
            /frontend/*.css
            /frontend/**/*.css
            /tests/profile-age.dom.cjs
            /tests/public-profile-premium.dom.cjs
            /tests/public-profile-premium.browser.cjs
            /frontend/room-fan-ranking.js
            /tests/fan-window-layer.dom.cjs
            /tests/fan-center.dom.cjs
            /frontend/explore-comments.js
            /tests/test_security_center.py
            /tests/test_security_center_dm_id.py
            /tests/test_play_billing_v3.py
            /tests/test_play_fulfillment_v4.py
            /tests/test_play_refund_audit.py
            /tests/test_play_refund_review_v2.py
            /tests/test_play_release_candidate.py
            /tests/test_google_play_license_test.py
            /frontend/auth-live.js
            /frontend/screen-awake.js
            /frontend/settings-live.js
            /frontend/lidya-android-back-v1.js
            /frontend/tests/test_android_back_v1.cjs
            /Caddyfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt httpx2 pip-audit pytest

      - name: DA Explore SQLite authorization
        env:
          DATABASE_URL: "sqlite://"
        run: |
          PYTHONPATH=. python -m pytest -v backend/tests/test_da_explore_moderation_v1.py

      - name: DA Explore PostgreSQL concurrency and audit
        env:
          DATABASE_URL: "sqlite://"
          DA_PG_ISOLATED_CONFIRM: "YES"
          DA_PG_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidyachat_security_test
        run: |
          PYTHONPATH=. python -m pytest -v backend/tests/test_da_explore_postgres_v1.py

      - name: DA Explore frontend regression
        run: |
          npm install --prefix "$RUNNER_TEMP/lidya-da-tests" --no-save --package-lock=false jsdom@26.1.0
          ERIS_JSDOM_MODULE="$RUNNER_TEMP/lidya-da-tests/node_modules/jsdom" node --test tests/explore-workspace.dom.cjs

      - name: Fan Window Layer regression
        run: |
          export NODE_PATH="$RUNNER_TEMP/lidya-da-tests/node_modules"
          node --test tests/fan-window-layer.dom.cjs
          node tests/fan-center.dom.cjs
          node frontend/tests/test_android_back_v1.cjs

      - name: Public Profile Premium functional regression
        run: |
          export NODE_PATH="$RUNNER_TEMP/lidya-da-tests/node_modules"
          node --test tests/public-profile-premium.dom.cjs
          node tests/profile-age.dom.cjs

      - name: Install Public Profile Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/lidya-profile-browser" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/lidya-profile-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Public Profile Premium browser verification
        run: |
          export NODE_PATH="$RUNNER_TEMP/lidya-profile-browser/node_modules"
          timeout 180s node tests/public-profile-premium.browser.cjs

      - name: Explore Premium browser verification
        run: |
          export NODE_PATH="$RUNNER_TEMP/lidya-profile-browser/node_modules"
          timeout 180s node tests/explore-premium.browser.cjs

      - name: Upload Explore Premium browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidyachat-explore-premium-browser-evidence
          path: explore-premium-browser-results/
          if-no-files-found: ignore

      - name: Upload Public Profile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidyachat-public-profile-browser-evidence
          path: public-profile-browser-results/
          if-no-files-found: ignore

      - name: Run Family V4 privacy and API tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: >-
          PYTHONPATH=. python -m pytest -q
          backend/tests/test_family_privacy_v4.py
          backend/tests/test_family_api_privacy_v4.py

      - name: Run Family V4 PostgreSQL privacy tests
        env:
          FAMILY_V4_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidyachat_security_test
          FAMILY_V4_ISOLATED_CONFIRM: "YES"
        run: >-
          PYTHONPATH=. python -m pytest -q
          backend/tests/test_family_postgres_v4.py


      - name: WooCommerce V6 isolated SQLite security tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: >-
          PYTHONPATH=. python -m unittest discover
          -s backend/tests
          -p 'test_woocommerce_order_v6*.py' -v

      - name: WooCommerce V6 isolated PostgreSQL security tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          LIDYA_WC_LOCK_POSTGRES: "1"
          PGPASSWORD: isolated_test_only
        run: |
          psql -h 127.0.0.1 -U security_test -d lidyachat_security_test -c 'CREATE DATABASE lidya_wc_lock_test'
          PYTHONPATH=. python -m unittest discover -s backend/tests -p 'test_woocommerce_order_v6_lock.py' -v

      - run: python tests/security_guard/test_integration.py
      - run: python tests/security_guard/test_pg_wallet.py
      - name: VIP Play Purchase Audit V1.2.2
        env:
          VIP_PLAY_AUDIT_CONFIRM: 'YES'
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: PYTHONPATH=backend python -m pytest -v backend/tests/test_vip_play_audit_v122.py
      - name: Device Registration Audit V1.1
        env:
          DEVICE_AUDIT_CONFIRM: 'YES'
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: PYTHONPATH=. python -m pytest -v backend/tests/test_device_registration_audit_v11.py
      - name: Welcome Packages full regression
        env:
          DATABASE_URL: "sqlite://"
        run: |
          PYTHONPATH=. python -m pytest -v backend/tests/test_welcome_packages_v1.py backend/tests/test_welcome_cosmetics_v2.py backend/tests/test_welcome_artwork_v3.py backend/tests/test_welcome_purchase_v5.py
          NODE_PATH="$RUNNER_TEMP/lidya-da-tests/node_modules" node tests/welcome-packages.dom.cjs
          NODE_PATH="$RUNNER_TEMP/lidya-da-tests/node_modules" node tests/welcome-checkout.dom.cjs
          NODE_PATH="$RUNNER_TEMP/lidya-da-tests/node_modules" node tests/welcome-payment.dom.cjs

      - name: Welcome Packages V5 PostgreSQL concurrency
        env:
          DATABASE_URL: "sqlite://"
          WELCOME_PG_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -v backend/tests/test_welcome_purchase_postgres_v5.py

      - name: Welcome Premium V6 receipt regression
        env:
          DATABASE_URL: "sqlite://"
        run: PYTHONPATH=. python -m pytest -v backend/tests/test_welcome_play_v6.py

      - name: Welcome Premium V9 DA browser security
        run: NODE_PATH="$RUNNER_TEMP/lidya-da-tests/node_modules" node tests/welcome-admin.dom.cjs

      - name: Welcome Premium V7 delivery regression
        env:
          DATABASE_URL: "sqlite://"
        run: PYTHONPATH=. python -m pytest -v backend/tests/test_welcome_fulfillment_v7.py

      - name: Welcome Premium V7 PostgreSQL delivery concurrency
        env:
          DATABASE_URL: "sqlite://"
          WELCOME_PG_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -v backend/tests/test_welcome_delivery_postgres_v7.py

      - name: Custom Referral V1 PostgreSQL concurrency
        env:
          CUSTOM_REFERRAL_PG_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -v backend/tests/test_custom_referral_v1.py backend/tests/test_custom_referral_postgres_v1.py
      - name: Run LB V2 referral concurrency test
        env:
          LB_V2_TEST_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -q backend/tests/test_lb_referral_postgres_v2.py
      - name: Run BT referral PostgreSQL concurrency test
        env:
          V7_TEST_DATABASE_URL: ${{ env.SECURITY_TEST_DATABASE_URL }}
          V7_ISOLATED_CONFIRM: 'YES'
        run: PYTHONPATH=backend python -m pytest -q backend/tests/test_bt_reference_postgres_v1.py
      - name: Prepare isolated V7 PostgreSQL database
        env:
          PGPASSWORD: isolated_test_only
        run: >-
          psql -h 127.0.0.1 -U security_test
          -d lidyachat_security_test
          -c 'CREATE DATABASE lidya_v7_test'

      - name: Test AdMob V2 PostgreSQL concurrent rewards
        env:
          V7_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidya_v7_test
          V7_ISOLATED_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -q backend/tests/test_admob_v2_postgres.py

      - name: Test AdMob V4 preview PostgreSQL concurrency
        env:
          V7_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidya_v7_test
          V7_ISOLATED_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -q backend/tests/test_admob_v4_postgres.py

      - name: Test Firebase PostgreSQL concurrent registrations
        env:
          V7_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidya_v7_test
          V7_ISOLATED_CONFIRM: 'YES'
        run: >-
          PYTHONPATH=backend python -m pytest -q
          backend/tests/test_push_postgres_v43.py

      - name: Run dealer V7 PostgreSQL concurrency and receipt tests
        env:
          V7_TEST_DATABASE_URL: postgresql+psycopg://security_test:isolated_test_only@127.0.0.1:5432/lidya_v7_test
          V7_ISOLATED_CONFIRM: 'YES'
        run: PYTHONPATH=. python -m pytest -q backend/tests/test_dealer_postgres_v7.py

      - name: Run LidyaChat V4 dealer and receipt security tests
        run: >-
          PYTHONPATH=. python -m pytest -q
          backend/tests/test_dealer_security_v6.py
          backend/tests/test_dealer_representatives_roster_v1.py
          backend/tests/test_dealer_representatives_v2.py
          backend/tests/test_admin_registered_bt_v1.py
          backend/tests/test_admin_lookup_revoke_v1.py
          backend/tests/test_dealer_evidence_v3.py
          backend/tests/test_dealer_evidence_transfer_v4.py
          backend/tests/test_bt_referrals_v1.py
          backend/tests/test_representatives_v1.py
      - run: python tests/security_guard/test_transport.py
      - run: python tests/security_guard/test_counters.py
      - run: python tests/security_guard/test_email_policy.py
      - run: PYTHONPATH=backend python -m pytest -q tests/test_security_center.py tests/test_security_center_dm_id.py
      - name: Test Firebase push device and session security
        run: >-
          PYTHONPATH=backend python -m pytest -q
          backend/tests/test_push_device_v2.py
          backend/tests/test_push_sender_v3.py
          backend/tests/test_push_delivery_v35.py
          backend/tests/test_push_session_v36.py
      - name: Test Firebase account switch race protection
        run: node --test tests/security_guard/test_push_lifecycle_v42.cjs
      - name: Run Google Play Billing V3 validation tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_play_billing_v3.py
      - name: Run Google Play V4 fulfillment unit tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_play_fulfillment_v4.py
      - name: Run Google Play license test mode guard tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_google_play_license_test.py
      - name: Run Google Play refund audit tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_play_refund_audit.py
      - name: Run Google Play refund V2 review tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_play_refund_review_v2.py
      - name: Run Google Play final release candidate tests
        run: PYTHONPATH=backend python -m pytest -q tests/test_play_release_candidate.py
      - name: Test Android back navigation
        run: node frontend/tests/test_android_back_v1.cjs
      - run: node tests/security_guard/test_wake.cjs
      - run: python -m pip_audit -r backend/requirements.txt --progress-spinner off
      - name: Validate Caddy configuration
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
  android-java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: android-native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase Android config
        env:
          FIREBASE_CONFIG: ${{ secrets.LIDYACHAT_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CONFIG" || {
            echo "Firebase config secret is missing"
            exit 1
          }
          python3 - <<'PYCODE'
          import os, json
          from pathlib import Path

          config = json.loads(os.environ["FIREBASE_CONFIG"])
          packages = [
              client.get("client_info", {})
                    .get("android_client_info", {})
                    .get("package_name")
              for client in config.get("client", [])
          ]

          assert "com.erischat.app" in packages, "Wrong Firebase package"

          target = Path("android-native/app/google-services.json")
          target.write_text(
              json.dumps(config),
              encoding="utf-8"
          )
          target.chmod(0o600)
          print("OK: Firebase config restored")
          PYCODE

      - name: Welcome Android product policy
        run: |
          mkdir -p "$RUNNER_TEMP/welcome-java-tests"
          javac -d "$RUNNER_TEMP/welcome-java-tests" android-native/app/src/main/java/com/erischat/app/PlayProductPolicy.java android-native/security-tests/PlayProductPolicyTest.java
          java -cp "$RUNNER_TEMP/welcome-java-tests" PlayProductPolicyTest


      - name: Welcome Android checkout preflight policy
        run: |
          mkdir -p "$RUNNER_TEMP/welcome-checkout-tests"
          javac -d "$RUNNER_TEMP/welcome-checkout-tests" android-native/app/src/main/java/com/erischat/app/PlayProductPolicy.java android-native/security-tests/WelcomeCheckoutPolicyTest.java
          java -cp "$RUNNER_TEMP/welcome-checkout-tests" WelcomeCheckoutPolicyTest

      - name: Compile debug Java without signing credentials
        run: |
          chmod +x android-native/gradlew
          android-native/gradlew -p android-native :app:compileDebugJavaWithJavac --no-daemon

  messaging-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version

      - name: Install production Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx2

      - name: Verify real media libraries
        run: |
          python -c "import av; print('PyAV:', av.__version__)"
          python -c "from PIL import Image; print('Pillow:', Image.__version__)"

      - name: Run all messaging security regression tests
        shell: bash
        run: |
          set -euo pipefail

          PASS=0
          FAIL=0

          for FILE in tests/test_message_*.py tests/test_security_center_dm_id.py
          do
            echo "=== $FILE ==="

            if python -m pytest -q "$FILE" --tb=short; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
            fi
          done

          echo "=== MESSAGING SECURITY REPORT ==="
          echo "PASSED PACKAGES: $PASS"
          echo "FAILED PACKAGES: $FAIL"
          echo "TOTAL PACKAGES: $((PASS+FAIL))"

          test "$FAIL" -eq 0
