name: ErisChat quality checks v4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://erischat:erischat@127.0.0.1:5432/erischat
  ERISCHAT_SMOKE_BASE_URL: http://127.0.0.1:8000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erischat
          POSTGRES_USER: erischat
          POSTGRES_PASSWORD: erischat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erischat -d erischat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend and smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install websocket-client
      - name: Static syntax and required-file checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app scripts
          test -s frontend/erischat-main.html
          for script in \
            platform.js demo-cleanup.js room-live.js gift-live.js room-actions.js \
            room-ban-live.js room-gift-ui-live.js dm-live.js auth-live.js profile-live.js \
            cosmetics.js profile-ui-live.js session-ui-live.js dm-create-live.js \
            feature-hub-live.js shop-live.js full-demo-live.js demo-controls-live.js \
            demo-complete-live.js demo-extras-live.js; do
            test -s "frontend/$script"
            node --check "frontend/$script"
          done
          echo 'Python/JavaScript syntax and frontend source checks OK'
      - name: Customer demo surface integrity
        run: python scripts/demo_surface_integrity.py
      - name: Family route integrity
        run: python scripts/family_routes_integrity.py
      - name: Cosmetics asset integrity
        run: python scripts/cosmetics_asset_integrity.py
      - name: Cosmetics asset URL smoke
        run: node scripts/cosmetics_asset_url_smoke.mjs
      - name: Start local API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../erischat-api.log 2>&1 &
      - name: Wait for API
        run: |
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:8000/ready"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("API ready")
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open("erischat-api.log", encoding="utf-8", errors="replace").read())
          raise SystemExit("API did not become ready")
      - name: Anonymous session smoke
        run: python scripts/anonymous_session_live_smoke.py
      - name: Live room smoke
        run: python scripts/room_live_smoke.py
      - name: Live ban smoke
        run: python scripts/room_ban_live_smoke.py
      - name: Live DM smoke
        run: python scripts/dm_live_smoke.py
      - name: Live cosmetic smoke
        run: python scripts/cosmetic_live_smoke.py
      - name: API log on failure
        if: failure()
        run: cat erischat-api.log

# Cosmetic URL encoding regression coverage added after the repository asset audit.
