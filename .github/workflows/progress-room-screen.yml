name: update-room-progress
on:
  push:
    paths:
      - 'progress-room-screen.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update progress files
        run: |
          python - <<'PY'
          from pathlib import Path
          done = Path('yapılanlar.txt')
          todo = Path('yapılacaklar.txt')
          marker = '13. 2026-09-17 — GERÇEK ODA EKRANI'
          if marker not in done.read_text(encoding='utf-8'):
              with done.open('a', encoding='utf-8') as f:
                  f.write('\n\n' + marker + '\n')
                  f.write('- [x] GitHub Actions `build-real-room-screen` workflow başarıyla tamamlandı.\n')
                  f.write('- [x] `frontend/index.html` içine gerçek oda ekranı modalı eklendi; oda adı, seviye, kişi sayısı, harcama, mikrofon koltukları ve sohbet alanı mevcut.\n')
                  f.write('- [x] Gerçek oda detayını `GET /v1/rooms/{room_id}` ile yükleme bağlantısı eklendi.\n')
                  f.write('- [x] Koltuğa geçme/kalkma akışı gerçek oda seat API endpointlerine bağlandı.\n')
                  f.write('- [x] Önceki JavaScript sözdizimi hatası düzeltildi ve Actions Node syntax kontrolü başarıyla geçti.\n')
                  f.write('- [ ] Oda içi sohbet henüz WebSocket kanalına bağlı değil; şu an yerel UI gösterimi.\n')
                  f.write('- [ ] Hediye butonu henüz gerçek hediye API menüsüne bağlı değil.\n')
          s = todo.read_text(encoding='utf-8')
          s = s.replace('- [ ] Gerçek oda oluşturma ve oda giriş ekranını frontend\'e bağla.', '- [x] Gerçek oda giriş ekranı frontend\'e bağlandı; oda modalı ve koltuk API akışı eklendi.\n- [ ] Gerçek oda oluşturma UI akışını tamamla.')
          marker2='- [ ] Oda içi gerçek zamanlı event kanalı oluştur.'
          if marker2 in s and '- [ ] Oda ekranındaki sohbeti gerçek WebSocket oda kanalına bağla.' not in s:
              s=s.replace(marker2, marker2+'\n- [ ] Oda ekranındaki sohbeti gerçek WebSocket oda kanalına bağla.')
          todo.write_text(s, encoding='utf-8')
          PY
      - name: Commit progress
        run: |
          git config user.name 'ErisChat Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yapılanlar.txt yapılacaklar.txt
          git diff --cached --quiet || git commit -m 'docs: update room screen progress'
          git push
