<!doctype html><html lang="tr" data-eris-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wheel test fixture</title><link rel="stylesheet" href="../frontend/wheel-live.css"><style>body{margin:0;font:14px system-ui;background:#ece0c6;--ui-panel:#fbf4e3;--ui-raised:#f0e2c6;--ui-ink:#47321b;--ui-muted:#826a43;--ui-line:#ccb58a}#profile{padding:10px}.eris-wheel-wrap{aspect-ratio:1!important}button{font:inherit}</style><body><button id="open" onclick="LidyaWheelLive.open()">Çarkı aç</button><section id="profile"></section><script>
const keys=['rose','heart','star','diamond','crown','fire','gem','jackpot'],multipliers=Object.fromEntries(keys.map((k,i)=>[k,[5,5,5,5,15,25,45,60][i]]));window.calls=[];window.networkFail=false;window.failAfterDebit=false;window.resultPhase=false;window.disablePoll=false;window.refreshCount=0;window.testReceipt=new Map();window.balance=500000;window.mine={};
const scores=Array.from({length:55},(_,i)=>({rank:i+1,user_id:'user'+i,nickname:i===0?'Kaan · Altın Şampiyon':i===1?'Uzun Kullanıcı Adı Örnek Test':'Oyuncu '+(i+1),winnings:80913100-i*532110,avatar:'🦁',avatar_asset:'../frontend/assets/lidya-games-png/light/coin.png',frame_asset:'../frontend/assets/lidya-games-png/light/crown.png'}));
window.ErisPlatform={getMe:async()=>({id:'viewer'}),api:async(path,options)=>{calls.push({path,body:options?.body});if(path.includes('/leaderboard')){const period=new URL('http://test'+path).searchParams.get('period');await new Promise(r=>setTimeout(r,period==='day'?80:10));return {items:scores,my_winnings:period==='day'?888:12345};}if(path.endsWith('/records'))return {today_winnings:500,items:[]};if(path.endsWith('/bet')){const b=JSON.parse(options.body);if(networkFail)throw new Error('Bağlantı kesildi');if(!testReceipt.has(b.request_id)){testReceipt.set(b.request_id,b);balance-=b.amount;mine[b.choice]=(mine[b.choice]||0)+b.amount;}if(failAfterDebit){failAfterDebit=false;throw new Error('Cevap kayboldu');}return {ok:true,...b,balance};}if(path.endsWith('/live')){refreshCount++;return {my_id:'viewer',round_id:'round-1',version:4,status:resultPhase?'finished':'open',result:resultPhase?'star':null,betting_open:!resultPhase,remaining_seconds:37,symbols:keys,stakes:[10,100,1000,10000,100000],multipliers,balance,my_bets:mine,my_total_bet:Object.values(mine).reduce((a,b)=>a+b,0),my_payout:resultPhase?(mine.star||0)*5:0,history:keys.map(k=>({result:k})),misses:Object.fromEntries(keys.map(k=>[k,3]))};}return {};}};
window.ErisChatCosmetics={assetUrl:x=>x};window.openUserProfile=id=>{window.profileOpened=id};
</script><script src="../frontend/lidya-game-art.js"></script><script src="../frontend/games/wheel.js"></script><script src="../frontend/wheel-audio.js"></script><script src="../frontend/game-ranking.js"></script><script src="../frontend/wheel-live.js"></script><script src="../frontend/profile-hub.js"></script><script src="../frontend/profile-png-premium.js"></script></body></html>
