<!doctype html><html data-eris-theme="light"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../frontend/lidya-ui.css"><link rel="stylesheet" href="../frontend/theme-palette.css"><link rel="stylesheet" href="../frontend/lidya-interface-complete.css"><link rel="stylesheet" href="../frontend/wheel-live.css"><link rel="stylesheet" href="../frontend/crash-final.css"><link rel="stylesheet" href="../frontend/slot-final.css"><body><button id="open" onclick="LidyaSlotLive.open()">Slot</button><script>
window.calls=[];window.balance=5000000;window.remaining=0;window.locked=100;window.failAfterDebit=false;window.receipts=new Map();
window.ErisPlatform={api:async(p,o)=>{calls.push({path:p,body:o?.body});if(p.includes('/leaderboard'))return {items:Array.from({length:55},(_,i)=>({rank:i+1,user_id:'u'+i,nickname:'Oyuncu '+i,winnings:500000-i,avatar:'A'})),my_winnings:500};if(p.endsWith('/live'))return {my_id:'viewer',balance,remaining,locked_stake:remaining?locked:null,stakes:[10,100,1000,10000,100000],bonus_spins:10,bonus_price_multiplier:10,history:[]};if(p.endsWith('/spin')||p.endsWith('/bonus')){const b=JSON.parse(o.body),operation=p.endsWith('/bonus')?'bonus':'spin';if(!receipts.has(b.request_id)){const cost=operation==='bonus'?b.amount*10:remaining?0:b.amount;balance-=cost;if(operation==='bonus'){remaining=10;locked=b.amount;}else{if(remaining)remaining--;balance+=b.amount*5;}receipts.set(b.request_id,{operation,cost,payout:operation==='spin'?b.amount*5:0,data:{reels:['cherry','cherry','cherry']},stake:b.amount,remaining,locked_stake:remaining?locked:null,balance});}if(failAfterDebit){failAfterDebit=false;throw Error('Yanıt kayboldu');}return {...receipts.get(b.request_id),balance};}return {};}};window.ErisChatCosmetics={assetUrl:x=>x};
</script><script src="../frontend/lidya-game-art.js"></script><script src="../frontend/wheel-audio.js"></script><script src="../frontend/game-ranking.js"></script><script src="../frontend/slot-final.js"></script></body></html>
