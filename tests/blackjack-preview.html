<!doctype html><html data-eris-theme="light"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../frontend/lidya-ui.css"><link rel="stylesheet" href="../frontend/theme-palette.css"><link rel="stylesheet" href="../frontend/wheel-live.css"><link rel="stylesheet" href="../frontend/crash-final.css"><link rel="stylesheet" href="../frontend/lidya-all-games.css"><link rel="stylesheet" href="../frontend/games-lidya.css"><link rel="stylesheet" href="../frontend/lidya-interface-complete.css"><link rel="stylesheet" href="../frontend/lidya-audit-fixes.css"><link rel="stylesheet" href="../frontend/games-png-premium.css"><link rel="stylesheet" href="../frontend/blackjack-final.css"><body><button id="open" onclick="ErisChatGames.open('main',null,'blackjack')">Blackjack</button><script>
window.calls=[];window.balance=500000;window.activeHand=null;window.actionCount=0;
const state=(done=false)=>({phase:done?'finished':'player',result:done?'win':'pending',hands:[{cards:['10H','9S'],total:19}],dealer_hand:done?['10C','7D']:['10C'],dealer_total:done?17:null});
window.ErisPlatform={api:async(p,o)=>{calls.push({path:p,body:o?.body});if(p==='/me')return {lidya:balance};if(p.includes('/leaderboard'))return {items:Array.from({length:55},(_,i)=>({rank:i+1,user_id:'u'+i,nickname:'Oyuncu '+i,winnings:100000-i,avatar:'A'})),my_winnings:100};if(p.endsWith('/history'))return {rounds:[],results:[],total:0};if(p.endsWith('/active'))return activeHand?{active:true,round_id:'bj-1',state:state(),available_actions:['hit','stand']}:{active:false};if(p.endsWith('/play')){const b=JSON.parse(o.body);balance-=b.stake;activeHand=b.stake;return {result:'pending',stake:b.stake,balance,data:{round_id:'bj-1',state:state()}};}if(p.endsWith('/action')){actionCount++;const stake=activeHand;balance+=stake*2;activeHand=null;return {round_id:'bj-1',status:'finished',result:'win',state:state(true),payout:stake*2,balance,available_actions:[]};}return {};}};
window.ErisChatCosmetics={assetUrl:x=>x};
</script><script src="../frontend/lidya-game-art.js"></script><script src="../frontend/games/blackjack.js"></script><script src="../frontend/game-ranking.js"></script><script src="../frontend/games-live.js"></script></body></html>
