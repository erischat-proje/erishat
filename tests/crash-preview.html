<!doctype html><html lang="tr" data-eris-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crash test fixture</title><link rel="stylesheet" href="../frontend/lidya-ui.css"><link rel="stylesheet" href="../frontend/theme-palette.css"><link rel="stylesheet" href="../frontend/wheel-live.css"><link rel="stylesheet" href="../frontend/crash-final.css"><body><button id="open" onclick="LidyaCrashLive.open()">Crash aç</button><script>
window.calls=[];window.crashPhase='open';window.balance=500000;window.bets=[];window.failAfterDebit=false;window.receipts=new Map();window.cashCalls=0;
window.ErisPlatform={api:async(path,o)=>{calls.push({path,body:o?.body});if(path.includes('/leaderboard')){const game=path.includes('/crash/')?'crash':'wheel';return {my_winnings:500,items:Array.from({length:50},(_,i)=>({rank:i+1,user_id:'u'+i,nickname:game+' oyuncu '+i,winnings:100000-i*100,avatar:'🦁'}))};}if(path.endsWith('/cashout-all')){cashCalls++;let payout=0;for(const b of bets)if(!b.cashed_out){b.payout=b.amount*2;b.cashed_out=true;payout+=b.payout;}balance+=payout;return {round_id:'r1',payout,multiplier:2,balance};}if(path.endsWith('/bet')){const b=JSON.parse(o.body);if(!receipts.has(b.request_id)){receipts.set(b.request_id,b);balance-=b.amount;bets.push({id:bets.length+1,amount:b.amount,payout:0,cashed_out:false});}if(failAfterDebit){failAfterDebit=false;throw new Error('Cevap kayboldu');}return {...b,bet_id:bets.find(x=>x.amount===b.amount)?.id,balance};}if(path.endsWith('/live'))return {my_id:'viewer',round_id:'r1',status:crashPhase,betting_open:crashPhase==='open',betting_remaining:7,multiplier:crashPhase==='open'?1:crashPhase==='running'?2:2.5,balance,my_total_bet:bets.reduce((s,b)=>s+b.amount,0),my_bets:bets,recent_rounds:[{multiplier:1.25},{multiplier:2.55},{multiplier:10.33}],crash_stats:{sample_size:100,above_2x:52,above_5x:18,average:4.5,highest:53.8}};return {};}};
</script><script src="../frontend/lidya-game-art.js"></script><script src="../frontend/games/crash.js"></script><script src="../frontend/wheel-audio.js"></script><script src="../frontend/game-ranking.js"></script><script src="../frontend/crash-final.js"></script></body></html>
