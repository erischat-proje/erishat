<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ErisChat — Müşteri Demo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05030a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;flex-direction:column}.bar{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0b0811;border-bottom:1px solid #ffffff15;z-index:5}
.brand{font-weight:950;margin-right:auto}.brand b{color:#ff4da8}.tag{font-size:8px;color:#aaa0b1}
button{border:1px solid #ffffff15;background:#ffffff0b;color:#fff;border-radius:10px;padding:8px 10px;font-size:9px;font-weight:800;cursor:pointer}
.primary{border:0;background:linear-gradient(135deg,#754cff,#ff4fa3)}.frame{flex:1;position:relative}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07050c}
@media(max-width:700px){.tag{display:none}.bar{overflow:auto}.bar button{white-space:nowrap}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Eris<b>Chat</b> <span class="tag">MÜŞTERİ DEMO</span></div>
  <button class="primary" onclick="callDemo('vip')">✨ VIP 1–12</button>
  <button onclick="callDemo('games')">🎮 Oyunlar</button>
  <button onclick="callDemo('check')">☑ Kontrol</button>
  <button onclick="openIndex()">↗ Ana uygulama</button>
</header>
<div class="frame"><iframe id="app" src="./index.html?customer_=1" title="ErisChat müşteri "></iframe></div>
<script>
const app=()=>document.getElementById('app').contentWindow;
function callDemo(type){
  const d=app();
  if(type==='games'&&d.ErisChatGames?.open)return d.ErisChatGames.open('main',null);
  const id={vip:'erisDemoCompleteVip',check:'erisDemoCompleteCheck'}[type];
  const el=id?d.document.getElementById(id):null;
  if(el)el.click(); else setTimeout(()=>callDemo(type),300);
}
function openIndex(){window.open('./index.html','_blank','noopener')}
</script>
</body>
</html>
