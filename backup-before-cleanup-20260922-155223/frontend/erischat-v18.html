<!doctype html>

<title>ErisChat — v1.8 Gift FX Tiered</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#010105;overflow:hidden}.frame{position:relative;width:100%;height:100%;border:0;display:block}.fx{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,#fff9 0,#ff4da833 18%,transparent 58%);opacity:0}.flash.go{animation:flash .5s ease-out}.flash.big{animation:flashBig .9s ease-out}.flash.legendary{animation:flashLegendary 1.1s ease-out}.flash.ultra{animation:flashUltra 1.3s ease-out}.flash.mythic{animation:flashMythic 1.6s ease-out}.gift-stage{position:absolute;left:50%;top:43%;width:min(340px,84vw);height:290px;transform:translate(-50%,-50%);display:grid;place-items:center}.gift-icon{position:absolute;line-height:1;opacity:0;transform:translateY(80px) scale(.15) rotate(-18deg);filter:drop-shadow(0 0 12px #ff4da8) drop-shadow(0 0 34px #985cff)}.gift-icon.small{font-size:72px}.gift-icon.premium{font-size:88px}.gift-icon.big{font-size:112px;filter:drop-shadow(0 0 18px #ff4da8) drop-shadow(0 0 45px #985cff)}.gift-icon.legendary{font-size:132px;filter:drop-shadow(0 0 22px #ff4da8) drop-shadow(0 0 58px #985cff)}.gift-icon.ultra{font-size:154px;filter:drop-shadow(0 0 28px #ff4da8) drop-shadow(0 0 70px #985cff)}.gift-icon.mythic{font-size:180px;filter:drop-shadow(0 0 35px #fff) drop-shadow(0 0 80px #ff4da8) drop-shadow(0 0 110px #985cff)}.gift-icon.small.go{animation:giftSmall 1.1s ease-out forwards}.gift-icon.premium.go{animation:giftPremium 1.3s cubic-bezier(.16,.84,.2,1) forwards}.gift-icon.big.go{animation:giftBig 1.65s cubic-bezier(.12,.82,.18,1) forwards}.gift-icon.legendary.go{animation:giftLegendary 1.9s cubic-bezier(.1,.85,.15,1) forwards}.gift-icon.ultra.go{animation:giftUltra 2.2s cubic-bezier(.08,.88,.12,1) forwards}.gift-icon.mythic.go{animation:giftMythic 2.55s cubic-bezier(.06,.9,.1,1) forwards}.gift-name{position:absolute;top:168px;max-width:92%;padding:9px 16px;border:1px solid #ffffff2e;border-radius:999px;background:#0f0d18ee;box-shadow:0 10px 35px #0009;color:#fff;font:800 14px system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;opacity:0;transform:translateY(12px) scale(.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gift-name.go{animation:nameIn 1.15s .08s ease-out forwards}.gift-to{position:absolute;top:210px;color:#d9cfff;font:700 11px system-ui,-apple-system,Segoe UI,sans-serif;opacity:0}.gift-to.go{animation:toIn 1.1s .15s ease-out forwards}.particle{position:absolute;left:50%;top:45%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px #ff4da8;opacity:0}.particle.go{animation:particle 1.05s cubic-bezier(.2,.7,.2,1) forwards}.particle.big{width:9px;height:9px;animation-duration:1.45s}.particle.legendary{width:10px;height:10px;animation-duration:1.7s}.particle.ultra{width:11px;height:11px;animation-duration:1.95s}.particle.mythic{width:13px;height:13px;animation-duration:2.2s}.ring{position:absolute;left:50%;top:43%;width:45px;height:45px;border:2px solid #ff4da8;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0}.ring.go{animation:ring 1s ease-out forwards}.ring.big.go{animation:ringBig 1.45s ease-out forwards}.ring.legendary.go{animation:ringLegendary 1.7s ease-out forwards}.ring.ultra.go{animation:ringUltra 2s ease-out forwards}.ring.mythic.go{animation:ringMythic 2.25s ease-out forwards}.burst{position:absolute;left:50%;top:43%;width:18px;height:18px;border-radius:50%;border:2px solid #fff;opacity:0;transform:translate(-50%,-50%) scale(.1)}.burst.go{animation:burst 1.4s ease-out forwards}.message-pop{position:absolute;left:50%;bottom:16%;transform:translate(-50%,20px) scale(.88);padding:9px 14px;border:1px solid #985cff77;border-radius:15px;background:#181522ee;color:#fff;font:800 12px system-ui,-apple-system,Segoe UI,sans-serif;opacity:0}.message-pop.go{animation:message .7s ease-out forwards}@keyframes flash{0%{opacity:0}20%{opacity:.8}100%{opacity:0}}@keyframes flashBig{0%{opacity:0}15%{opacity:1}40%{opacity:.45}100%{opacity:0}}@keyframes flashLegendary{0%{opacity:0}12%{opacity:1}28%{opacity:.3}45%{opacity:.7}100%{opacity:0}}@keyframes flashUltra{0%{opacity:0}10%{opacity:1}22%{opacity:.25}38%{opacity:.85}58%{opacity:.2}100%{opacity:0}}@keyframes flashMythic{0%{opacity:0}8%{opacity:1}18%{opacity:.2}30%{opacity:.95}44%{opacity:.12}60%{opacity:.7}100%{opacity:0}}@keyframes giftSmall{0%{opacity:0;transform:translateY(60px) scale(.25)}20%{opacity:1;transform:translateY(0) scale(1.12)}70%{opacity:1;transform:translateY(-6px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.75)}}@keyframes giftPremium{0%{opacity:0;transform:translateY(70px) scale(.2) rotate(-12deg)}18%{opacity:1;transform:translateY(0) scale(1.2) rotate(8deg)}42%{transform:translateY(-18px) scale(.96) rotate(-5deg)}70%{opacity:1;transform:translateY(-4px) scale(1.03) rotate(2deg)}100%{opacity:0;transform:translateY(-95px) scale(.7) rotate(5deg)}}@keyframes giftBig{0%{opacity:0;transform:translateY(100px) scale(.1) rotate(-28deg)}16%{opacity:1;transform:translateY(0) scale(1.35) rotate(12deg)}32%{transform:translateY(-26px) scale(.88) rotate(-8deg)}48%{transform:translateY(3px) scale(1.1) rotate(5deg)}70%{opacity:1;transform:translateY(-12px) scale(1) rotate(0)}100%{opacity:0;transform:translateY(-125px) scale(.62) rotate(10deg)}}@keyframes giftLegendary{0%{opacity:0;transform:translateY(125px) scale(.06) rotate(-35deg)}13%{opacity:1;transform:translateY(0) scale(1.5) rotate(15deg)}28%{transform:translateY(-38px) scale(.82) rotate(-10deg)}43%{transform:translateY(6px) scale(1.18) rotate(6deg)}62%{transform:translateY(-18px) scale(1.04) rotate(-2deg)}100%{opacity:0;transform:translateY(-155px) scale(.55) rotate(12deg)}}@keyframes giftUltra{0%{opacity:0;transform:translateY(145px) scale(.04) rotate(-45deg)}12%{opacity:1;transform:translateY(0) scale(1.58) rotate(18deg)}25%{transform:translateY(-48px) scale(.78) rotate(-13deg)}39%{transform:translateY(8px) scale(1.24) rotate(8deg)}55%{transform:translateY(-25px) scale(1.04) rotate(-3deg)}100%{opacity:0;transform:translateY(-180px) scale(.5) rotate(15deg)}}@keyframes giftMythic{0%{opacity:0;transform:translateY(170px) scale(.02) rotate(-55deg)}10%{opacity:1;transform:translateY(0) scale(1.72) rotate(22deg)}22%{transform:translateY(-58px) scale(.74) rotate(-16deg)}35%{transform:translateY(10px) scale(1.3) rotate(10deg)}50%{transform:translateY(-32px) scale(1.06) rotate(-4deg)}70%{opacity:1;transform:translateY(-12px) scale(1.02) rotate(0)}100%{opacity:0;transform:translateY(-205px) scale(.45) rotate(18deg)}}@keyframes nameIn{0%{opacity:0;transform:translateY(12px) scale(.9)}25%{opacity:1;transform:translateY(0) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-12px) scale(.96)}}@keyframes toIn{0%{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}@keyframes particle{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.05)}}@keyframes ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.2)}70%{opacity:.35}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes ringBig{0%{opacity:1;transform:translate(-50%,-50%) scale(.15)}45%{opacity:.65}100%{opacity:0;transform:translate(-50%,-50%) scale(8)}}@keyframes ringLegendary{0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}30%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) scale(11)}}@keyframes ringUltra{0%{opacity:1;transform:translate(-50%,-50%) scale(.08)}25%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(14)}}@keyframes ringMythic{0%{opacity:1;transform:translate(-50%,-50%) scale(.05)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(15)}}@keyframes message{0%{opacity:0;transform:translate(-50%,20px) scale(.88)}25%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(.98)}}@media(prefers-reduced-motion:reduce){.gift-icon.go,.gift-name.go,.gift-to.go,.particle.go,.ring.go,.flash.go,.message-pop.go,.burst.go{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<iframe class="frame" id="app" src="erischat-v17.html?v=20260916-18" title="ErisChat"></iframe>
<div class="fx" id="fx"></div>
<script>
(()=>{
'use strict';
const frame=document.getElementById('app'),fx=document.getElementById('fx');let bound=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseLidyum=v=>{const n=Number(String(v??'').replace(/\./g,'').replace(/,/g,''));return Number.isFinite(n)?n:0};
const tierOf=n=>n>=20000?'mythic':n>=10000?'ultra':n>=5000?'legendary':n>=1000?'big':n>=100?'premium':'small';
const cfg={small:{particles:24,rings:1,duration:1250,vibe:[20]},premium:{particles:34,rings:1,duration:1450,vibe:[20,30,40]},big:{particles:58,rings:2,duration:1800,vibe:[30,40,60]},legendary:{particles:82,rings:3,duration:2100,vibe:[35,45,70,45]},ultra:{particles:110,rings:3,duration:2400,vibe:[40,50,80,50,90]},mythic:{particles:145,rings:4,duration:2850,vibe:[45,55,90,55,110]}};
function particles(count,tier){for(let i=0;i<count;i++){const p=document.createElement('i');p.className='particle '+tier+' go';const spread=tier==='mythic'?230:tier==='ultra'?210:tier==='legendary'?185:tier==='big'?160:150;p.style.setProperty('--dx',(Math.random()*spread*2-spread)+'px');p.style.setProperty('--dy',(Math.random()*(spread+80)-(spread*.72))+'px');p.style.animationDelay=(Math.random()*.2)+'s';fx.appendChild(p);setTimeout(()=>p.remove(),2300)}}
function playGift(icon,name,recipient,amountText){const amount=parseLidyum(amountText),tier=tierOf(amount),c=cfg[tier];let rings='';for(let i=0;i<c.rings;i++)rings+=`<div class="ring ${tier} go" style="animation-delay:${i*.16}s"></div>`;const burst=tier==='legendary'||tier==='ultra'||tier==='mythic'?'<div class="burst go"></div>':'';fx.innerHTML=`<div class="flash ${tier} go"></div><div class="gift-stage">${rings}${burst}<div class="gift-icon ${tier} go">${esc(icon||'✨')}</div><div class="gift-name go">✨ ${esc(name||'Hediye')} • ${esc(amountText||'')} Lidyum</div><div class="gift-to go">${esc(recipient||'')} kişisine gönderildi</div></div>`;particles(c.particles,tier);if(navigator.vibrate)navigator.vibrate(c.vibe);setTimeout(()=>fx.innerHTML='',c.duration)}
function playMessage(){fx.innerHTML='<div class="message-pop go">💬 Mesaj gönderildi</div>';setTimeout(()=>fx.innerHTML='',800)}
function bind(){if(bound)return;const d=frame.contentDocument;if(!d)return;bound=true;d.addEventListener('click',e=>{const giftBtn=e.target.closest('[data-gift-send]');if(giftBtn){const card=giftBtn.closest('.gift');const icon=card?.querySelector('b')?.textContent?.trim()||'✨';const raw=(card?.textContent||'').replace(/\s+/g,' ').trim();const recipient=giftBtn.dataset.recipient||'';const amount=(raw.match(/([\d.,]+) Lidyum/)||[])[1]||'';const name=raw.replace(icon,'').replace(/\s*([\d.,]+) Lidyum\s*$/,'').trim();setTimeout(()=>playGift(icon,name,recipient,amount),70);return}const sendBtn=e.target.closest('[data-send]');if(sendBtn)setTimeout(playMessage,50)});}
frame.addEventListener('load',()=>setTimeout(bind,40));setTimeout(bind,900);
})();
</script>
</body>
</html>
