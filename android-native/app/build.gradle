plugins {
    id 'com.google.gms.google-services'
    id 'com.android.application'
}

android {
    namespace 'com.erischat.app'
    compileSdk 36

    def signingPath = System.getenv('ERISCHAT_SIGNING_FILE')
    def customSigning = signingPath != null && !signingPath.trim().isEmpty()

    signingConfigs {
        if (customSigning) {
            erischat {
                storeFile file(signingPath)
                storePassword System.getenv('ERISCHAT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ERISCHAT_SIGNING_ALIAS')
                keyPassword System.getenv('ERISCHAT_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.erischat.app'
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName '1.0.11'
        // V3: Real rewarded advertisements are OFF in every build.
        buildConfigField 'boolean', 'LIDYA_REAL_REWARDED_ADS', 'false'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Only locally installed debug APKs can use the real ad unit.
            // Register the phone as an AdMob test device first.
            buildConfigField 'boolean', 'LIDYA_REAL_REWARDED_ADS', 'true'
            if (customSigning) {
                signingConfig signingConfigs.erischat
            }
        }
        internal {
            // V10: Google Play internal testing only.
            // Real ad unit is used only with a server claim.
            // Google test devices must be registered in AdMob.
            initWith release
            matchingFallbacks = ['release']
            versionNameSuffix '-internal'
            buildConfigField 'boolean', 'LIDYA_REAL_REWARDED_ADS', 'true'
            if (customSigning) {
                signingConfig signingConfigs.erischat
            }
        }
        release {
            // Google Play builds remain locked.
            buildConfigField 'boolean', 'LIDYA_REAL_REWARDED_ADS', 'false'
            if (customSigning) {
                signingConfig signingConfigs.erischat
            }
            minifyEnabled false
        }
    }

    sourceSets {
        main.assets.srcDirs += ['build/generated/install-content']
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    // Test-only rewarded ads bridge; no Lidya payouts in this phase.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
}
