plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erischat.app'
    compileSdk 35

    def signingPath = System.getenv('ERISCHAT_SIGNING_FILE')
    def customSigning = signingPath != null && !signingPath.trim().isEmpty()

    signingConfigs {
        if (customSigning) {
        erischat {
            storeFile file(signingPath)
            storePassword System.getenv('ERISCHAT_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ERISCHAT_SIGNING_ALIAS')
            keyPassword System.getenv('ERISCHAT_KEY_PASSWORD')
        }
    }

        }

    buildTypes {
        debug {
            if (customSigning) {
                signingConfig signingConfigs.erischat
            }
        }
    }

    sourceSets {
        main.assets.srcDirs += ['build/generated/install-content']
    }

    defaultConfig {
        applicationId 'com.erischat.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.9'
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
}
