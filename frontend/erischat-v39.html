to;border-radius:18px;display:grid;place-items:center;font-size:25px;background:#211128;border:2px solid #ff68b5;box-shadow:0 0 20px #ff4da855;animation:pfpulse 2s infinite}.pfModal{display:none;position:fixed;inset:0;z-index:220;background:#020107e8;align-items:flex-end}.pfModal.show{display:flex}.pfBox{width:min(480px,100%);max-height:88vh;overflow:auto;background:#0b0811;border-radius:26px 26px 0 0;padding:16px}.pfBox h2{margin:8px 0 14px}.pfClose2{float:right;border:0;background:#ffffff10;color:#fff;border-radius:10px;padding:8px}.pfAction{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,#824dff,#ff4da8);color:#fff;padding:12px;margin-top:10px}.pfInput{width:100%;box-sizing:border-box;margin-top:9px;background:#ffffff08;border:1px solid #ffffff12;color:#fff;border-radius:12px;padding:11px;outline:none}.pfVip{background:linear-gradient(135deg,#160d20,#241033);border:1px solid #ffffff12;border-radius:20px;padding:14px}.pfVip strong{color:#ffd36a;font-size:16px}.pfBar{height:7px;background:#241b2b;border-radius:99px;overflow:hidden;margin:9px 0}.pfBar i{display:block;height:100%;background:linear-gradient(90deg,#824dff,#ff4da8)}.pfSwitch{width:40px;height:22px;border-radius:99px;background:#33283b;position:relative}.pfSwitch:after{content:"";width:18px;height:18px;border-radius:50%;background:#aaa;position:absolute;top:2px;left:2px;transition:.2s}.pfSwitch.on{background:#ff4da850}.pfSwitch.on:after{left:20px;background:#ff68b5}.pfToast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;background:#17111e;border:1px solid #ffffff18;padding:10px 14px;border-radius:13px;font-size:11px;z-index:300;transition:.2s}.pfToast.show{opacity:1;transform:translate(-50%,0)}@keyframes pfFloat{50%{transform:translateY(-5px)}}@keyframes pfpulse{50%{transform:scale(1.05);box-shadow:0 0 28px #ff4da877}}</style></head><body><iframe id="app" src="./erischat-v35.html?base=20260916-v39" title="ErisChat"></iframe><div id="profileFix" class="profileFix"><div class="pfTop"><button class="pfBack" onclick="pfClose()">← Geri</button><b>Profil</b><button class="pfClose" onclick="pfClose()">×</button></div><div class="pfContent"><div class="pfHero"><div class="pfHead"><div id="pfPic" class="pfPic">A</div><div><h2 id="pfName" style="margin:0 0 3px">Arda</h2><span class="pfMuted">ErisChat kullanıcısı</span></div></div><div class="pfMuted" style="margin-top:10px">Lidya Bakiyesi: <b style="color:#ff68b5">0 Lidyum</b></div></div><h3 style="margin-top:20px">Ayarlar</h3><div class="pfGrid"><button class="pfRow" onclick="pfAccount()"><span>⚙️</span><span style="flex:1"><b>Hesap ayarları</b><span class="pfSub">İsim 50 Lidyum • avatarlar ve çerçeveler 150 Lidyum</span></span><span>›</span></button><button class="pfRow" onclick="pfNotifications()"><span>🔔</span><span style="flex:1"><b>Bildirimler</b><span class="pfSub">Uygulama bildirimlerini aç / kapat</span></span><span>›</span></button><button class="pfRow" onclick="pfAppearance()"><span>🎨</span><span style="flex:1"><b>Görünüm</b><span class="pfSub">Dark tema / Aydınlık tema</span></span><span>›</span></button><button class="pfRow" onclick="pfVip()"><span>👑</span><span style="flex:1"><b>VIP</b><span class="pfSub">VIP 1 → VIP 12 ve harcama barajları</span></span><span>›</span></button></div></div></div><div id="pfModal" class="pfModal"><div class="pfBox"><button class="pfClose2" onclick="pfModalClose()">×</button><div id="pfModalBody"></div></div></div><div id="pfToast" class="pfToast"></div><script>const A=['🦁','🐺','🦋','🐉','🦊','🐯','🦅','🐍','🦂','🌙','☀️','👑','💎','🔥','🌹','🪽','🧿','⚡','🌌','🖤'],F=['👑','💎','🔥','🌹','🪽','🦋','⚡','🌙','☀️','🧿','🪙','🏛️','🦁','🐉','🌌','💜','💗','✨','🌑','♛'],V=[['VIP 1',600],['VIP 2',1500],['VIP 3',3000],['VIP 4',5000],['VIP 5',7500],['VIP 6',10500],['VIP 7',14500],['VIP 8',19500],['VIP 9',25500],['VIP 10',32500],['VIP 11',40500],['VIP 12',50000]];const frame=d=>d;function pfToast(t){const e=document.getElementById('pfToast');e.textContent=t;e.classList.add('show');clearTimeout(window._pfT);window._pfT=setTimeout(()=>e.classList.remove('show'),1800)}function pfOpen(h){document.getElementById('pfModalBody').innerHTML=h;document.getElementById('pfModal').classList.add('show')}function pfModalClose(){document.getElementById('pfModal').classList.remove('show')}function pfClose(){document.getElementById('profileFix').classList.remove('show')}function pfAccount(){pfOpen('<h2>⚙️ Hesap ayarları</h2><div class="pfCard"><b>İsim değiştir</b><span class="pfSub">Ücret: 50 Lidyum</span><input id="pfInput" class="pfInput" placeholder="Yeni isim"><button class="pfAction" onclick="pfName()">50 Lidyum ile değiştir</button></div><div class="pfCard" style="margin-top:10px"><b>Hareketli avatarlar</b><span class="pfSub">20 seçenek • 150 Lidyum/adet</span><div class="pfItems">'+A.map((x,i)=>'<button class="pfItem" onclick="pfAvatar('+i+')"><div class="pfAvatar">'+x+'</div><b>Avatar '+(i+1)+'</b><br><small style="color:#ff68b5">150 Lidyum</small></button>').join('')+'</div></div><div class="pfCard" style="margin-top:10px"><b>Hareketli çerçeveler</b><span class="pfSub">20 seçenek • 150 Lidyum/adet</span><div class="pfItems">'+F.map((x,i)=>'<button class="pfItem" onclick="pfFrame('+i+')"><div class="pfFrame">'+x+'</div><b>Çerçeve '+(i+1)+'</b><br><small style="color:#ff68b5">150 Lidyum</small></button>').join('')+'</div></div>')}function pfName(){const n=document.getElementById('pfInput').value.trim();if(!n)return pfToast('Önce yeni ismi yaz ✍️');document.getElementById('pfName').textContent=n;pfToast('İsim değişikliği seçildi • 50 Lidyum 💎')}function pfAvatar(i){document.getElementById('pfPic').textContent=A[i];pfToast('Avatar '+(i+1)+' seçildi • 150 Lidyum ✨')}function pfFrame(i){const p=document.getElementById('pfPic');p.style.boxShadow='0 0 0 3px #ff68b5,0 0 28px #ff4da899';p.style.borderRadius='18px';pfToast('Çerçeve '+(i+1)+' seçildi • 150 Lidyum 👑')}function pfNotifications(){pfOpen('<h2>🔔 Bildirimler</h2><div class="pfGrid"><button class="pfRow" onclick="pfToggle(this)"><span>🔔</span><span style="flex:1"><b>Uygulama bildirimleri</b><span class="pfSub">Uygulama bildirimlerini aç / kapat</span></span><span class="pfSwitch on"></span></button><button class="pfRow" onclick="pfToggle(this)"><span>💬</span><span style="flex:1"><b>Mesaj bildirimleri</b><span class="pfSub">Yeni mesajlarda bildirim</span></span><span class="pfSwitch on"></span></button><button class="pfRow" onclick="pfToggle(this)"><span>✨</span><span style="flex:1"><b>Etkinlik bildirimleri</b><span class="pfSub">Etkinlik ve oda duyuruları</span></span><span class="pfSwitch on"></span></button></div>')}function pfToggle(e){const s=e.querySelector('.pfSwitch');s.classList.toggle('on');pfToast(s.classList.contains('on')?'Bildirim açık 🔔':'Bildirim kapalı 🔕')}function pfAppearance(){pfOpen('<h2>🎨 Görünüm</h2><div class="pfGrid"><button class="pfRow" onclick="pfTheme(false)"><span>🌑</span><span style="flex:1"><b>Dark tema</b><span class="pfSub">Koyu görünüm</span></span><span>›</span></button><button class="pfRow" onclick="pfTheme(true)"><span>☀️</span><span style="flex:1"><b>Aydınlık tema</b><span class="pfSub">Açık görünüm</span></span><span>›</span></button></div>')}function pfTheme(light){document.getElementById('profileFix').style.background=light?'#f5f2f8':'#07050cf8';document.querySelector('.pfTop').style.background=light?'#f5f2f8':'#07050cf5';pfToast(light?'Aydınlık tema seçildi ☀️':'Dark tema seçildi 🌑')}function pfVip(){pfOpen('<h2>👑 VIP Sistemi</h2><p class="pfMuted">VIP seviyesi toplam Lidya harcamasına göre belirlenir.</p><div class="pfGrid">'+V.map((v,i)=>'<div class="pfVip"><strong>'+v[0]+'</strong><div class="pfBar"><i style="width:'+Math.min(100,12+i*7)+'%"></i></div><b>'+v[1].toLocaleString('tr-TR')+' Lidyum harcama</b><span class="pfSub">Bu seviyede özel profil ve görünüm özellikleri açılır.</span></div>').join('')+'</div>')}function bind(){try{const d=document.getElementById('app').contentDocument;if(!d)return;d.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-view]');if(!b)return;const v=b.getAttribute('data-view');if(v==='profile')document.getElementById('profileFix').classList.add('show');else document.getElementById('profileFix').classList.remove('show')},true)}catch(e){}}document.getElementById('app').addEventListener('load',bind);setTimeout(bind,300);setTimeout(bind,1200);</script></body></html>
