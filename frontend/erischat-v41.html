.vip-grid{display:grid;grid-template-columns:1fr;gap:8px}.vip{background:linear-gradient(145deg,#15101c,#0d0911);border:1px solid #ffffff12;border-radius:18px;padding:13px;display:flex;align-items:center;gap:12px}.vip-badge{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle,#ffdb75,#ff8c36 42%,#5e2517 75%);color:#180b08;font-weight:1000;font-size:13px;box-shadow:0 0 22px #ffb23a55}.vip-copy{flex:1}.vip-name{font-weight:900}.vip-title{font-size:11px;color:#ffca72;margin-top:2px}.vip-desc{font-size:10px;color:#94899e;margin-top:3px}.vip.locked{opacity:.55}.selected{outline:2px solid #ff58b4;box-shadow:0 0 22px #ff58b433}.switch{width:42px;height:23px;border-radius:99px;background:#30263a;position:relative}.switch:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;top:2px;left:2px;background:#777;transition:.2s}.switch.on{background:#ff4da855}.switch.on:after{left:21px;background:#ff70bd}.input{width:100%;margin-top:9px;background:#ffffff08;border:1px solid #ffffff12;color:#fff;border-radius:12px;padding:11px;outline:none}.action{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,#7e39ff,#ff3fa7);color:#fff;padding:12px;margin-top:10px}.modal{display:none;position:fixed;inset:0;z-index:400;background:#020107ee;align-items:flex-end}.modal.show{display:flex}.box{width:min(480px,100%);max-height:90vh;overflow:auto;background:#0b0811;border-radius:27px 27px 0 0;padding:16px}.close{float:right;border:0;background:#ffffff10;color:#fff;border-radius:10px;padding:8px}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;background:#17111e;border:1px solid #ffffff18;padding:10px 14px;border-radius:13px;font-size:11px;z-index:500;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<iframe id="app" src="./erischat-v35.html?base=20260916-v41" title="ErisChat"></iframe>
<button id="hotspot" class="hotspot" aria-label="Profil"></button>
<section id="profile" class="profile"><header class="top"><button onclick="closeProfile()">← Geri</button><b>PROFİL</b><button onclick="closeProfile()">×</button></header><main class="content">
<div class="hero"><div class="head"><div id="profileArt" class="profile-art"><div class="core"></div></div><div><h2 id="name" class="name">Arda</h2><span class="muted">ErisChat kullanıcısı</span><div id="vipLabel" class="vip-title">VIP Üye Değil</div></div></div><div class="balance"><span>Lidya bakiyesi</span><span id="balance" class="lidya">5.000 Lidyum</span></div></div>
<div class="section-title">PROFİL KOLEKSİYONU</div>
<button class="row" onclick="account()"><b>Hesap ve koleksiyon<span class="muted" style="display:block">İsim, hareketli avatarlar ve özel çerçeveler</span></b><span class="chev">›</span></button>
<button class="row" onclick="avatars()"><b>Hareketli avatar stüdyosu<span class="muted" style="display:block">20 özel karakter • 150 Lidyum</span></b><span class="chev">›</span></button>
<button class="row" onclick="frames()"><b>Özel çerçeve stüdyosu<span class="muted" style="display:block">20 animasyonlu çerçeve • 150 Lidyum</span></b><span class="chev">›</span></button>
<button class="row" onclick="vip()"><b>VIP kulübü<span class="muted" style="display:block">VIP 1 → VIP 12 • özel profil unvanları</span></b><span class="chev">›</span></button>
<div class="section-title">UYGULAMA</div>
<button class="row" onclick="notifications()"><b>Bildirimler<span class="muted" style="display:block">Uygulama, mesaj ve etkinlik bildirimleri</span></b><span class="chev">›</span></button>
<button class="row" onclick="appearance()"><b>Görünüm<span class="muted" style="display:block">Dark / Aydınlık tema</span></b><span class="chev">›</span></button>
</main></section>
<section id="modal" class="modal"><div class="box"><button class="close" onclick="modalClose()">×</button><div id="body"></div></div></section><div id="toast" class="toast"></div>
<script>
const AV=[['Gece Prensesi','a1'],['Neon Gezgin','a2'],['Kızıl Nova','a3'],['Siber Ruh','a4'],['Mor Cadı','a5'],['Altın Avcı','a6'],['Zümrüt Ruh','a7'],['Kızıl Ay','a8'],['Mavi Muhafız','a9'],['Güneş Çocuğu','a10'],['Violet Queen','a11'],['Aqua Soul','a12'],['Shadow King','a13'],['Amber Rogue','a14'],['Ultraviolet','a15'],['Pink Phantom','a16'],['Forest Wolf','a17'],['Sky Hunter','a18'],['Crimson Lord','a19'],['Astral Diva','a20']];
const FR=['Neon Pulse','Royal Violet','Cyber Cyan','Golden Halo','Emerald Flame','Crimson Edge','Violet Orbit','Diamond White','Skyline','Pink Aura','Amethyst','Aqua Ring','Sunset','Lime Nova','Rose Chrome','Purple Crown','Solar Gold','Emerald Ring','Ruby Storm','Cosmic Lilac'];
const TH=[600,1500,3000,5000,7500,10500,14500,19500,25500,32500,40500,50000];
const VT=['Kıvılcım','Mor Işık','Neon','Kraliyet','Elit','Süperstar','Efsane','İmparator','Mitik','Kadim','Ebedi','Eris Legend'];
let state=JSON.parse(localStorage.getItem('erisProfileV41')||'null')||{name:'Arda',balance:5000,spent:0,avatar:0,frame:0,ownedA:[0],ownedF:[0],light:false};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('erisProfileV41',JSON.stringify(state));render()}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function openProfile(){render();$('profile').classList.add('show');$('hotspot').style.display='none'}function closeProfile(){$('profile').classList.remove('show');$('hotspot').style.display='block'}
function modal(h){$('body').innerHTML=h;$('modal').classList.add('show')}function modalClose(){$('modal').classList.remove('show')}
function render(){ $('name').textContent=state.name; $('balance').textContent=state.balance.toLocaleString('tr-TR')+' Lidyum'; $('profileArt').className='profile-art'; if(state.frame>0)$('profileArt').classList.add('selected'); $('vipLabel').textContent=vipInfo().label; $('vipLabel').style.color=vipInfo().level?'#ffca72':'#9e91aa'; }
function vipInfo(){let level=0;for(let i=0;i<TH.length;i++)if(state.spent>=TH[i])level=i+1;return {level,label:level?'VIP '+level+' • '+VT[level-1]:'VIP Üye Değil'}}
function avatarCard(i){let owned=state.ownedA.includes(i);return `<div class="asset ${owned?'':'locked'}"><div class="avatar-art ${AV[i][1]}"></div><div class="asset-name">${AV[i][0]}</div><div class="price">${owned?'Koleksiyonda':'150 Lidyum'}</div><button class="${owned?'':'buy'}" onclick="${owned?'selectA('+i+')':'buyA('+i+')'}">${state.avatar===i?'AKTİF':owned?'KULLAN':'SATIN AL'}</button></div>`}
function frameCard(i){let owned=state.ownedF.includes(i);return `<div class="asset ${owned?'':'locked'}"><div class="frame-art f${i+1}"></div><div class="asset-name">${FR[i]}</div><div class="price">${owned?'Koleksiyonda':'150 Lidyum'}</div><button class="${owned?'':'buy'}" onclick="${owned?'selectF('+i+')':'buyF('+i+')'}">${state.frame===i?'AKTİF':owned?'KULLAN':'SATIN AL'}</button></div>`}
function account(){modal(`<h2>Hesap ve koleksiyon</h2><div class="card"><b>Profil adı</b><span class="muted" style="display:block">Değiştirme ücreti: 50 Lidyum</span><input id="newName" class="input" value="${state.name}" maxlength="18"><button class="action" onclick="changeName()">50 Lidyum ile kaydet</button></div><div class="card"><b>Aktif görünüm</b><div class="muted" style="margin-top:5px">Avatar: ${AV[state.avatar][0]} • Çerçeve: ${FR[state.frame]}</div></div>`)}
function avatars(){modal(`<h2>Hareketli Avatar Stüdyosu</h2><p class="muted">Emoji değil. Her kart gerçek CSS karakter artı animasyonlu ışık efektidir. Yeni avatar 150 Lidyum.</p><div class="grid">${AV.map((_,i)=>avatarCard(i)).join('')}</div>`)}
function frames(){modal(`<h2>Özel Çerçeve Stüdyosu</h2><p class="muted">Profil fotoğrafının etrafında çalışan 20 farklı animasyonlu efekt. Her çerçeve 150 Lidyum.</p><div class="grid">${FR.map((_,i)=>frameCard(i)).join('')}</div>`)}
function buyA(i){if(state.balance<150)return toast('Yetersiz Lidyum');state.balance-=150;state.spent+=150;state.ownedA.push(i);state.avatar=i;save();avatars();toast(AV[i][0]+' satın alındı')}
function buyF(i){if(state.balance<150)return toast('Yetersiz Lidyum');state.balance-=150;state.spent+=150;state.ownedF.push(i);state.frame=i;save();frames();toast(FR[i]+' çerçevesi satın alındı')}
function selectA(i){state.avatar=i;save();toast('Avatar aktif edildi')}
function selectF(i){state.frame=i;save();toast('Çerçeve aktif edildi')}
function changeName(){let n=$('newName').value.trim();if(!n)return toast('İsim boş olamaz');if(n===state.name)return toast('İsim zaten aynı');if(state.balance<50)return toast('Yetersiz Lidyum');state.balance-=50;state.spent+=50;state.name=n;save();account();toast('Profil adı güncellendi')}
function notifications(){modal(`<h2>Bildirimler</h2>${['Uygulama bildirimleri','Mesaj bildirimleri','Etkinlik bildirimleri'].map((x,i)=>`<button class="row" onclick="this.querySelector('.switch').classList.toggle('on')"><b>${x}<span class="muted" style="display:block">Bildirimleri aç / kapat</span></b><span class="switch ${i<2?'on':''}"></span></button>`).join('')}`)}
function appearance(){modal(`<h2>Görünüm</h2><button class="row" onclick="setTheme(false)"><b>Dark tema<span class="muted" style="display:block">ErisChat'in ana görünümü</span></b>›</button><button class="row" onclick="setTheme(true)"><b>Aydınlık tema<span class="muted" style="display:block">Açık görünüm</span></b>›</button>`)}
function setTheme(light){state.light=light;save();$('profile').style.background=light?'#f5f2f8':'radial-gradient(circle at 50% -10%,#32104a,#07050cf7 45%)';toast(light?'Aydınlık tema seçildi':'Dark tema seçildi')}
function vip(){modal(`<h2>VIP Kulübü</h2><p class="muted">VIP seviyesi toplam harcamaya göre kalıcı yükselir. Her seviyenin profilinde özel unvanı görünür.</p><div class="vip-grid">${TH.map((n,i)=>{let ok=state.spent>=n;return `<div class="vip ${ok?'':'locked'}"><div class="vip-badge">V${i+1}</div><div class="vip-copy"><div class="vip-name">VIP ${i+1}</div><div class="vip-title">${VT[i]} ${ok?'• AÇILDI':''}</div><div class="vip-desc">${n.toLocaleString('tr-TR')} Lidyum toplam harcama • özel profil unvanı + VIP rozet efekti</div></div></div>`}).join('')}</div>`)}
$('hotspot').onclick=openProfile;window.addEventListener('message',e=>{if(e.data==='profile')openProfile()});render();
</script></body></html>
