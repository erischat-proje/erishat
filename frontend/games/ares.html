async function perform(action='spin'){if(!alive||busy||!ready)return;clearTimeout(timer);soundUnlock();busy=true;settled=false;sync();const prior=state;phase=active()?'free':'base';try{if(!pending){pending={request_id:crypto.randomUUID(),round_id:active()?state.round_id:null,sequence:active()?state.sequence:0,stake,action};sessionStorage.setItem(key,JSON.stringify(pending))}status('Mühürler açılıyor…');const response=await api('/spin',{method:'POST',body:JSON.stringify(pending)});if(!alive)return;settled=true;pending=null;sessionStorage.removeItem(key);balance=response.balance;notifyWallet(balance);await replay(response.result);if(!alive)return;state=response.state;if(response.next_rules){rules=response.next_rules;renderRules(rules)}if(prior&&!prior.finished&&state.finished){bonusAuto=false;await banner(response.result.capped?'10.000× AZAMİ KAZANÇ':'BONUS TAMAMLANDI',fmt(state.total_payout)+' LİDYA')}else if(response.payout>=stake*20){await banner(response.result.capped?'10.000× AZAMİ KAZANÇ':'EFSANEVİ KAZANÇ',fmt(response.payout)+' LİDYA')}if(active()&&(!prior||prior.finished))bonusAuto=!hold&&!document.hidden;if(!active()&&auto>0)auto--;status(response.result.capped?'10.000× toplam tur sınırına ulaşıldı.':active()?state.remaining+' serbest tur · Toplam '+fmt(state.total_payout)+' Lidya':response.payout?'Kazanç: '+fmt(response.payout)+' Lidya':'Yeni bir tur, yeni bir efsane.')}catch(e){pauseAuto();if(!settled&&e.status>=400&&e.status<500){pending=null;sessionStorage.removeItem(key);if(e.status===409){try{const a=await api('/active');state=a.state;balance=a.balance;if(a.rules){rules=a.rules;renderRules(rules)}stake=state?.stake||stake;if(a.last?.result?.board)board=a.last.result.board}catch{}}}status(e.message||'Bağlantı kesildi. Aynı isteği tekrar deneyebilirsin.')}finally{busy=false;sync()}if(alive&&!document.hidden&&(auto>0||bonusAuto))timer=setTimeout(()=>perform(),600)}
function drawSymbol(x,y,t,scale=1){if(t===null||t===undefined)return;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);if(sprite.complete&&sprite.naturalWidth){let n=AZ?2:4,sw=sprite.naturalWidth/4,sh=sprite.naturalHeight/n;ctx.drawImage(sprite,(t%4)*sw,Math.floor(t/4)*sh,sw,sh,-S*.46,-S*.46,S*.92,S*.92)}else{ctx.fillStyle=pal[t%pal.length]||'#e5be6b';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(0,-S*.33);ctx.lineTo(S*.32,0);ctx.lineTo(0,S*.33);ctx.lineTo(-S*.32,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font=`bold ${S*.2}px sans-serif`;ctx.textAlign='center';ctx.fillText(t===7&&AZ?'W':t===9?'⚔':t>=10?['↔','↕','⤢','✚'][t-10]:'',0,S*.08)}ctx.restore()}
function draw(t){if(!alive)return;let dt=Math.min(.04,(t-last)/1000||.016);last=t;ctx.clearRect(0,0,720,cv.height);if(!AZ){let age=t-swordTime,frame=age<600?Math.min(3,Math.floor(age/150)):0;$('warrior').style.backgroundPosition=(frame*100/3)+'% 50%';$('warrior').style.transform=reduced()?'none':'translateY('+Math.sin(t/600)*2+'px)'}ctx.save();if(shake>.1&&!reduced()){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}for(let i=0;i<N;i++){let x=i%COLS*S,y=Math.floor(i/COLS)*S;ctx.fillStyle=(i+Math.floor(i/COLS))%2?(AZ?'#17343b':'#2b232c'):(AZ?'#102930':'#211923');ctx.fillRect(x+1,y+1,S-2,S-2);ctx.strokeStyle='#e5c48610';ctx.strokeRect(x+2,y+2,S-4,S-4);if(marks.has(i)){let c=['#43bdff','#fe86d6','#ba8850','#ff4d5e','#48f291'][marks.get(i)],g=ctx.createRadialGradient(x+S/2,y+S/2,2,x+S/2,y+S/2,S*.65);g.addColorStop(0,c+(Math.floor(100+Math.sin(t/300)*30).toString(16).padStart(2,'0')));g.addColorStop(1,c+'00');ctx.fillStyle=g;ctx.fillRect(x,y,S,S);ctx.strokeStyle=c;ctx.lineWidth=2;ctx.strokeRect(x+5,y+5,S-10,S-10)}let off=fall.get(i)||0;if(reduced()){off=0;fall.delete(i)}else if(Math.abs(off)>.3){off*=Math.exp(-dt*13);fall.set(i,off)}else fall.delete(i);if(!removed.has(i))drawSymbol(x+S/2,y+S/2+off,board[i],highlight.has(i)?1.12:1);if(highlight.has(i)){ctx.fillStyle='#ffeca355';ctx.fillRect(x,y,S,S)}}if(giant){giant.offset=reduced()?0:giant.offset*Math.exp(-dt*14);drawSymbol((giant.x+giant.size/2)*S,(giant.y+giant.size/2)*S+giant.offset,giant.t,giant.size)}for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;for(let o of orbs){o.t+=dt*1.5;let z=Math.min(1,o.t);o.x=o.sx+(o.tx-o.sx)*z;o.y=o.sy+(o.ty-o.sy)*z-Math.sin(z*Math.PI)*100;ctx.fillStyle='#fbe2a5';ctx.shadowColor='#ffc95e';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(o.x,o.y,3*(1-z)+1,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;orbs=orbs.filter(o=>o.t<1);for(let r of rings){r.life-=dt;r.r+=dt*750;ctx.strokeStyle='rgba(255,148,60,'+Math.max(0,r.life)+')';ctx.lineWidth=8*r.life;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}rings=rings.filter(r=>r.life>0);if(sword>0){sword-=dt*2;ctx.strokeStyle='rgba(255,231,169,'+Math.max(0,sword)+')';ctx.lineWidth=7*Math.max(0,sword);ctx.beginPath();ctx.moveTo(710,cv.height*.85);ctx.quadraticCurveTo(200,cv.height*.25,710,8);ctx.stroke()}ctx.restore();raf=requestAnimationFrame(draw)}
function close(){pauseAuto();if(parent!==window)parent.postMessage({type:'lidya-original-close',game:KIND},location.origin);else location.href='../erischat-main.html#games'}
$('back').onclick=close;$('spin').onclick=()=>{hold=false;bonusAuto=!!active();perform()};$('minus').onclick=()=>{stake=SlotStakes.next(stake,-1);sync()};$('plus').onclick=()=>{stake=SlotStakes.next(stake,1);sync()};$('auto').onclick=()=>{if(auto||bonusAuto){pauseAuto();return}hold=false;if(active())bonusAuto=true;else auto=Number($('autoCount').value);perform()};$('sound').onclick=()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('eris.'+KIND+'.sound',soundEnabled?'on':'off')}catch{}if(soundEnabled){soundUnlock();sfx('unlock')}else stopSound();sync()};$('buy').onclick=()=>{pauseAuto();$('buyInfo').textContent=AZ?'1. seviye Altın Ateşi başlatılır. Beş zemin gücü sırayla tetiklenir.':rules.bonus_spins+' serbest tur başlatılır.';$('buyPrice').textContent=fmt(stake*rules.bonus_cost);$('buyBalance').textContent=fmt(balance);$('yes').disabled=busy||active()||!!pending||balance<stake*rules.bonus_cost;$('confirm').showModal()};$('yes').onclick=()=>{$('confirm').close();hold=false;perform('buy')};$('no').onclick=()=>$('confirm').close();$('help').onclick=()=>{pauseAuto();$('rules').showModal()};$('closeRules').onclick=()=>$('rules').close();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('rules').open&&!$('confirm').open){e.preventDefault();close()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseAuto();cancelAnimationFrame(raf);audio?.suspend();}else{last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}});addEventListener('pagehide',()=>{alive=false;clearTimeout(timer);cancelAnimationFrame(raf);stopSound();audio?.close()});sprite.onerror=()=>{imageFailed=true;status('Taş görselleri yüklenemedi; bağlantını kontrol et.')};
function renderRules(r){const mechanics=AZ?'<p>8×8 alanda yatay veya dikey komşu en az 5 aynı mücevher ödeme yapar. Köşegen sayılmaz. Wild bir dalgada tek kümeye katılır. Patlayan taşların yerine yenileri düşer.</p><p>'+(r.version.endsWith('-v1')?'':'Zemin işaretleri rastgele oluşur; her turda beşinin birden gelmesi garanti değildir. ')+'Parlayan zemindeki taş temizlenirse gücü tumble bitiminde çalışır. Mavi: bütün alanı temizler. Pembe: bir rengi Wild yapar. Kahverengi: üç adet 2×2 blok. Kırmızı: 3×3, 4×4 veya 5×5 dev taş. Yeşil: 5–15 Wild. Her zemin gücü ana turda en fazla bir kez çalışır. Aynı dev taş hücreleri tek görsel altında ayrı sembollerdir.</p><p>Ana turda 114 '+(r.version.endsWith('-v1')?'temizlenen':'ödeme yapan')+' taş Altın Ateşi açar. '+(r.version.endsWith('-v1')?'':'Nükleer alan yenilemesi seviye sayacına eklenmez. ')+'Her seviyede beş güç garantidir; çarpanlar 2/4/6/8/10×. Sonraki seviyeye geçmek için mevcut seviyede 116/120/125/132 taş gerekir. Seviye sayacı her aşamada sıfırlanır; ekrandaki toplam sayaç birikmeye devam eder. 100× satın alma doğrudan birinci seviyeyi açar.</p>':'<p>6×5 alanda herhangi bir yerde en az 8 aynı nesne ödeme yapar. Ödeme çizgisi şartı yoktur. Kazananlar temizlenir ve yeni nesneler düşer.</p><p>Kazanç kalmayınca bombalar yatay, dikey, iki köşegen veya artı doğrultularını temizler. Vurulan diğer bombalar da patlar. Bu temizleme doğrudan ödeme yapmaz; kilit sayacını doldurur ve yeni kümelere fırsat verir.</p><p>Ana oyunda 20/50/100 nesnede 2–4× / 5–8× / 10–50× kilitleri açılır. Serbest turlarda 15/30/45/60/100/225 nesne altı kilidi açar. Çarpan seçenekleri sırasıyla 2/5/10/25/50; 10/25/50/100; 20/50/100/150; 30/50/100/200; 50/100/150/250; 500× değerleridir. En yüksek açılan çarpan tur kazancına bir kez uygulanır; sayaç her serbest turda sıfırlanır.</p><p>İlk tahtada 4/5/6+ kılıç 3/5/100× ödeme ve 15 serbest tur verir. Bonusta da +15 tur kazandırır. Doldurma sırasında yeni kılıç gelmez. Satın alma fiyatı 100× temel bahistir.</p>';
$('ruletext').innerHTML=mechanics+'<p>Sonuç ve ücret sunucuda belirlenir. Ortak Lidya cüzdanının küsuratları korunur. Bağlantı kesilirse aynı istek tekrar denenir; ikinci ücret alınmaz. Bonus bahisleri kilitlenir ve kapanıp açınca devam eder. 10.000× sınırı, serbest turlar dahil tüm bonusun toplamıdır. '+r.rtp_status+'. '+(r.target_rtp?'Hedef uzun vadeli geri ödeme: %'+(r.target_rtp*100).toFixed(2)+'. Bu oran her turda kazanma olasılığı değildir.':'')+'</p><h3>Ödeme tablosu · bahis katı</h3><table><thead><tr><th>Sembol</th>'+r.pay_sizes.map(n=>'<th>'+n+(n===r.pay_sizes.at(-1)?'+':'')+'</th>').join('')+'</tr></thead><tbody>'+r.symbol_names.map((n,i)=>'<tr><td>'+n+'</td>'+r.paytable[i].map(v=>'<td>'+v+'×</td>').join('')+'</tr>').join('')+'</tbody></table>';if(r.bonus_paytable){$('ruletext').innerHTML+='<h3>Serbest tur ödeme tablosu · bahis katı</h3><table><tbody>'+r.symbol_names.map((n,i)=>'<tr><td>'+n+'</td>'+r.bonus_paytable[i].map(v=>'<td>'+v+'×</td>').join('')+'</tr>').join('')+'</tbody></table>';}}
async function init(){try{if(!apiRoot)throw Error('ErisChat oturumu bulunamadı');let [a,r,me]=await Promise.all([api('/active'),api('/rules'),apiRoot.getMe()]);r=a.rules||r;rules=r;state=a.state;balance=a.balance;stake=state?.stake||50;key='eris.'+KIND+'.pending.v1:'+me.id;try{pending=JSON.parse(sessionStorage.getItem(key)||'null')}catch{sessionStorage.removeItem(key)}if(pending&&(!pending.request_id||!Number.isInteger(pending.stake))){pending=null;sessionStorage.removeItem(key)}if(pending?.request_id===a.last?.request_id){pending=null;sessionStorage.removeItem(key)}if(pending)stake=pending.stake;if(a.last?.result){let e=a.last.result.events.at(-1);board=a.last.result.board;count=e.count;mult=e.mult;locks=e.locks;win=a.last.payout;stage=e.stage;stageCount=e.stage_count}renderRules(r);ready=true;status(pending?'Bekleyen isteği aynı kimlikle tekrar deneyebilirsin.':active()?'Bonusun kaydedildi. Devam etmek için düğmeye dokun.':'Bahsini seç; efsaneyi başlat.');sync()}catch(e){status(e.message||'Oyun yüklenemedi.');$('spin').textContent='YENİDEN YÜKLE';$('spin').disabled=false;$('spin').onclick=()=>location.reload()}}
raf=requestAnimationFrame(draw);sync();window.LidyaNonRoom.mount(document.querySelector('main'),{game:KIND,getStake:()=>stake,setStake:value=>{stake=value;sync()},isLocked:()=>busy||active()||!!pending});init();
</script></body></html>
