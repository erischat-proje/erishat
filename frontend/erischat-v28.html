<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07050c"><title>ErisChat — v28 Interactive</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07050c}iframe{width:100%;height:100%;border:0;display:block}.layer{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:#020107d9;backdrop-filter:blur(9px)}.layer.show{display:flex}.sheet{width:min(480px,100%);margin:auto 0 0;background:#0b0811;color:#fff;border:1px solid #ffffff12;border-bottom:0;border-radius:28px 28px 0 0;overflow:hidden;font-family:system-ui;box-shadow:0 -20px 70px #000b}.head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #ffffff0d}.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#ff4da8,#824dff);display:grid;place-items:center;font-weight:900}.who{flex:1}.who b{font-size:13px}.who small{display:block;color:#8f8498;font-size:9px;margin-top:3px}.close{width:34px;height:34px;border:1px solid #ffffff10;border-radius:12px;background:#ffffff08;color:#fff;font-size:19px}.body{height:230px;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:75%;padding:9px 11px;border-radius:15px;background:#15101c;font-size:10px;align-self:flex-start}.me{align-self:flex-end;background:linear-gradient(135deg,#8b3df0,#ff4da8)}.gift{padding:11px 12px;border-top:1px solid #ffffff0d}.giftTitle{display:flex;justify-content:space-between;margin-bottom:8px}.giftTitle b{font-size:11px}.giftTitle span{font-size:8px;color:#82778b}.gifts{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.g{min-height:58px;border:1px solid #ffffff0d;border-radius:15px;background:#ffffff05;color:#fff;position:relative;display:grid;place-items:center}.g i{font-style:normal;font-size:23px}.g small{position:absolute;bottom:4px;font-size:7px;color:#9c90a3}.compose{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ffffff0d}.input{flex:1;border:1px solid #ffffff10;border-radius:14px;background:#ffffff06;color:#fff;padding:10px;font-size:10px;outline:0}.send{width:42px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff4da8,#824dff);color:#fff;font-size:16px}.fx{position:fixed;inset:0;z-index:100;display:none;place-items:center;pointer-events:none;background:radial-gradient(circle,#48175faa,transparent 48%)}.fx.show{display:grid;animation:fade .95s ease-out forwards}.fx b{font-size:95px;filter:drop-shadow(0 0 30px #ff4da8);animation:pop .95s cubic-bezier(.16,1,.3,1)}@keyframes pop{0%{opacity:0;transform:scale(.1) rotate(-20deg)}35%{opacity:1;transform:scale(1.25) rotate(5deg)}65%{transform:scale(.95)}100%{opacity:0;transform:scale(1.1) translateY(-35px)}}@keyframes fade{to{opacity:0}}@media(min-width:700px){.sheet{margin-bottom:4vh;border:1px solid #ffffff12;border-radius:28px}}</style></head><body><iframe id="frame" src="./erischat-v26.html?v=20260916-v26-fix3"></iframe><div id="layer" class="layer"><div class="sheet"><div class="head"><div class="av" id="av">R</div><div class="who"><b id="name">Rana</b><small>● çevrimiçi</small></div><button class="close" id="close">×</button></div><div class="body" id="body"><div class="bubble">Bugün nasılsın? ✨</div><div class="bubble me">İyiyim, biraz ErisChat'e bakıyorum 😄</div></div><div class="gift"><div class="giftTitle"><b>🎁 Hediye gönder</b><span>dokun ve animasyonu izle</span></div><div class="gifts"><button class="g" data-i="💗" data-n="Kalp"><i>💗</i><small>25</small></button><button class="g" data-i="🌹" data-n="Gül"><i>🌹</i><small>250</small></button><button class="g" data-i="🦁" data-n="Aslan"><i>🦁</i><small>2.5K</small></button><button class="g" data-i="👑" data-n="Kraliyet"><i>👑</i><small>7.5K</small></button><button class="g" data-i="💎" data-n="Elmas"><i>💎</i><small>15K</small></button><button class="g" data-i="🌌" data-n="Galaksi"><i>🌌</i><small>25K</small></button></div></div><div class="compose"><input id="input" class="input" placeholder="Mesaj yaz…"><button id="send" class="send">➤</button></div></div></div><div id="fx" class="fx"><b id="fxIcon">💎</b></div><script>const f=document.getElementById('frame'),layer=document.getElementById('layer'),body=document.getElementById('body'),names=['Rana','DJ Luna','Nora','Elif'],avs=['R','L','N','E'];function chat(i){document.getElementById('name').textContent=names[i]||names[0];document.getElementById('av').textContent=avs[i]||'R';layer.classList.add('show');setTimeout(()=>document.getElementById('input').focus(),50)}function closeChat(){layer.classList.remove('show')}document.getElementById('close').onclick=closeChat;layer.onclick=e=>{if(e.target===layer)closeChat()};document.querySelectorAll('.g').forEach(x=>x.onclick=()=>{const icon=x.dataset.i,name=x.dataset.n;document.getElementById('fxIcon').textContent=icon;const fx=document.getElementById('fx');fx.classList.remove('show');void fx.offsetWidth;fx.classList.add('show');const m=document.createElement('div');m.className='bubble me';m.textContent='🎁 '+name+' gönderildi '+icon;body.appendChild(m);body.scrollTop=99999});function send(){const i=document.getElementById('input'),t=i.value.trim();if(!t)return;const m=document.createElement('div');m.className='bubble me';m.textContent=t;body.appendChild(m);i.value='';body.scrollTop=99999}document.getElementById('send').onclick=send;document.getElementById('input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};let hooked=null;function hook(){try{const d=f.contentDocument;if(!d||hooked===d)return;hooked=d;d.addEventListener('click',e=>{const el=e.target.closest?.('.chat');if(el){const all=[...d.querySelectorAll('.chat')];e.preventDefault();e.stopPropagation();chat(Math.max(0,all.indexOf(el)));return}const nav=e.target.closest?.('.nav[data-go="messages"]');if(nav){e.preventDefault();e.stopPropagation();chat(0)}},true)}catch(_){}}f.onload=()=>{hooked=null;hook()};[100,500,1200,2500].forEach(t=>setTimeout(hook,t));setInterval(hook,3000);</script></body></html>
