<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07050c"><title>ErisChat v40</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07050c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#app{position:fixed;inset:0;width:100%;height:100%;border:0}.hotspot{position:fixed;right:0;bottom:0;width:min(96px,20vw);height:76px;z-index:210;background:transparent;border:0}.profile{display:none;position:fixed;inset:0;z-index:300;background:#07050cf8;overflow:auto}.profile.show{display:block}.top{height:68px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#07050cf5;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff0b}.top button{border:0;background:#ffffff10;color:#fff;border-radius:11px;padding:9px 12px}.content{max-width:480px;margin:auto;padding:15px 15px 110px}.hero,.card,.row,.vip{background:#100b18;border:1px solid #ffffff12;border-radius:20px;padding:15px}.hero{margin-bottom:14px}.head{display:flex;align-items:center;gap:12px}.pic{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#ff4da8,#824dff);display:grid;place-items:center;font-size:24px;font-weight:900;animation:pulse 2s infinite}.muted{color:#968aa0;font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.row{width:100%;color:#fff;text-align:left;display:flex;align-items:center;gap:10px;margin:8px 0}.row b{flex:1}.item{border:1px solid #ffffff12;background:#ffffff08;color:#fff;border-radius:16px;padding:11px;text-align:center}.avatar{font-size:25px;width:48px;height:48px;margin:auto;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#ff4da8,#824dff);animation:float 2s infinite}.frame{font-size:25px;width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:17px;background:#211128;border:2px solid #ff68b5;box-shadow:0 0 20px #ff68b555;animation:pulse 2s infinite}.modal{display:none;position:fixed;inset:0;z-index:400;background:#020107e8;align-items:flex-end}.modal.show{display:flex}.box{width:min(480px,100%);max-height:88vh;overflow:auto;background:#0b0811;border-radius:26px 26px 0 0;padding:16px}.close{float:right;border:0;background:#ffffff10;color:#fff;border-radius:10px;padding:8px}.action{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,#824dff,#ff4da8);color:#fff;padding:12px;margin-top:10px}.input{width:100%;margin-top:9px;background:#ffffff08;border:1px solid #ffffff12;color:#fff;border-radius:12px;padding:11px;outline:none}.switch{width:40px;height:22px;border-radius:99px;background:#33283b;position:relative}.switch:after{content:"";width:18px;height:18px;border-radius:50%;background:#aaa;position:absolute;top:2px;left:2px;transition:.2s}.switch.on{background:#ff4da850}.switch.on:after{left:20px;background:#ff68b5}.vip strong{color:#ffd36a}.bar{height:7px;background:#241b2b;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#824dff,#ff4da8)}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;background:#17111e;border:1px solid #ffffff18;padding:10px 14px;border-radius:13px;font-size:11px;z-index:500;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes float{50%{transform:translateY(-5px)}}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 25px #ff4da877}}</style></head><body><iframe id="app" src="./erischat-v35.html?base=20260916-v40" title="ErisChat"></iframe><button id="hotspot" class="hotspot" aria-label="Profil"></button><section id="profile" class="profile"><header class="top"><button onclick="closeProfile()">← Geri</button><b>Profil</b><button onclick="closeProfile()">×</button></header><main class="content"><div class="hero"><div class="head"><div id="pic" class="pic">A</div><div><h2 id="name" style="margin:0 0 3px">Arda</h2><span class="muted">ErisChat kullanıcısı</span></div></div><div class="muted" style="margin-top:10px">Lidya Bakiyesi: <b style="color:#ff68b5">0 Lidyum</b></div></div><h3>Ayarlar</h3><button class="row" onclick="account()">⚙️ <b>Hesap ayarları<span class="muted" style="display:block">İsim 50 Lidyum • avatar/çerçeve 150 Lidyum</span></b>›</button><button class="row" onclick="notifications()">🔔 <b>Bildirimler<span class="muted" style="display:block">Uygulama bildirimlerini aç / kapat</span></b>›</button><button class="row" onclick="appearance()">🎨 <b>Görünüm<span class="muted" style="display:block">Dark tema / Aydınlık tema</span></b>›</button><button class="row" onclick="vip()">👑 <b>VIP<span class="muted" style="display:block">VIP 1 → VIP 12</span></b>›</button></main></section><section id="modal" class="modal"><div class="box"><button class="close" onclick="modalClose()">×</button><div id="body"></div></div></section><div id="toast" class="toast"></div><script>const A=['🦁','🐺','🦋','🐉','🦊','🐯','🦅','🐍','🦂','🌙','☀️','👑','💎','🔥','🌹','🪽','🧿','⚡','🌌','🖤'],F=['👑','💎','🔥','🌹','🪽','🦋','⚡','🌙','☀️','🧿','🪙','🏛️','🦁','🐉','🌌','💜','💗','✨','🌑','♛'],V=[600,1500,3000,5000,7500,10500,14500,19500,25500,32500,40500,50000];const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1800)}function openProfile(){$('profile').classList.add('show');$('hotspot').style.display='none'}function closeProfile(){$('profile').classList.remove('show');$('hotspot').style.display='block'}function modal(h){$('body').innerHTML=h;$('modal').classList.add('show')}function modalClose(){$('modal').classList.remove('show')}function account(){modal('<h2>⚙️ Hesap ayarları</h2><div class="card"><b>İsim değiştir</b><span class="muted" style="display:block">Ücret: 50 Lidyum</span><input id="newName" class="input" placeholder="Yeni isim"><button class="action" onclick="changeName()">50 Lidyum ile değiştir</button></div><div class="card" style="margin-top:10px"><b>Hareketli avatarlar</b><span class="muted" style="display:block">20 seçenek • 150 Lidyum/adet</span><div class="grid">'+A.map((x,i)=>'<button class="item" onclick="pickAvatar('+i+')"><div class="avatar">'+x+'</div>Avatar '+(i+1)+'<br><small style="color:#ff68b5">150 Lidyum</small></button>').join('')+'</div></div><div class="card" style="margin-top:10px"><b>Hareketli çerçeveler</b><span class="muted" style="display:block">20 seçenek • 150 Lidyum/adet</span><div class="grid">'+F.map((x,i)=>'<button class="item" onclick="pickFrame('+i+')"><div class="frame">'+x+'</div>Çerçeve '+(i+1)+'<br><small style="color:#ff68b5">150 Lidyum</small></button>').join('')+'</div></div>')}function changeName(){let n=$('newName').value.trim();if(!n)return toast('Önce yeni ismi yaz ✍️');$('name').textContent=n;toast('İsim seçildi • 50 Lidyum 💎')}function pickAvatar(i){$('pic').textContent=A[i];toast('Avatar '+(i+1)+' seçildi • 150 Lidyum ✨')}function pickFrame(i){$('pic').style.boxShadow='0 0 0 3px #ff68b5,0 0 28px #ff4da899';toast('Çerçeve '+(i+1)+' seçildi • 150 Lidyum 👑')}function notifications(){modal('<h2>🔔 Bildirimler</h2>'+['Uygulama bildirimleri','Mesaj bildirimleri','Etkinlik bildirimleri'].map(x=>'<button class="row" onclick="toggle(this)">🔔 <b>'+x+'<span class="muted" style="display:block">Bildirimleri aç / kapat</span></b><span class="switch on"></span></button>').join(''))}function toggle(e){let s=e.querySelector('.switch');s.classList.toggle('on');toast(s.classList.contains('on')?'Bildirim açık 🔔':'Bildirim kapalı 🔕')}function appearance(){modal('<h2>🎨 Görünüm</h2><button class="row" onclick="theme(0)">🌑 <b>Dark tema<span class="muted" style="display:block">Koyu görünüm</span></b>›</button><button class="row" onclick="theme(1)">☀️ <b>Aydınlık tema<span class="muted" style="display:block">Açık görünüm</span></b>›</button>')}function theme(light){$('profile').style.background=light?'#f5f2f8':'#07050cf8';document.querySelector('#profile .top').style.background=light?'#f5f2f8':'#07050cf5';toast(light?'Aydınlık tema seçildi ☀️':'Dark tema seçildi 🌑')}function vip(){modal('<h2>👑 VIP Sistemi</h2><p class="muted">Toplam Lidya harcamasına göre VIP seviyesi.</p>'+V.map((n,i)=>'<div class="vip"><strong>VIP '+(i+1)+'</strong><div class="bar"><i style="width:'+Math.min(100,12+i*7)+'%"></i></div><b>'+n.toLocaleString('tr-TR')+' Lidyum harcama</b><span class="muted" style="display:block;margin-top:4px">Bu seviyede özel profil ve görünüm özellikleri açılır.</span></div>').join('<div style="height:8px"></div>'))}$('hotspot').onclick=openProfile;window.addEventListener('message',e=>{if(e.data==='profile')openProfile()});</script></body></html>
