<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07050c"><title>ErisChat — Lidya 45 Hediye</title><style>body{margin:0;background:#07050c;color:#fff;font-family:system-ui;text-align:center}.wrap{max-width:480px;margin:auto;padding:20px}.card{background:#100b18;border:1px solid #ffffff18;border-radius:24px;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.g{background:#ffffff08;border:1px solid #ffffff12;border-radius:15px;padding:12px;color:#fff}.g b{display:block;font-size:10px}.g span{font-size:24px}.g small{color:#ff8fc8}.note{color:#aaa0b1;font-size:12px;line-height:1.5}.fx{position:fixed;inset:0;display:none;place-items:center;background:#05020ae8;z-index:5}.fx.show{display:grid}.core{font-size:92px;animation:pop 1.4s ease both;text-shadow:0 0 20px #fff,0 0 70px #ff4da8,0 0 130px #8b5cff}.name{font-size:20px;font-weight:900;margin-top:20px}@keyframes pop{0%{transform:scale(.05) rotate(-30deg);opacity:0}25%{opacity:1;transform:scale(1.6) rotate(10deg)}50%{transform:scale(.8) rotate(-6deg)}75%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}</style></head><body><div class="wrap"><div class="card"><h1>🏺 ErisChat</h1><h2>Lidya Koleksiyonu</h2><p class="note">45 hediye • 1 → 20.000 Lidyum. Eski hediye listesinin yerine yeni Lidya koleksiyonu aktif.</p><div id="grid" class="grid"></div></div></div><div id="fx" class="fx"><div><div id="fi" class="core"></div><div id="fn" class="name"></div></div></div><script>const gifts=[['Zeytin Dalı','🫒',1],['Kil Toprak Çanak','🏺',2],['Pazaryeri Üzümü','🍇',3],['Parşömen Rulosu','📜',4],['Kilden Mühür','🔶',5],['Tunç Broş','🪙',6],['Baharat Kesesi','🧺',7],['Antik Çömlek','🏺',8],['Karakalem Sardes Çizimi','🖼️',9],['Meşale Kıvılcımı','🔥',10],['Gümüş Broş','📎',12],['Zeytinyağı Şişesi','🫙',13],['Antik Tarak','🪮',14],['Seramik Kase','🥣',15],['Tunç Para (Sikke)','🪙',18],['Antik Arp','🎵',20],['Zeytin Taç','👑',30],['Mavi Boncuk / Nazarlık','🧿',40],['Kraliyet Şarabı','🍷',50],['Lidya Mühür Yüzüğü','💍',60],['Poyraz Rüzgarı','🍃',70],['Gümüş Sikke Kesesi','💰',90],['Altın Zeytin Dalı','🌿',100],['Sardes Sütunu','🏛️',120],['Altın Broş','✨',150],['Güneş Kursu','☀️',180],['Sardes Altın Feneri','🏮',200],['Kral Alyattes’in Kılıcı','⚔️',250],['Paktalos Nehri Altını','🌊',350],['Antik Savaş Arabası','🏇',500],['Kroisos’un Altın Sikkesi','🪙',750],['Kraliyet Asası','🔱',1000],['Anadolu Kaplanı','🐅',1250],['Efes Artemis Tapınağı Sütunu','🏛️',1500],['Kraliyet Tahtı','🪑',2000],['Altın Nehir Yağmuru','💰',3000],['Eris & Lidya Anıtı','🗿',4500],['Kroisos’un Hazinesi','🧰',6000],['Lidya Savaş Gemisi (Trirem)','⛵',8000],['Antik Güneş Tanrısı Heykeli','🗿',10000],['Altın Kanatlı Griffin','🦅',12500],['Sardes Sarayı','🏰',15000],['Efsanevi Lidyum Aslanı','🦁',17500],['Dünyanın İlk Parası Anıtı','🏛️',19000],['Kroisos’un Altın Tahtı','👑',20000]];const grid=document.getElementById('grid');gifts.forEach((g,i)=>{const b=document.createElement('button');b.className='g';b.innerHTML='<span>'+g[1]+'</span><b>'+g[0]+'</b><small>'+g[2].toLocaleString('tr-TR')+' Lidyum</small>';b.onclick=()=>fx(g);grid.appendChild(b)});function fx(g){fi.textContent=g[1];fn.textContent=g[0]+' • '+g[2].toLocaleString('tr-TR')+' Lidyum';document.getElementById('fx').classList.add('show');setTimeout(()=>document.getElementById('fx').classList.remove('show'),1800)}document.getElementById('fx').onclick=()=>document.getElementById('fx').classList.remove('show');</script></body></html>
