<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07060c"><title>ErisChat — v1.9 Gift FX</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020107;overflow:hidden}.app{width:100%;height:100%;border:0;display:block}.fx{position:fixed;inset:0;pointer-events:none;z-index:99999;overflow:hidden}.shade{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff 0,#ff4da855 7%,#9b5cff22 24%,transparent 60%);opacity:0}.stage{position:absolute;left:50%;top:44%;width:min(390px,94vw);height:360px;transform:translate(-50%,-50%);display:grid;place-items:center}.hero{position:absolute;top:72px;line-height:1;opacity:0;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 32px #ff4da8) drop-shadow(0 0 65px #9b5cff)}.hero.small{font-size:68px}.hero.premium{font-size:86px}.hero.big{font-size:112px}.hero.legendary{font-size:138px}.hero.ultra{font-size:164px}.hero.mythic{font-size:190px}.hero.go{animation:hero var(--dur) cubic-bezier(.12,.8,.15,1) forwards}.halo{position:absolute;top:118px;width:90px;height:90px;border-radius:50%;border:2px solid #ff4da8;box-shadow:0 0 35px #ff4da8,0 0 70px #9b5cff;opacity:0;transform:translateY(-50%) scale(.15)}.halo.go{animation:halo var(--dur) ease-out forwards}.label{position:absolute;top:226px;max-width:92%;padding:10px 17px;border:1px solid #ffffff38;border-radius:999px;background:linear-gradient(135deg,#16121fee,#0b0912ee);box-shadow:0 12px 45px #000b;color:#fff;font:800 14px system-ui;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0}.label.go{animation:label 1.7s .18s ease-out forwards}.sub{position:absolute;top:272px;color:#e8dcff;font:700 11px system-ui;opacity:0}.sub.go{animation:sub 1.5s .28s ease-out forwards}.p{position:absolute;left:50%;top:42%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px #ff4da8;opacity:0}.p.go{animation:particle var(--pd) cubic-bezier(.15,.7,.2,1) forwards}.line{position:absolute;left:50%;top:42%;height:2px;width:0;transform-origin:left center;background:linear-gradient(90deg,#fff,#ff4da8,transparent);opacity:.9}.line.go{animation:line .9s ease-out forwards}.pop{position:absolute;bottom:12%;left:50%;padding:9px 14px;border-radius:14px;background:#15111fee;border:1px solid #9b5cff66;color:#fff;font:800 12px system-ui;transform:translate(-50%,20px);opacity:0}.pop.go{animation:pop .7s ease-out forwards}@keyframes hero{0%{opacity:0;transform:translateY(130px) scale(.05) rotate(-35deg)}12%{opacity:1;transform:translateY(0) scale(1.5) rotate(12deg)}27%{transform:translateY(-30px) scale(.9) rotate(-7deg)}43%{transform:translateY(4px) scale(1.12) rotate(4deg)}65%{transform:translateY(-8px) scale(1) rotate(0)}100%{opacity:0;transform:translateY(-105px) scale(.72)}}@keyframes halo{0%{opacity:0;transform:translateY(-50%) scale(.1)}18%{opacity:.95;transform:translateY(-50%) scale(1)}65%{opacity:.35}100%{opacity:0;transform:translateY(-50%) scale(7)}}@keyframes label{0%{opacity:0;transform:translateY(18px) scale(.82)}25%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px) scale(.96)}}@keyframes sub{0%{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}@keyframes particle{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.04)}}@keyframes line{0%{width:0;opacity:0}20%{opacity:1}100%{width:var(--w);opacity:0;transform:rotate(var(--a))}}@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.9)}25%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-15px)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}</style></head><body><iframe class="app" id="app" src="erischat-v17.html?v=20260916-19" title="ErisChat"></iframe><div class="fx" id="fx"></div><script>(()=>{const f=document.getElementById('app'),x=document.getElementById('fx');let ready=false;const n=v=>Number(String(v??'').replace(/\./g,'').replace(/,/g,''))||0;const tier=v=>v>=20000?'mythic':v>=10000?'ultra':v>=5000?'legendary':v>=1000?'big':v>=100?'premium':'small';const cfg={small:[18,1100],premium:[28,1350],big:[44,1650],legendary:[64,1950],ultra:[88,2250],mythic:[120,2700]};function fire(icon,name,to,price){const t=tier(n(price)),[count,dur]=cfg[t];x.innerHTML=`<div class="shade" style="animation:flash .9s ease-out"></div><div class="stage"><div class="halo ${t} go" style="--dur:${dur}ms"></div><div class="hero ${t} go" style="--dur:${dur}ms">${icon||'✨'}</div><div class="label go">${name||'Hediye'} · ${price||''} Lidyum</div><div class="sub go">${to?to+' kişisine gönderildi':'Hediye gönderildi'}</div></div>`;for(let i=0;i<count;i++){const p=document.createElement('i');p.className='p go';const s=t==='mythic'?250:t==='ultra'?220:t==='legendary'?190:t==='big'?165:145;p.style.setProperty('--x',(Math.random()*s*2-s)+'px');p.style.setProperty('--y',(Math.random()*s*1.7-s*.9)+'px');p.style.setProperty('--pd',(850+Math.random()*900)+'ms');p.style.animationDelay=Math.random()*180+'ms';x.appendChild(p)}for(let i=0;i<Math.min(count,18);i++){const l=document.createElement('i');l.className='line go';l.style.setProperty('--w',(70+Math.random()*190)+'px');l.style.setProperty('--a',(Math.random()*360)+'deg');l.style.top=(38+Math.random()*10)+'%';x.appendChild(l)}setTimeout(()=>x.innerHTML='',dur+250)}function bind(){if(ready)return;const d=f.contentDocument;if(!d)return;ready=true;d.addEventListener('click',e=>{const b=e.target.closest('[data-gift-send]');if(!b)return;const c=b.closest('.gift');const raw=(c?.textContent||'').replace(/\s+/g,' ').trim();const icon=c?.querySelector('b')?.textContent?.trim()||'✨';const price=(raw.match(/([\d.,]+) Lidyum/)||[])[1]||'';const name=raw.replace(icon,'').replace(/\s*([\d.,]+) Lidyum\s*$/,'').trim();const to=b.dataset.recipient||'';setTimeout(()=>fire(icon,name,to,price),50)})}f.addEventListener('load',()=>setTimeout(bind,50));setTimeout(bind,1000)})();</script></body></html>
