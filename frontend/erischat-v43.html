 class="grid">'+framesData.map((f,i)=>'<div class="asset selected"><div class="frame '+f[1]+'"><span>'+f[2]+'</span></div><div class="asset-name">'+f[0]+'</div><div class="price">Premium çerçeve</div><button class="buy" onclick="toast(\'Çerçeve önizlemesi: '+f[0]+'\')">Önizle</button></div>').join('')+'</div>')}function bindProfileButton(){try{const d=$('app').contentDocument;if(!d)return;const b=d.querySelector('button[data-view="profile"]');if(!b)return;if(b.dataset.ecProfileBound==='1')return;b.dataset.ecProfileBound='1';b.addEventListener('click',function(e){e.preventDefault();e.stopImmediatePropagation();openProfile()},true)}catch(e){}}function bind(){bindProfileButton();try{$('app').contentWindow.document.addEventListener('click',function(){setTimeout(bindProfileButton,0)},true)}catch(e){}}$('app').addEventListener('load',()=>{setTimeout(bind,50);setTimeout(bind,500);setTimeout(bind,1500)});setInterval(bindProfileButton,1000);render();</script></body></html>
