<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07050c"><title>ErisChat — v24 Experience</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transform:scale(.985);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1)}.app.ready{opacity:1;transform:none}.veil{position:fixed;inset:0;z-index:100000;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#ff4da833 0,#985cff12 18%,#05040a 58%);opacity:1;transition:opacity .65s ease;pointer-events:none}.veil.hide{opacity:0}.ripple{position:fixed;width:22px;height:22px;border-radius:50%;border:2px solid #ff4da8;box-shadow:0 0 22px #ff4da8,0 0 50px #985cff;transform:translate(-50%,-50%) scale(.15);opacity:0;pointer-events:none;z-index:100002}.ripple.go{animation:rip .7s cubic-bezier(.1,.7,.2,1) forwards}.flash{position:fixed;inset:0;z-index:100001;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .24s ease-out}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:100003;transform:translate(-50%,18px) scale(.96);padding:9px 13px;border:1px solid #ffffff22;border-radius:999px;background:#0b0812dd;color:#eee5f7;font-size:11px;font-weight:800;opacity:0;transition:.28s ease;backdrop-filter:blur(14px);white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.bar{position:fixed;left:50%;top:10px;z-index:100003;transform:translateX(-50%) translateY(-8px);padding:5px 9px;border:1px solid #ffffff18;border-radius:999px;background:#0b0812cc;color:#bdb1ca;font-size:9px;font-weight:800;opacity:0;transition:.3s;backdrop-filter:blur(12px)}.bar.show{opacity:1;transform:translateX(-50%)}@keyframes rip{0%{opacity:.95;transform:translate(-50%,-50%) scale(.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(12)}}@keyframes flash{0%{opacity:0}18%{opacity:.18}100%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}</style></head><body><iframe id="app" class="app" src="erischat-v22.html?v=20260916-26" title="ErisChat"></iframe><div id="veil" class="veil"></div><div id="flash" class="flash"></div><div id="bar" class="bar">ERISCHAT • EXPERIENCE</div><div id="toast" class="toast">✨ Etkileşim hazır</div><script>(()=>{const app=document.getElementById('app'),veil=document.getElementById('veil'),flash=document.getElementById('flash'),toast=document.getElementById('toast'),bar=document.getElementById('bar');let timer;function ready(){app.classList.add('ready');setTimeout(()=>veil.classList.add('hide'),160);toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800);bar.classList.add('show');setTimeout(()=>bar.classList.remove('show'),2600)}function tap(x,y,p=1){const r=document.createElement('i');r.className='ripple go';r.style.left=x+'px';r.style.top=y+'px';r.style.transformOrigin='center';document.body.appendChild(r);flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');setTimeout(()=>r.remove(),800);if(navigator.vibrate&&p>1)try{navigator.vibrate(10)}catch(e){}}function point(e){return e.touches?.[0]||e.changedTouches?.[0]||e}window.addEventListener('pointerdown',e=>{if(e.target.closest('.bar,.toast'))return;tap(e.clientX,e.clientY,1)});window.addEventListener('touchstart',e=>{const p=point(e);if(p)tap(p.clientX,p.clientY,1)},{passive:true});window.addEventListener('message',e=>{if(e.data==='eris:action')tap(innerWidth/2,innerHeight/2,2);if(e.data?.type==='eris:gift'){const p=Math.min(2.5,Math.max(1,Number(e.data.power)||1));tap(Number(e.data.x)||innerWidth/2,Number(e.data.y)||innerHeight/2,p)}});app.addEventListener('load',ready,{once:true});setTimeout(()=>{if(!app.classList.contains('ready'))ready()},5000)})();</script></body></html>
