<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08070d"><title>ErisChat — v23 Interactive Motion</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transform:scale(.985);transition:opacity .45s ease,transform .45s ease}.app.ready{opacity:1;transform:none}.ambient{position:fixed;inset:-20%;z-index:9998;pointer-events:none;overflow:hidden;opacity:.52;mix-blend-mode:screen}.orb{position:absolute;width:42vw;height:42vw;max-width:260px;max-height:260px;border-radius:50%;filter:blur(48px);background:#8d39ff55;animation:float 9s ease-in-out infinite}.orb.two{right:-4%;top:28%;background:#ff4da844;animation-delay:-3s}.orb.three{left:18%;bottom:-12%;background:#3e7dff33;animation-delay:-6s}.fx{position:fixed;inset:0;z-index:100000;pointer-events:none;overflow:hidden}.tap{position:absolute;width:18px;height:18px;border:2px solid #ff4da8;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;box-shadow:0 0 18px #ff4da8}.tap.go{animation:tap .65s ease-out}.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ff4da8;opacity:0}.dot.go{animation:dot .7s ease-out forwards}.curtain{position:fixed;inset:0;z-index:100001;background:radial-gradient(circle at var(--cx) var(--cy),#ff4da820,transparent 22%),#08060fee;opacity:0;pointer-events:none;transform:scale(1.12);transition:opacity .22s ease,transform .42s cubic-bezier(.2,.8,.2,1)}.curtain.go{opacity:.34;transform:scale(1)}.hint{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,14px);padding:7px 11px;border:1px solid #ffffff1c;border-radius:999px;background:#0d0a16dd;color:#e9dff3;font-size:10px;font-weight:800;opacity:0;transition:.3s;z-index:100002;white-space:nowrap}.hint.show{opacity:1;transform:translate(-50%,0)}.net{position:fixed;right:10px;top:10px;z-index:100002;padding:5px 8px;border:1px solid #ffffff18;border-radius:999px;background:#09070ddd;color:#7ff0bd;font-size:9px;font-weight:800;backdrop-filter:blur(10px)}.net.off{color:#ff9cbf}.net i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:4px;box-shadow:0 0 8px currentColor}.net.on i{animation:blink 1.8s infinite}@keyframes tap{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}70%{opacity:.35}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes dot{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.1)}}@keyframes float{0%,100%{transform:translate3d(-4%,-2%,0) scale(.95)}50%{transform:translate3d(9%,7%,0) scale(1.08)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}</style></head><body><iframe id="app" class="app" src="erischat-v22.html?v=20260916-26" title="ErisChat"></iframe><div class="ambient"><i class="orb"></i><i class="orb two"></i><i class="orb three"></i></div><div id="fx" class="fx"></div><div id="curtain" class="curtain"></div><div id="net" class="net on"><i></i><span>Çevrimiçi</span></div><div id="hint" class="hint">✨ Etkileşim modu hazır</div><script>(()=>{const app=document.getElementById('app'),fx=document.getElementById('fx'),curtain=document.getElementById('curtain'),hint=document.getElementById('hint'),net=document.getElementById('net'),label=net.querySelector('span');function ready(){app.classList.add('ready');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),2200)}function tap(x,y,p=1){const r=42+Math.random()*28;const q=document.createElement('i');q.className='tap go';q.style.left=x+'px';q.style.top=y+'px';q.style.transformOrigin='center';q.style.transform='translate(-50%,-50%) scale(.2)';q.style.setProperty('--p',p);fx.appendChild(q);for(let i=0;i<Math.round(8*p);i++){const d=document.createElement('i');d.className='dot go';const a=Math.PI*2*i/(8*p),rr=r*(.7+Math.random()*.6);d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--x',Math.cos(a)*rr+'px');d.style.setProperty('--y',Math.sin(a)*rr+'px');d.style.animationDelay=(Math.random()*.08)+'s';fx.appendChild(d);setTimeout(()=>d.remove(),900)}setTimeout(()=>q.remove(),800);curtain.style.setProperty('--cx',x+'px');curtain.style.setProperty('--cy',y+'px');curtain.classList.remove('go');void curtain.offsetWidth;curtain.classList.add('go');setTimeout(()=>curtain.classList.remove('go'),260)}function network(){const on=navigator.onLine;net.classList.toggle('on',on);net.classList.toggle('off',!on);label.textContent=on?'Çevrimiçi':'Çevrimdışı'}app.addEventListener('load',()=>{ready();setTimeout(()=>tap(innerWidth/2,innerHeight/2,1.2),220)});document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;tap(e.clientX,e.clientY,e.pointerType==='touch'?1.15:1)});window.addEventListener('online',network);window.addEventListener('offline',network);window.addEventListener('message',e=>{if(e.data==='eris:action')tap(innerWidth/2,innerHeight/2,1.5);if(e.data?.type==='eris:gift')tap(e.data.x??innerWidth/2,e.data.y??innerHeight/2,Math.min(2,Math.max(1,Number(e.data.power)||1)))});network();setTimeout(()=>{if(!app.classList.contains('ready'))ready()},4500)})();</script></body></html>
