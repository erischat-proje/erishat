:14px}.money{color:#e7bd6e;font-weight:900}.owned{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:10px;padding:7px 9px;border-radius:10px;background:#ffffff08;border:1px solid #ffffff10;color:#d8ccdF}.modal{display:none;position:fixed;inset:0;z-index:1100;background:#020107ee;align-items:flex-end}.modal.show{display:flex}.box{width:min(500px,100%);max-height:94vh;overflow:auto;background:#0b0811;border-radius:28px 28px 0 0;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.asset{border:1px solid #ffffff12;background:#ffffff06;border-radius:18px;padding:10px;min-height:205px}.asset.active{outline:2px solid #d0a24e;box-shadow:0 0 25px #d0a24e22}.preview{height:125px;border-radius:15px;overflow:hidden;background:#08060c;margin-bottom:8px}.preview svg{width:100%;height:100%;display:block}.assetName{font-size:11px;font-weight:900}.price{font-size:10px;color:#e5bd6f;font-weight:900;margin-top:3px}.asset button,.searchBtn{width:100%;border:0;border-radius:10px;background:#ffffff0c;color:#fff;padding:9px;margin-top:8px;font-size:10px}.buy{background:linear-gradient(135deg,#5b3b1e,#9b7134)!important}.frameCard{height:125px;border-radius:17px;background:#08060c;display:grid;place-items:center;position:relative;overflow:hidden}.frameCard .frameShape{position:absolute;inset:7px;border:5px solid #8d6b3c;border-radius:22px}.frameCard .frameIcon{position:relative;font-size:30px;color:#d8bd7a}.catalogBox{background:#ffffff06;border:1px solid #ffffff10;border-radius:17px;padding:14px}.catalogInput{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff12;background:#08060c;color:#fff;outline:none}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;background:#17111e;border:1px solid #ffffff18;padding:10px 14px;border-radius:13px;font-size:11px;z-index:1200;transition:.2s;white-space:nowrap}@media(min-width:700px){.content{padding-top:30px}.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><iframe id="app" src="./erischat-v35.html?base=20260916-v48" title="ErisChat"></iframe><section id="profile" class="profile"><header class="top"><button onclick="closeProfile()">← Geri</button><b>VIP PROFİL</b><button onclick="closeProfile()">×</button></header><main class="content"><div class="hero"><div class="head"><div class="portraitWrap"><div id="portrait" class="portrait"></div><div id="frameArt" class="frameArt royal"></div></div><div><h2 id="name" style="margin:0 0 3px">Arda</h2><span class="muted">ErisChat kullanıcısı</span><div style="color:#e8c477;font-size:11px;font-weight:900;margin-top:5px">VIP • Seviye 5</div></div></div><div class="balance"><span>Lidyum</span><span id="balance" class="money"></span></div><div id="owned" class="owned"></div></div><div class="section">PROFİL KOZMETİKLERİ</div><button class="row" onclick="avatars()"><b>Karakter Avatarları<span class="muted">24 özel portre • satın al ve anında profile uygula</span></b><span>›</span></button><button class="row" onclick="frames()"><b>VIP Çerçeveler<span class="muted">Kraliyet • Obsidyen • Melek • Ejderha • Legendary</span></b><span>›</span></button><button class="row" onclick="catalog()"><b>10.000.000 Kozmetik Kataloğu<span class="muted">ID tabanlı milyonlarca alınabilir ürün</span></b><span>›</span></button></main></section><section id="modal" class="modal"><div class="box"><button class="close" onclick="modalClose()">×</button><div id="body"></div></div></section><div id="toast" class="toast"></div><script>const avatarsData=['Obsidyen Kral','Royal Queen','Fallen Angel','Dragon Lord','Black Rose','Lunar Prince','Golden Emperor','Shadow Queen','Crimson Knight','Eris Legend','Silver Wolf','Royal Raven','Emerald Lord','Ice Duchess','Vampire King','Noir Princess','Solar Emperor','Moon Queen','Titan Guard','Legendary Eris','Dark Prince','Royal Duchess','Ancient King','Eris Sovereign'];const palettes=[['#1b151f','#5b5360','#d6c0a1'],['#2a191b','#8d653d','#efcc76'],['#11161e','#707987','#e4e9ef'],['#1d100d','#754332','#dca76b'],['#251017','#8a4054','#dda0ad'],['#121529','#62698c','#cdd7ff'],['#271c0c','#9d7630','#f3d58b'],['#19131d','#655074','#d3b8df'],['#220e13','#813742','#e6a274'],['#1c1025','#805096','#f3c9ff'],['#15181c','#626b73','#dce5eb'],['#18141e','#5a5262','#d1c2db'],['#101b15','#42765d','#acd6ad'],['#111b20','#5a7e90','#c9efff'],['#1e0e16','#74304a','#e7a1b8'],['#19141a','#534255','#d8b9dc'],['#251b0b','#a47730','#ffe0a0'],['#121423','#5a6087','#daddff'],['#171719','#68676d','#dedede'],['#1d1225','#8e5bab','#f5d28c'],['#16131b','#66546d','#e0c8e8'],['#21171a','#79515c','#f0c5c8'],['#17130e','#75613c','#e6c27b'],['#201326','#855a9e','#f7d68c']];const framesData=[['VIP Royal','royal','♛',250000],['Dark Emperor','obsidian','◆',350000],['Fallen Angel','angel','♜',400000],['Dragon Lord','dragon','🐉',600000],['Black Rose','rose','🥀',300000],['Lunar Eclipse','lunar','☾',450000],['Legendary Crown','legendary','♛',1000000],['Silver Wolf','wolf','🐺',500000],['Ancient Emperor','emperor','⚜',750000],['Gothic Sovereign','gothic','†',650000],['Diamond Legacy','diamond','◆',1200000]];let balance=10000000;let ownedAv=JSON.parse(localStorage.getItem('eris48_av')||'[0]');let selectedAv=+(localStorage.getItem('eris48_selav')||0);let ownedFr=JSON.parse(localStorage.getItem('eris48_fr')||'[0]');let selectedFr=+(localStorage.getItem('eris48_selfr')||0);function $(x){return document.getElementById(x)}function portrait(i){let p=palettes[i%palettes.length];return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+p[0]+'"/><stop offset="1" stop-color="#07050c"/></linearGradient><linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[2]+'"/></linearGradient></defs><rect width="120" height="120" rx="25" fill="url(#bg)"/><path d="M19 116Q24 72 60 69Q96 72 101 116Z" fill="url(#coat)"/><ellipse cx="60" cy="49" rx="28" ry="32" fill="#c99179"/><path d="M31 48Q27 15 60 13Q93 15 89 48Q81 28 60 31Q39 28 31 48Z" fill="#151119"/><path d="M39 50h10M71 50h10" stroke="#291a20" stroke-width="4" stroke-linecap="round"/><circle cx="44" cy="50" r="2"/><circle cx="76" cy="50" r="2"/><path d="M51 65Q60 71 69 65" fill="none" stroke="#703e49" stroke-width="3" stroke-linecap="round"/><path d="M31 79Q60 92 89 79" fill="none" stroke="'+p[2]+'" stroke-width="3" opacity=".6"/><text x="60" y="105" text-anchor="middle" font-size="17" fill="'+p[2]+'">'+(['♛','♕','♜','🐉','🥀','☾','♔','♕','♞','✦','🐺','♜','◆','❄','♛','♕','☀','☾','⚜','✦','♜','♕','⚜','✦'][i])+'</text></svg>'}function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;$('toast').style.transform='translate(-50%,0)';setTimeout(()=>{$('toast').style.opacity=0;$('toast').style.transform='translate(-50%,20px)'},1700)}function frameClass(){return ['royal','obsidian','angel','dragon','rose','lunar','legendary','wolf','emperor','gothic','diamond'][selectedFr%11]}function render(){ $('portrait').innerHTML=portrait(selectedAv);$('frameArt').className='frameArt '+frameClass();$('balance').textContent=balance.toLocaleString('tr-TR')+' Lidyum';$('name').textContent=localStorage.getItem('eris48_name')||'Arda';$('owned').innerHTML='<span class="tag">'+ownedAv.length+' avatar</span><span class="tag">'+ownedFr.length+' çerçeve</span><span class="tag">VIP Seviye 5</span>'}function openProfile(){$('profile').classList.add('show');render()}function closeProfile(){$('profile').classList.remove('show')}function modalClose(){$('modal').classList.remove('show')}function show(h){$('body').innerHTML=h;$('modal').classList.add('show')}function buyAv(i){if(!ownedAv.includes(i)){if(balance<150000){toast('Yeterli Lidyum yok');return}balance-=150000;ownedAv.push(i);localStorage.setItem('eris48_av',JSON.stringify(ownedAv))}selectedAv=i;localStorage.setItem('eris48_selav',i);render();toast('Avatar profile uygulandı');avatars()}function buyFr(i){if(!ownedFr.includes(i)){if(balance<framesData[i][3]){toast('Yeterli Lidyum yok');return}balance-=framesData[i][3];ownedFr.push(i);localStorage.setItem('eris48_fr',JSON.stringify(ownedFr))}selectedFr=i;localStorage.setItem('eris48_selfr',i);render();toast('VIP çerçeve profile uygulandı');frames()}function avatars(){show('<h2>Karakter Avatarları</h2><p class="muted">Her avatar satın alındığında koleksiyonuna eklenir ve seçildiği anda profilde görünür.</p><div class="grid">'+avatarsData.map((n,i)=>'<div class="asset '+(selectedAv===i?'active':'')+'"><div class="preview">'+portrait(i)+'</div><div class="assetName">'+n+'</div><div class="price">150.000 Lidyum</div><button class="buy" onclick="buyAv('+i+')">'+(selectedAv===i?'Kullanılıyor':'Satın Al / Kullan')+'</button></div>').join('')+'</div>')}function frames(){show('<h2>VIP Çerçeveler</h2><p class="muted">Neon border değil: metal, taş, taç, kanat, ejderha ve koleksiyon objeleriyle tasarlanmış premium çerçeveler.</p><div class="grid">'+framesData.map((f,i)=>'<div class="asset '+(selectedFr===i?'active':'')+'"><div class="frameCard"><div class="frameShape '+f[1]+'"></div><span class="frameIcon">'+f[2]+'</span></div><div class="assetName">'+f[0]+'</div><div class="price">'+f[3].toLocaleString('tr-TR')+' Lidyum</div><button class="buy" onclick="buyFr('+i+')">'+(selectedFr===i?'Kullanılıyor':'Satın Al / Kullan')+'</button></div>').join('')+'</div>')}function catalog(){show('<h2>10.000.000 Kozmetik Kataloğu</h2><p class="muted">Sistem milyonlarca ürünü tek tek HTML'ye yüklemez; ID tabanlı katalog üretir. Ürün kimliği arayabilir ve satın alabilirsin.</p><div class="catalogBox"><input id="cid" class="catalogInput" placeholder="Örn: FR-VIP-0048217"><button class="searchBtn" onclick="findItem()">Ürünü bul</button><div id="result" class="ownedBox">Katalog: AV / FR / FX / BADGE / BG • toplam 10.000.000 kimlik alanı</div></div>')}function findItem(){let id=($('cid').value||'').trim().toUpperCase();if(!id){toast('Bir ürün ID gir');return}let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;let price=50000+(h%1950000);$('result').innerHTML='<b>'+id+'</b><div class="muted">Özel katalog ürünü • Satın alınabilir</div><div class="price">'+price.toLocaleString('tr-TR')+' Lidyum</div><button class="searchBtn" onclick="buyCatalog(\''+id+'\','+price+')">Satın Al</button>'}function buyCatalog(id,price){let key='eris48_cat_'+id;if(localStorage.getItem(key)){toast('Bu ürün zaten sende');return}if(balance<price){toast('Yeterli Lidyum yok');return}balance-=price;localStorage.setItem(key,'1');toast(id+' koleksiyona eklendi');render()}function bind(){try{const d=$('app').contentDocument;if(!d)return;const b=d.querySelector('button[data-view="profile"]');if(!b)return;if(b.dataset.eris48==='1')return;b.dataset.eris48='1';b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openProfile()},true)}catch(e){}}$('app').addEventListener('load',()=>{setTimeout(bind,100);setTimeout(bind,700);setTimeout(bind,1800)});setInterval(bind,800);render();</script></body></html>
