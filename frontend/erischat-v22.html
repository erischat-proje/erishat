<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08070d"><title>ErisChat — v22.3 Motion</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05040a}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transform:scale(.985);transition:opacity .45s ease,transform .45s ease}.app.ready{opacity:1;transform:none}.ambient{position:fixed;inset:-20%;z-index:9998;pointer-events:none;overflow:hidden;opacity:.5;mix-blend-mode:screen}.orb{position:absolute;width:42vw;height:42vw;max-width:260px;max-height:260px;border-radius:50%;filter:blur(48px);background:#8d39ff55;animation:float 9s ease-in-out infinite}.orb.two{right:-4%;top:28%;background:#ff4da844;animation-delay:-3s}.orb.three{left:18%;bottom:-12%;background:#3e7dff33;animation-delay:-6s}.fx{position:fixed;inset:0;z-index:99999;pointer-events:none;overflow:hidden}.pulse{position:absolute;left:50%;top:50%;width:30px;height:30px;border:2px solid #ff4da8;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}.pulse.go{animation:pulse .8s ease-out}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px #ff4da8;opacity:0}.spark.go{animation:spark .8s cubic-bezier(.1,.7,.2,1) forwards}.streak{position:absolute;left:50%;top:50%;width:2px;height:70px;border-radius:99px;background:linear-gradient(#fff,transparent);opacity:0;transform-origin:50% 0}.streak.go{animation:streak .75s ease-out forwards}.hint{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,14px);padding:7px 11px;border:1px solid #ffffff1c;border-radius:999px;background:#0d0a16dd;color:#e9dff3;font-size:10px;font-weight:800;opacity:0;transition:.3s;z-index:100000;white-space:nowrap}.hint.show{opacity:1;transform:translate(-50%,0)}.net{position:fixed;right:10px;top:10px;z-index:100000;padding:5px 8px;border:1px solid #ffffff18;border-radius:999px;background:#09070ddd;color:#7ff0bd;font-size:9px;font-weight:800;backdrop-filter:blur(10px)}.net.off{color:#ff9cbf}.net i{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:4px;box-shadow:0 0 8px currentColor}.net.on i{animation:blink 1.8s infinite}@keyframes pulse{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.1)}}@keyframes streak{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) scaleY(.2)}20%{opacity:.8}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-150px) scaleY(1)}}@keyframes float{0%,100%{transform:translate3d(-4%,-2%,0) scale(.95)}50%{transform:translate3d(9%,7%,0) scale(1.08)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}</style></head><body><iframe id="app" class="app" src="erischat-v21.html?v=20260916-25" title="ErisChat"></iframe><div class="ambient"><i class="orb"></i><i class="orb two"></i><i class="orb three"></i></div><div id="fx" class="fx"></div><div id="net" class="net on"><i></i><span>Çevrimiçi</span></div><div id="hint" class="hint">✨ ErisChat hazır</div><script>(()=>{const app=document.getElementById('app'),fx=document.getElementById('fx'),hint=document.getElementById('hint'),net=document.getElementById('net'),label=net.querySelector('span');function ready(){app.classList.add('ready');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),2200)}function burst(power=1){const p=document.createElement('div');p.className='pulse go';fx.appendChild(p);const count=Math.round(18*power);for(let i=0;i<count;i++){const a=Math.PI*2*i/count,r=(70+Math.random()*90)*power,s=document.createElement('i');s.className='spark go';s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r+'px');s.style.animationDelay=(Math.random()*.12)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),1100)}for(let i=0;i<Math.round(5*power);i++){const s=document.createElement('i');s.className='streak go';s.style.left='50%';s.style.top='50%';s.style.setProperty('--a',(Math.random()*360)+'deg');s.style.animationDelay=(Math.random()*.1)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),1000)}setTimeout(()=>p.remove(),900)}function network(){const on=navigator.onLine;net.classList.toggle('on',on);net.classList.toggle('off',!on);label.textContent=on?'Çevrimiçi':'Çevrimdışı'}app.addEventListener('load',()=>{ready();setTimeout(()=>burst(1.15),220)});window.addEventListener('online',network);window.addEventListener('offline',network);window.addEventListener('message',e=>{if(e.data==='eris:action')burst(1.4);if(e.data?.type==='eris:gift')burst(Math.min(2,Math.max(1,Number(e.data.power)||1)))});network();let phase=0;setInterval(()=>{if(document.visibilityState==='visible'){phase++;burst(phase%4===0?1.35:.8)}},20000);setTimeout(()=>{if(!app.classList.contains('ready'))ready()},4500)})();</script></body></html>
