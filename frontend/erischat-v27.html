ms:center;position:relative}.g i{font-style:normal;font-size:23px;transition:.2s}.g small{position:absolute;bottom:4px;font-size:7px;color:#9c90a3}.g:active{transform:scale(.95)}.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ffffff0d}.input{flex:1;border:1px solid #ffffff10;border-radius:14px;background:#ffffff06;color:#fff;padding:10px;font-size:10px;outline:0}.send{width:42px;border-radius:14px;background:linear-gradient(135deg,#ff4da8,#824dff);font-size:16px}.giftFlash{position:fixed;inset:0;z-index:130;display:none;place-items:center;pointer-events:none;background:radial-gradient(circle,#3d1557aa,transparent 45%)}.giftFlash.show{display:grid;animation:fade .9s ease-out forwards}.flashCore{font-size:95px;filter:drop-shadow(0 0 30px #ff4da8);animation:pop .9s cubic-bezier(.16,1,.3,1)}@keyframes pop{0%{opacity:0;transform:scale(.1) rotate(-20deg)}35%{opacity:1;transform:scale(1.25) rotate(5deg)}65%{transform:scale(.95)}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}@keyframes fade{0%{opacity:1}100%{opacity:0}}@media(min-width:700px){.sheet{margin:0 auto 4vh;border:1px solid #ffffff12;border-radius:28px}}</style></head><body><iframe id="app" src="./erischat-v26.html?v=20260916-v26"></iframe><div id="layer" class="chatLayer"><div class="sheet"><div class="sheetHead"><div class="sheetAvatar" id="sa">R</div><div><b id="sn">Rana</b><small>● çevrimiçi</small></div><button class="x" id="close">×</button></div><div class="chatBody" id="body"><div class="bubble">Bugün nasılsın? ✨</div><div class="bubble me">İyiyim, biraz ErisChat'e bakıyorum 😄</div></div><div class="giftTray"><div class="giftTitle"><b>🎁 Hediye gönder</b><span>dokun ve animasyonu izle</span></div><div class="giftRow"><button class="g" data-g="💗" data-n="Kalp"><i>💗</i><small>25</small></button><button class="g" data-g="🌹" data-n="Gül"><i>🌹</i><small>250</small></button><button class="g" data-g="🦁" data-n="Aslan"><i>🦁</i><small>2.5K</small></button><button class="g" data-g="👑" data-n="Kraliyet"><i>👑</i><small>7.5K</small></button><button class="g" data-g="💎" data-n="Elmas"><i>💎</i><small>15K</small></button><button class="g" data-g="🌌" data-n="Galaksi"><i>🌌</i><small>25K</small></button></div></div><div class="composer"><input class="input" id="msg" placeholder="Mesaj yaz…"><button class="send" id="send">➤</button></div></div></div><div class="giftFlash" id="flash"><div class="flashCore" id="fc">💎</div></div><script>const frame=document.getElementById('app'),layer=document.getElementById('layer'),names=['Rana','DJ Luna','Nora','Elif'],avatars=['R','L','N','E'];let active=0;function openChat(i){active=i;document.getElementById('sn').textContent=names[i];document.getElementById('sa').textContent=avatars[i];layer.classList.add('show');document.getElementById('msg').focus()}function closeChat(){layer.classList.remove('show')}document.getElementById('close').onclick=closeChat;layer.addEventListener('click',e=>{if(e.target===layer)closeChat()});document.querySelectorAll('.g').forEach(b=>b.onclick=()=>sendGift(b.dataset.g,b.dataset.n));function sendGift(icon,name){document.getElementById('fc').textContent=icon;const f=document.getElementById('flash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show');const body=document.getElementById('body');const m=document.createElement('div');m.className='bubble me';m.textContent='🎁 '+name+' gönderildi '+icon;body.appendChild(m);body.scrollTop=body.scrollHeight;if(navigator.vibrate)navigator.vibrate([25,20,45])}document.getElementById('send').onclick=()=>{const input=document.getElementById('msg');if(!input.value.trim())return;const m=document.createElement('div');m.className='bubble me';m.textContent=input.value.trim();document.getElementById('body').appendChild(m);input.value='';document.getElementById('body').scrollTop=9999};document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('send').click()});function wire(){try{const d=frame.contentDocument;if(!d)return;d.querySelectorAll('.chat').forEach((el,i)=>{el.onclick=e=>{e.preventDefault();e.stopPropagation();openChat(i)}})}catch(e){}}frame.addEventListener('load',()=>{wire();setTimeout(wire,300);setTimeout(wire,1000)});setInterval(wire,1500);</script></body></html>
