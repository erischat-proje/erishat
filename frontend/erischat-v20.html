<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ErisChat — Gift FX v2.1</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020107;overflow:hidden}.app{width:100%;height:100%;border:0}.fx{position:fixed;inset:0;pointer-events:none;z-index:99999;overflow:hidden}.stage{position:absolute;left:50%;top:43%;width:100vw;height:430px;transform:translate(-50%,-50%);display:grid;place-items:center}.hero{position:absolute;top:55px;line-height:1;opacity:0;z-index:8;transform-origin:center}.hero.small{font-size:64px}.hero.premium{font-size:86px}.hero.big{font-size:112px}.hero.legendary{font-size:140px}.hero.ultra{font-size:166px}.hero.mythic{font-size:190px}.hero.small{filter:drop-shadow(0 0 12px #ff4da8)}.hero.premium{filter:drop-shadow(0 0 22px #6fdcff)}.hero.big{filter:drop-shadow(0 0 30px #ffd35c)}.hero.legendary{filter:drop-shadow(0 0 38px #ff7b35)}.hero.ultra{filter:drop-shadow(0 0 45px #6de7ff) drop-shadow(0 0 80px #985cff)}.hero.mythic{filter:drop-shadow(0 0 55px #fff) drop-shadow(0 0 100px #ff4da8) drop-shadow(0 0 130px #985cff)}.hero.go{animation:heroSmall var(--dur) forwards}.hero.premium.go{animation:heroPremium var(--dur) forwards}.hero.big.go{animation:heroBig var(--dur) forwards}.hero.legendary.go{animation:heroLegendary var(--dur) forwards}.hero.ultra.go{animation:heroUltra var(--dur) forwards}.hero.mythic.go{animation:heroMythic var(--dur) forwards}.special{position:absolute;top:18px;font:1000 24px system-ui;color:#fff;text-shadow:0 0 10px #ff4da8,0 0 30px #ff7b35;opacity:0;z-index:9}.special.go{animation:specialIn 1.7s ease-out forwards}.lion.special{font-size:76px;top:12px}.lion.go{animation:lionEntrance 2.2s cubic-bezier(.15,.85,.2,1) forwards}.roar{position:absolute;top:155px;color:#ffd76a;font:1000 18px system-ui;letter-spacing:3px;text-shadow:0 0 8px #ff7b35,0 0 25px #ff4da8;opacity:0;z-index:10}.roar.go{animation:roarIn 1.7s .55s ea out forwards}.label{position:absolute;top:255px;padding:10px 18px;border:1px solid #ffffff38;border-radius:999px;background:#100e18ee;color:#fff;font:900 14px system-ui;opacity:0;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}.label.go{animation:label 2s .15s ease-out forwards}.sub{position:absolute;top:298px;color:#e8dcff;font:700 11px system-ui;opacity:0}.sub.go{animation:sub 1.7s .25s ease-out forwards}.tier{position:absolute;bottom:7%;padding:8px 12px;border-radius:12px;background:#15111fee;color:#fff;font:800 11px system-ui;opacity:0}.tier.go{animation:caption 1s ease-out forwards}.mythicLabel{position:absolute;top:12px;color:#fff;font:1000 18px system-ui;letter-spacing:2px;text-shadow:0 0 12px #ff4da8,0 0 30px #985cff;opacity:0}.mythicLabel.go{animation:mythicTitle 2.6s ease-out forwards}@keyframes heroSmall{0%{opacity:0;transform:translateY(55px) scale(.15) rotate(-10deg)}20%{opacity:1;transform:translateY(0) scale(1.12) rotate(4deg)}55%{transform:scale(1)}100%{opacity:0;transform:translateY(-45px) scale(.65)}}@keyframes heroPremium{0%{opacity:0;transform:translateY(80px) scale(.05) rotate(-25deg)}18%{opacity:1;transform:translateY(0) scale(1.35) rotate(8deg)}35%{transform:scale(.88) rotate(-3deg)}55%{transform:scale(1.08)}100%{opacity:0;transform:translateY(-75px) scale(.55) rotate(12deg)}}@keyframes heroBig{0%{opacity:0;transform:translateY(120px) scale(.02) rotate(-70deg)}18%{opacity:1;transform:translateY(0) scale(1.55) rotate(8deg)}32%{transform:translateY(8px) scale(.82) rotate(-5deg)}48%{transform:scale(1.18) rotate(3deg)}70%{transform:scale(1)}100%{opacity:0;transform:translateY(-110px) scale(.5) rotate(25deg)}}@keyframes heroLegendary{0%{opacity:0;transform:translateY(180px) scale(.01) rotate(-110deg)}15%{opacity:1;transform:translateY(0) scale(1.8) rotate(12deg)}27%{transform:translateY(14px) scale(.76) rotate(-7deg)}43%{transform:scale(1.3) rotate(4deg)}65%{transform:scale(1)}100%{opacity:0;transform:translateY(-150px) scale(.45) rotate(35deg)}}@keyframes heroUltra{0%{opacity:0;transform:translateY(230px) scale(.005) rotate(-180deg)}13%{opacity:1;transform:translateY(0) scale(2) rotate(14deg)}23%{transform:translateY(18px) scale(.72) rotate(-8deg)}40%{transform:scale(1.42) rotate(5deg)}58%{transform:scale(1.05)}100%{opacity:0;transform:translateY(-190px) scale(.38) rotate(45deg)}}@keyframes heroMythic{0%{opacity:0;transform:translateY(280px) scale(.001) rotate(-360deg)}12%{opacity:1;transform:translateY(0) scale(2.2) rotate(18deg)}22%{transform:translateY(24px) scale(.68) rotate(-10deg)}38%{transform:scale(1.5) rotate(6deg)}55%{transform:scale(1.12)}72%{transform:scale(1)}100%{opacity:0;transform:translateY(-230px) scale(.32) rotate(60deg)}}@keyframes lionEntrance{0%{opacity:0;transform:translateY(240px) scale(.02)}22%{opacity:1;transform:translateY(0) scale(1.8)}30%{transform:translateY(8px) scale(.9) rotate(-5deg)}38%{transform:translateY(-4px) scale(1.15) rotate(5deg)}48%{transform:translateY(0) scale(1) rotate(-3deg)}55%{transform:scale(1.08) rotate(3deg)}100%{opacity:0;transform:translateY(-180px) scale(.5)}}@keyframes specialIn{0%{opacity:0;transform:scale(.1)}20%{opacity:1;transform:scale(1.4)}45%{transform:scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.7)}}@keyframes roarIn{0%{opacity:0;transform:scale(.2);letter-spacing:0}20%{opacity:1;transform:scale(1.5);letter-spacing:7px}45%{opacity:1;transform:scale(1);letter-spacing:3px}100%{opacity:0;transform:scale(1.2) translateY(-20px)}}@keyframes ground{0%{opacity:0;transform:translate(-50%,0) scale(.1)}20%{opacity:1;transform:translate(-50%,0) scale(1.5)}100%{opacity:0;transform:translate(-50%,0) scale(3.2)}}@keyframes halo{0%{opacity:0;transform:scale(.05)}18%{opacity:1;transform:scale(1)}60%{opacity:.45}100%{opacity:0;transform:scale(var(--hs))}}@keyframes p{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.03)}}@keyframes ring{0%{opacity:.95;transform:translate(-50%,-50%) scale(.08)}100%{opacity:0;transform:translate(-50%,-50%) scale(var(--rs))}}@keyframes beam{0%{height:0;opacity:0}18%{opacity:.95}100%{height:52vh;opacity:0;transform:rotate(var(--a))}}@keyframes star{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.8) rotate(180deg)}}@keyframes label{0%{opacity:0;transform:translateY(18px) scale(.8)}22%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px) scale(.96)}}@keyframes sub{0%{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}@keyframes caption{0%{opacity:0;transform:translateY(12px) scale(.9)}25%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-12px)}}@keyframes mythicTitle{0%{opacity:0;transform:translateY(-25px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(.9)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}</style></head><body><iframe class="app" id="app" src="erischat-v17.html?v=20260916-21" title="ErisChat"></iframe><div class="fx" id="fx"></div><script>(()=>{const frame=document.getElementById('app'),fx=document.getElementById('fx');let bound=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(String(v??'').replace(/\./g,'').replace(/,/g,''))||0;const tier=v=>v>=20000?'mythic':v>=10000?'ultra':v>=5000?'legendary':v>=1000?'big':v>=100?'premium':'small';const cfg={small:{dur:1000,count:8,hs:5,rs:5,start:55,end:-55,bounce:-4,hit:1.08,rot:-10,caption:'✨ Gönderildi'},premium:{dur:1300,count:16,hs:7,rs:7,start:75,end:-80,bounce:-18,hit:1.2,rot:-25,caption:'💎 Özel Hediye'},big:{dur:1650,count:32,hs:9,rs:9,start:105,end:-120,bounce:-30,hit:1.4,rot:-70,caption:'🔥 Büyük Hediye'},legendary:{dur:2000,count:55,hs:12,rs:12,start:145,end:-165,bounce:-48,hit:1.52,rot:-100,caption:'🌟 Efsanevi Hediye'},ultra:{dur:2400,count:85,hs:15,rs:15,start:180,end:-205,bounce:-58,hit:1.65,rot:-140,caption:'⚡ Ultra Hediye'},mythic:{dur:3000,count:125,hs:20,rs:19,start:215,end:-245,bounce:-72,hit:1.82,rot:-180,caption:'👑 MİTHİK HEDİYE'}};function roar(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(120,a.currentTime);o.frequency.exponentialRampToValueAtTime(42,a.currentTime+.65);f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.16,a.currentTime+.06);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.72);o.connect(f);f.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.75);setTimeout(()=>a.close(),900)}catch(e){}}function specialFor(icon,name,t){const s=(icon+' '+name).toLowerCase();if(s.includes('🦁')||s.includes('aslan'))return 'lion';if(t==='mythic')return 'mythic';return ''}function fire(icon,name,to,price){const t=tier(n(price)),c=cfg[t],sp=specialFor(icon,name,t);let rings='',beams='',stars='';for(let i=0;i<Math.min(1+Object.keys(cfg).indexOf(t),6);i++)rings+=`<i class="ring ${t} go" style="--rs:${c.rs+i*2};--rd:${c.dur}ms;animation-delay:${i*90}ms"></i>`;if(t==='legendary'||t==='ultra'||t==='mythic')for(let i=0;i<(t==='mythic'?18:t==='ultra'?11:7);i++)beams+=`<i class="beam ${t} go" style="--a:${Math.random()*360}deg;animation-delay:${i*35}ms"></i>`;if(t==='ultra'||t==='mythic')for(let i=0;i<(t==='mythic'?24:12);i++)stars+=`<i class="star go" style="--x:${Math.random()*420-210}px;--y:${Math.random()*320-180}px;animation-delay:${Math.random()*250}ms">✦</i>`;const special=sp==='lion'?`<div class="special lion go">🦁</div><div class="roar go">RAAAWR!</div><div class="ground go"></div>`:sp==='mythic'?`<div class="mythicLabel go">👑 MİTHİK GELİYOR 👑</div>`:'';fx.innerHTML=`<div class="stage"><div class="halo ${t} go" style="--dur:${c.dur}ms;--hs:${c.hs}"></div>${rings}${beams}${stars}${special}<div class="hero ${t} go" style="--dur:${c.dur}ms;--start:${c.start}px;--end:${c.end}px;--bounce:${c.bounce}px;--hit:${c.hit};--rot:${c.rot}deg">${esc(icon||'✨')}</div><div class="label go">${esc(name||'Hediye')} · ${esc(price||'')} Lidyum</div><div class="sub go">${esc(to||'')} kişisine gönderildi</div><div class="tier go">${c.caption}</div></div>`;for(let i=0;i<c.count;i++){const p=document.createElement('i');p.className='p '+t+' go';const spread=t==='mythic'?330:t==='ultra'?275:t==='legendary'?225:t==='big'?180:t==='premium'?145:115;p.style.setProperty('--x',(Math.random()*spread*2-spread)+'px');p.style.setProperty('--y',(Math.random()*spread*1.8-spread*.9)+'px');p.style.setProperty('--pd',(650+Math.random()*950)+'ms');p.style.animationDelay=Math.random()*180+'ms';fx.appendChild(p)}if(sp==='lion'&&(t==='legendary'||t==='ultra'||t==='mythic'))setTimeout(roar,220);setTimeout(()=>fx.innerHTML='',c.dur+700)}function bind(){if(bound)return;const d=frame.contentDocument;if(!d)return;bound=true;d.addEventListener('click',e=>{const b=e.target.closest('[data-gift-send]');if(!b)return;const card=b.closest('.gift'),raw=(card?.textContent||'').replace(/\s+/g,' ').trim(),icon=card?.querySelector('b')?.textContent?.trim()||'✨',price=(raw.match(/([\d.,]+) Lidyum/)||[])[1]||'',name=raw.replace(icon,'').replace(/\s*([\d.,]+) Lidyum\s*$/,'').trim(),to=b.dataset.recipient||'';setTimeout(()=>fire(icon,name,to,price),45)})}frame.addEventListener('load',()=>setTimeout(bind,50));setTimeout(bind,900)})();</script></body></html>
